---
# cPanel deployment. Runs when you press "Deploy HEAD Commit" in
# Git Version Control, with the repository checkout as the working directory.
#
# Files are copied OUT of the checkout INTO the live application folder rather
# than the app being run from the checkout directly. That matters: ~/zimpan/server
# also holds things git must never own — the node_modules symlink into the
# virtualenv, Passenger's tmp/ directory, and stderr.log.
#
# Globs rather than a hand-maintained file list, because a list that has to be
# updated every time a file is added is exactly how a deploy ends up missing
# mail.js. Nothing secret can leak through them: .env, node_modules and backups/
# are gitignored, so they are not in the checkout to be copied.
deployment:
  tasks:
    - export DEPLOYPATH=/home/zimpxioc/zimpan
    - /bin/mkdir -p $DEPLOYPATH/ds $DEPLOYPATH/server
    # sitemap.xml and robots.txt are served from the project root by name, so
    # they have to be copied like index.html — a file that never reaches
    # $DEPLOYPATH is a 404 however correct it is in the repository.
    # admin.html and admin.js are the dashboard at /admin. Same rule as the
    # sitemap: the server names them explicitly, so a file that never reaches
    # $DEPLOYPATH is a 404 however correct it is in the repository.
    - /bin/cp -f app.js index.html admin.html admin.js sitemap.xml robots.txt $DEPLOYPATH/
    # Whole directory, not *.css — the stylesheet was joined by favicon.svg and
    # will be joined by og-image.jpg, and an extension list silently drops both.
    - /bin/cp -Rf ds/. $DEPLOYPATH/ds/
    - /bin/cp -f server/*.js server/*.sql server/package.json server/package-lock.json $DEPLOYPATH/server/
    # Passenger watches this file; touching it restarts the app on the next request.
    - /bin/touch $DEPLOYPATH/server/tmp/restart.txt
