<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZIMPAN — Admin</title>

<!-- Nothing here should ever appear in a search result, and the page is not
     for anyone who is not already signed in as an admin. -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="ds/favicon.svg">
<link rel="stylesheet" href="ds/styles.css">

<style>
  /* The dashboard wears the app's design system rather than a second one.
     Everything below is layout for surfaces that only exist here — the tiles,
     the table, the two charts — and every colour comes from a token. */

  body { background: var(--color-bg); color: var(--color-text); }

  .ad-shell { max-width: 1240px; margin: 0 auto; padding: 0 22px 80px; }

  .ad-bar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 16px 0 18px; border-bottom: 1px solid var(--color-divider); margin-bottom: 24px;
  }
  .ad-mark {
    display: flex; align-items: center; gap: 11px;
    font-family: var(--font-heading); font-size: 21px; letter-spacing: -.01em;
  }
  .ad-mark i {
    width: 32px; height: 32px; border-radius: 9px; background: var(--grad-brand);
    display: grid; place-items: center; color: #fff; font-style: normal;
    font-weight: 700; font-size: 16px; flex: none;
  }
  .ad-mark span { font-weight: 700; }
  .ad-mark small {
    display: block; font-family: var(--font-body); font-size: 9px;
    letter-spacing: .16em; text-transform: uppercase; color: var(--color-neutral-600);
  }
  .ad-role {
    font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    padding: 5px 11px; border-radius: 999px;
    background: var(--color-accent-200); color: var(--color-accent-800);
  }
  .ad-role[data-role="manager"] { background: var(--color-neutral-200); color: var(--color-neutral-800); }
  .ad-who { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--color-neutral-700); }

  h2.ad-h { font-family: var(--font-heading); font-size: 19px; margin: 34px 0 14px; }
  h2.ad-h:first-of-type { margin-top: 0; }

  /* — the numbers across the top — */
  .ad-tiles { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(178px, 1fr)); }
  .ad-tile {
    background: var(--color-surface); border-radius: var(--radius-md);
    padding: 16px 18px; border: 1px solid var(--color-divider);
  }
  .ad-tile b {
    display: block; font-family: var(--font-heading); font-size: 30px;
    line-height: 1.1; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .ad-tile span {
    display: block; margin-top: 5px; font-size: 11px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--color-neutral-600);
  }
  .ad-tile em { display: block; margin-top: 7px; font-size: 12px; font-style: normal; color: var(--color-neutral-700); }
  .ad-tile.is-lead { background: var(--grad-brand); border-color: transparent; color: #fff; }
  .ad-tile.is-lead span, .ad-tile.is-lead em { color: color-mix(in srgb, #fff 78%, transparent); }

  /* — charts — */
  .ad-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
  .ad-card {
    background: var(--color-surface); border: 1px solid var(--color-divider);
    border-radius: var(--radius-md); padding: 18px 20px 20px;
  }
  .ad-card h3 { font-family: var(--font-heading); font-size: 15px; margin: 0 0 3px; }
  .ad-card p.ad-sub { margin: 0 0 16px; font-size: 12px; color: var(--color-neutral-600); }

  /* Bars are backgrounds, so they need this to survive a print. */
  .ad-bars { display: flex; align-items: flex-end; gap: 4px; height: 132px; print-color-adjust: exact; }
  .ad-col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
  .ad-col i { display: block; width: 100%; border-radius: 3px 3px 0 0; background: var(--grad-brand); position: relative; }
  .ad-col.is-money i { background: linear-gradient(180deg, #2bb8a5, #0f766e); }
  .ad-col b {
    position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
    margin-bottom: 3px; font-size: 9.5px; font-weight: 600; white-space: nowrap;
    color: var(--color-neutral-700); font-variant-numeric: tabular-nums;
  }
  .ad-col:first-child b { left: 0; transform: none; }
  .ad-col:last-child b { left: auto; right: 0; transform: none; }
  .ad-axis {
    display: flex; justify-content: space-between; margin-top: 8px;
    font-size: 10.5px; color: var(--color-neutral-600);
  }
  .ad-empty { padding: 26px 0; font-size: 13px; color: var(--color-neutral-600); text-align: center; }

  /* — the user table — */
  /* — a help request, as it came in —
     The whole message, not a preview: the point of this list is to read what
     people said, and a truncated one only makes somebody click to a route
     that would have to exist for the purpose. */
  .ad-ticket { padding: 14px 0; border-top: 1px solid var(--color-divider); }
  .ad-ticket:first-of-type { border-top: 0; }
  .ad-ticket-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  .ad-ref {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
    font-weight: 600; color: var(--color-accent-800);
    background: var(--color-accent-200); padding: 2px 8px; border-radius: 6px;
  }
  .ad-ticket-from { font-size: 12.5px; color: var(--color-accent-700); }
  .ad-ticket-when { font-size: 11.5px; color: var(--color-neutral-600); margin-left: auto; }
  .ad-ticket-subject { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  /* pre-wrap, because paragraphs are what somebody typed and collapsing them
     turns a structured complaint into one long sentence. */
  .ad-ticket-body {
    white-space: pre-wrap; font-size: 13px; line-height: 1.6;
    color: var(--color-neutral-800); border-left: 2px solid var(--color-divider); padding-left: 12px;
  }

  /* The one control on a ticket. Under the message rather than beside the
     reference, because it is a thing you do after reading, not before. */
  .ad-ticket-foot {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-top: 10px; padding-left: 12px;
  }
  .ad-status {
    font-size: 12.5px; padding: 5px 10px; min-height: 32px; width: auto;
  }
  .ad-ticket-stamp { font-size: 11.5px; color: var(--color-neutral-600); }
  .ad-ticket-stamp.good { color: #0a6b4a; }
  .ad-ticket-stamp.bad { color: #a4291f; }

  /* The SEO fields, folded away. They are written after the post, not while
     writing it, and open by default only when a post already has them. */
  .ad-meta { margin-bottom: 14px; border: 1px solid var(--color-divider); border-radius: 12px; }
  .ad-meta summary {
    list-style: none; cursor: pointer; padding: 11px 14px;
    font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--color-neutral-700); display: flex; align-items: center; gap: 8px;
  }
  .ad-meta summary::-webkit-details-marker { display: none; }
  .ad-meta summary::before { content: '+'; color: var(--color-accent-700); font-size: 15px; }
  .ad-meta[open] summary::before { content: '−'; }
  .ad-meta[open] summary { border-bottom: 1px solid var(--color-divider); margin-bottom: 14px; }
  .ad-meta .ad-field { padding: 0 14px; }
  .ad-meta .ad-field:last-child { padding-bottom: 14px; }

  .ad-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .ad-tools .input { width: auto; flex: 1 1 240px; max-width: 340px; }
  .ad-tools select.input { flex: 0 0 auto; width: auto; }
  .ad-count { margin-left: auto; font-size: 12px; color: var(--color-neutral-600); }

  .ad-scroll { overflow-x: auto; border: 1px solid var(--color-divider); border-radius: var(--radius-md); background: var(--color-surface); }
  table.ad-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 900px; }
  .ad-table th {
    text-align: left; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--color-neutral-600); font-weight: 600;
    padding: 12px 14px; border-bottom: 1px solid var(--color-divider); white-space: nowrap;
  }
  .ad-table td { padding: 12px 14px; border-bottom: 1px solid var(--color-neutral-200); vertical-align: middle; }
  .ad-table tr:last-child td { border-bottom: 0; }
  .ad-table tbody tr:hover { background: color-mix(in srgb, var(--color-accent) 6%, transparent); }
  .ad-num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ad-mail { font-weight: 600; word-break: break-word; }
  /* The gifts table has room to breathe, so its addresses do not need to wrap
     at all — the column simply takes what it needs. */
  .ad-gifts td:first-child { width: 45%; word-break: normal; }

  .ad-pill {
    display: inline-block; font-size: 10.5px; font-weight: 600; padding: 3px 9px;
    border-radius: 999px; white-space: nowrap;
  }
  .ad-pill.on { background: color-mix(in srgb, #0e9f6e 16%, transparent); color: #0a6b4a; }
  .ad-pill.warm { background: color-mix(in srgb, #f59e0b 20%, transparent); color: #8a5a06; }
  .ad-pill.off { background: var(--color-neutral-200); color: var(--color-neutral-700); }
  .ad-pill.role { background: var(--color-accent-200); color: var(--color-accent-800); }

  .ad-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .ad-mini {
    border: 1px solid var(--color-divider); background: var(--color-bg); color: var(--color-text);
    font: inherit; font-size: 11.5px; padding: 4px 10px; border-radius: 999px; cursor: pointer;
  }
  .ad-mini:hover { border-color: var(--color-accent); color: var(--color-accent-700); }

  .ad-more { display: flex; justify-content: center; margin-top: 16px; }

  /* — dialogs — */
  .ad-back {
    position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 20px;
    background: color-mix(in srgb, var(--color-neutral-900) 58%, transparent);
  }
  /* — the blog editor —
     Wider than the other dialogs and allowed to scroll inside itself: this one
     holds a whole article, and a dialog taller than the screen with no scroll
     of its own puts its Save button somewhere unreachable. */
  /* A card whose heading shares its row with an action. */
  .ad-card-head {
    display: flex; align-items: center; gap: 12px; margin-bottom: 4px;
  }
  .ad-card-head h3 { margin: 0; margin-right: auto; }

  .ad-modal.ad-editor {
    width: min(600px, 100%);
    max-height: calc(100vh - 48px);
    overflow-y: auto;
  }
  .ad-field { display: block; margin-bottom: 14px; }
  .ad-field > span {
    display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--color-neutral-700); margin-bottom: 5px;
  }
  .ad-field > span small {
    text-transform: none; letter-spacing: 0; font-size: 11.5px;
    color: var(--color-neutral-600); margin-left: 6px;
  }
  .ad-field .input, .ad-field textarea.input { width: 100%; }
  .ad-field textarea.input { resize: vertical; min-height: 52px; font-family: inherit; }

  .ad-tools { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .ad-tool {
    border: 1px solid var(--color-divider); background: var(--color-bg);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
    font-family: var(--font-body); font-size: 12px; font-weight: 600;
    color: var(--color-neutral-800); line-height: 1;
  }
  .ad-tool:hover { background: var(--color-neutral-100); border-color: var(--color-neutral-400); }

  /* The writing surface. min-height rather than a fixed one so a long post
     grows the box instead of scrolling inside a small window while the dialog
     scrolls around it — two nested scrollbars for one article. */
  .ad-rich {
    border: 1px solid var(--color-divider); border-radius: 12px;
    padding: 14px 16px; min-height: 260px;
    font-size: 15px; line-height: 1.7; background: var(--color-bg);
    overflow-wrap: break-word;
  }
  .ad-rich:focus { outline: 2px solid var(--color-accent-600); outline-offset: 1px; }
  .ad-rich h2 { font-family: var(--font-heading); font-size: 22px; margin: 18px 0 8px; }
  .ad-rich h3 { font-family: var(--font-heading); font-size: 18px; margin: 16px 0 6px; }
  .ad-rich p { margin: 0 0 12px; }
  .ad-rich ul, .ad-rich ol { padding-left: 22px; margin: 0 0 12px; }
  .ad-rich blockquote {
    margin: 12px 0; padding-left: 14px;
    border-left: 3px solid var(--color-accent-400); color: var(--color-neutral-700);
  }
  .ad-rich img { max-width: 100%; height: auto; border-radius: 8px; }
  .ad-rich a { color: var(--color-accent-700); }

  .ad-check { display: flex; align-items: flex-start; gap: 9px; margin: 4px 0 16px; font-size: 13.5px; }
  .ad-check input { margin-top: 2px; }
  .ad-check small { display: block; color: var(--color-neutral-600); font-size: 12px; margin-top: 2px; }
  .ad-modal-acts { display: flex; gap: 10px; justify-content: flex-end; }
  .ad-pill.live { background: color-mix(in srgb, #0e9f6e 16%, transparent); color: #0a6b4a; }

  .ad-modal {
    width: min(440px, 100%); background: var(--color-bg); border-radius: var(--radius-lg);
    padding: 22px 24px 24px; box-shadow: var(--shadow-lg);
  }
  .ad-modal h3 { font-family: var(--font-heading); font-size: 19px; margin: 0 0 4px; }
  .ad-modal p.ad-sub { margin: 0 0 16px; font-size: 12.5px; color: var(--color-neutral-600); }
  .ad-modal .field { margin-bottom: 12px; }
  .ad-modal .ad-row { display: flex; gap: 10px; }
  .ad-modal .ad-row .field { flex: 1; }
  .ad-modal footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }

  .ad-msg { margin: 12px 0 0; font-size: 12.5px; line-height: 1.5; }
  .ad-msg.bad { color: #a4291f; }
  .ad-msg.good { color: #0a6b4a; }

  /* — the gate — */
  .ad-gate { max-width: 400px; margin: 12vh auto; text-align: center; }
  .ad-gate h1 { font-family: var(--font-heading); font-size: 27px; margin: 0 0 8px; }
  .ad-gate p { font-size: 13.5px; line-height: 1.6; color: var(--color-neutral-700); margin: 0 0 20px; }

  .ad-note {
    margin-top: 10px; font-size: 11.5px; line-height: 1.55; color: var(--color-neutral-600);
  }

  @media (max-width: 640px) {
    .ad-shell { padding: 0 14px 60px; }
    .ad-who { width: 100%; margin-left: 0; }
    .ad-tile b { font-size: 25px; }
  }

  /* — the product column —
     A work account is the thing an admin most often needs to pick out of a
     list, so it gets the pill and a personal one gets plain text. */
  .ad-pill.work { background: color-mix(in srgb, #7856f5 16%, transparent); color: #3b2a7a; }
  .ad-team { margin-top: 3px; line-height: 1.3; }
  .ad-team-name { display: block; font-size: 12px; font-weight: 600; }
  .ad-team-role { display: block; font-size: 10.5px; color: var(--color-neutral-600); }

  /* — deleting —
     Red only where it is destructive, and never on a row's default action. */
  .ad-mini.danger { color: #8a2f4a; border-color: color-mix(in srgb, #8a2f4a 30%, transparent); }
  .ad-mini.danger:hover { background: color-mix(in srgb, #8a2f4a 8%, transparent); border-color: #8a2f4a; }
  .ad-danger { background: #8a2f4a; color: #fff; border: 0; }
  .ad-danger:hover:not(:disabled) { background: #6f2540; }
  .ad-danger:disabled { opacity: .6; cursor: default; }
  .ad-warn {
    margin: 0 0 14px; padding: 11px 13px; border-radius: 10px;
    background: color-mix(in srgb, #8a2f4a 8%, transparent);
    font-size: 13px; line-height: 1.5; color: #7a2540;
  }
  .ad-gone { font-size: 12px; color: #0d6b60; }

</style>
</head>
<body>
<div id="admin"><div class="ad-shell"><p class="ad-note" style="padding-top:40px;">Loading…</p></div></div>
<script src="admin.js"></script>
</body>
</html>
