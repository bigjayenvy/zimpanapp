<style>
  body { margin: 0; }
  input, select, button { font-family: inherit; }
  .btn { border-radius: 999px; padding-inline: 18px; }
  .btn-icon { border-radius: 999px; padding-inline: 0; }
  .seg { border-radius: 999px; }
  .seg-opt { padding-inline: 15px; }
  input[type="time"]::-webkit-calendar-picker-indicator { opacity: .35; }

  /* — the green —
     --zg-strong is the requested #00a149, used only where the type is large
     enough to clear WCAG AA at its 3.03:1 contrast on this background.
     --zg-text is the same hue darkened to 4.89:1, so the small inline labels
     that replaced grey stay readable on a phone in daylight. */
  :root {
    --zg-strong: #00a149;
    --zg-text: #007a38;
    /* The selected block in the bottom bar. Warm rather than a tint of the
       accent, so it reads as "you are here" against both tracker themes
       without changing colour when the money view repoints the accents. */
    --bn-active: #f6ead4;
    --zg-donate: #e8a33d;
  }

  /* Small inline labels move from grey to green wholesale. neutral-600 is the
     app's caption grey; the darker body greys are deliberately left alone. */
  [data-app] { --color-neutral-600: var(--zg-text); }

  /* — donate —
     Amber rather than an accent shade, so it reads as its own thing against
     both the blue time theme and the green money theme. */
  .btn-donate {
    display: inline-flex; align-items: center; gap: 7px;
    background: #e08a1e; border: 1px solid #c9761200; color: #fff;
    text-decoration: none; font-weight: 600;
    box-shadow: 0 1px 3px color-mix(in srgb, #8a5100 30%, transparent);
  }
  .btn-donate svg { width: 15px; height: 15px; display: block; }
  .btn-donate:hover { background: #c9760f; color: #fff; }
  .btn-donate:focus-visible { outline: 2px solid #8a5100; outline-offset: 2px; }

  /* — money tracker theme —
     Accent tokens are inherited custom properties, so re-declaring them on the
     page wrapper repoints every accent in the money view — buttons, kickers,
     chips, the report sheet — without touching the design system. */
  [data-app="money"] {
    --color-accent: #4f8a63;
    --color-accent-2: #6a9d7c;
    --color-accent-100: #eef7f1;
    --color-accent-200: #d7ecdd;
    --color-accent-300: #b2d9bf;
    --color-accent-400: #8dc3a0;
    --color-accent-500: #6ba982;
    --color-accent-600: #4f8a63;
    --color-accent-700: #3a6b4b;
    --color-accent-800: #274c35;
    --color-accent-900: #163123;
    --color-accent-2-100: #eef7f1;
    --color-accent-2-200: #dceee2;
    --color-accent-2-300: #bcdcc7;
    --color-accent-2-400: #9cc7ab;
    --color-accent-2-500: #7dae8e;
    --color-accent-2-600: #628f72;
    --color-accent-2-700: #4a7057;
    --color-accent-2-800: #33503d;
    --color-accent-2-900: #1f3326;
  }

  /* — loading affordances — */
  @keyframes zimpan-spin { to { transform: rotate(360deg); } }
  .spinner {
    display: inline-block; width: 14px; height: 14px; flex: none;
    border: 2px solid currentColor; border-right-color: transparent;
    border-radius: 50%; animation: zimpan-spin .7s linear infinite;
  }
  .spinner.lg { width: 24px; height: 24px; border-width: 3px; }

  /* Sits above everything while any request is in flight. */
  .topbar { position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 60; pointer-events: none; overflow: hidden; }
  @keyframes zimpan-slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(420%); } }
  .topbar > i { display: block; height: 100%; width: 28%; background: var(--color-accent); animation: zimpan-slide 1.15s ease-in-out infinite; }

  .toast {
    position: fixed; left: 20px; bottom: 20px; z-index: 60;
    background: var(--color-neutral-900); color: var(--color-bg);
    font-family: var(--font-body); font-size: 13px;
    padding: 9px 15px; border-radius: 999px; box-shadow: var(--shadow-md);
    max-width: calc(100vw - 40px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* A labelled control rather than a faint glyph — at 25% opacity nobody
     could tell it was a button. */
  .cell-note {
    border: 1px solid var(--color-divider); background: transparent;
    cursor: pointer; font-family: var(--font-body); font-size: 10.5px;
    line-height: 1; padding: 3px 9px; margin-left: 6px;
    border-radius: 999px; vertical-align: middle; white-space: nowrap;
    color: var(--color-neutral-700);
  }
  .cell-note[data-has-note] {
    border-color: var(--zg-strong); color: var(--zg-text); font-weight: 600;
  }
  .cell-note:hover { background: var(--color-accent-700); border-color: var(--color-accent-700); color: #fff; }
  .cell-note:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 1px; }

  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 2.4s; }
    .topbar > i { animation-duration: 3s; }
  }

  /* — drawers —
     Collapsed sections keep the phone view short. The button says how much is
     hidden, so "Show more" is never a guess. */
  /* Solid pill by default, inverting to white on hover. The accent tokens are
     used rather than a fixed navy so the money tracker's green theme carries
     through here too. */
  .drawer-btn {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--color-accent-700);
    background: var(--color-accent-700);
    color: #fff;
    font-family: var(--font-body); font-size: 12.5px; font-weight: 600;
    padding: 7px 17px; border-radius: 999px; cursor: pointer;
    transition: background-color .15s ease, color .15s ease, border-color .15s ease;
  }
  .drawer-btn:hover,
  .drawer-btn:focus-visible {
    background: #fff;
    color: var(--color-accent-900);
    border-color: var(--color-accent-900);
  }
  .drawer-btn:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .drawer-btn .drawer-caret { font-size: 10px; line-height: 1; opacity: .85; }
  .drawer-row { display: flex; justify-content: center; padding: 12px 0 2px; }

  @media (prefers-reduced-motion: reduce) { .drawer-btn { transition: none; } }

  /* — mobile bottom bar —
     Hidden entirely on desktop; the top bar keeps its buttons there. */
  .bottomnav { display: none; }

  /* Same story, and declared here rather than beside its own rules further
     down: the phone block below turns it on, and an equal-specificity
     `display: none` appearing after that block would quietly win. */
  .stickybar { display: none; }

  @media (max-width: 720px) {
    /* The tabs and the duplicated Donate/Export buttons live in the bottom bar
       on a phone. Who is signed in, and the way out, stay in the header. */
    .appbar-tabs, .appbar-cta { display: none !important; }
    .appbar-actions { margin-left: auto; }
    .appbar-account { flex-direction: column; align-items: flex-end; gap: 0; }
    .appbar-account .btn { padding-inline: 0; }
    .appbar-email { font-size: 11.5px; }

    .bottomnav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 45;
      display: flex; align-items: stretch;
      background: var(--color-bg);
      border-top: 1px solid var(--color-divider);
      box-shadow: 0 -2px 10px color-mix(in srgb, #2b2b2d 10%, transparent);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .bottomnav a, .bottomnav button {
      flex: 1 1 0; min-width: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      border: 0; background: transparent; cursor: pointer;
      font-family: var(--font-body); font-size: 10px; letter-spacing: .01em;
      color: var(--color-neutral-600); text-decoration: none;
      padding: 9px 2px 10px; -webkit-tap-highlight-color: transparent;
      transition: color .15s ease;
    }
    .bottomnav .bn-icon { display: flex; }
    .bottomnav .bn-icon svg { width: 22px; height: 22px; display: block; }
    .bottomnav .bn-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }

    /* The active destination carries a filled block as well as weight and
       colour, so it still reads on a screen in bright sun where the hue washes
       out. Only Time and Money can be current — Report and Insights are
       actions, and nothing should look selected after pressing them. */
    .bottomnav [aria-current="page"] {
      color: var(--color-accent-900); font-weight: 600;
      background: var(--bn-active);
    }
    .bottomnav [aria-current="page"] .bn-icon svg { stroke-width: 2.1; }

    /* The one item that is a link out rather than a destination, so it is
       given the donate amber instead of the nav grey. */
    .bn-donate .bn-icon svg { fill: var(--zg-donate); stroke: var(--zg-donate); }
    .bottomnav button:active .bn-icon, .bottomnav a:active .bn-icon { transform: scale(.92); }
    .bottomnav .bn-icon { transition: transform .12s ease; }
    .bottomnav button:focus-visible, .bottomnav a:focus-visible { outline: 2px solid var(--color-accent); outline-offset: -3px; border-radius: 6px; }

    @media (prefers-reduced-motion: reduce) {
      .bottomnav a, .bottomnav button, .bottomnav .bn-icon { transition: none; }
    }

    /* Content must clear the fixed bar. */
    [data-page-grid] { padding-bottom: 84px !important; }
    .toast { bottom: 78px; }

    .stickybar {
      display: block;
      position: fixed; top: 0; left: 0; right: 0; z-index: 46;
      background: var(--color-neutral-200);
      border-bottom: 1px solid var(--color-divider);
      box-shadow: 0 1px 6px color-mix(in srgb, #2b2b2d 12%, transparent);
      transform: translateY(-101%);
      transition: transform .2s ease;
      pointer-events: none;
    }
    .stickybar.is-on { transform: translateY(0); pointer-events: auto; }
    .stickybar-in { display: flex; align-items: center; gap: 10px; padding: 8px 12px; }
    /* Scrolls rather than wraps: two pills and a mark must stay on one line. */
    .stickybar-controls {
      display: flex; align-items: center; gap: 8px; min-width: 0;
      overflow-x: auto; scrollbar-width: none;
    }
    .stickybar-controls::-webkit-scrollbar { display: none; }
    /* The full wordmark takes 145px of a 320px bar once its tagline is counted,
       which pushes the pills into a scroller. The sticky bar gets the mark and
       the name only. */
    .stickybar-mark {
      margin-left: auto; flex: none; display: flex; align-items: center; gap: 7px;
      border: 0; background: transparent; padding: 0; cursor: pointer;
    }
    .stickybar-name {
      font-family: var(--font-heading); font-weight: 600; font-size: 15px;
      letter-spacing: .02em; line-height: 1; color: var(--color-text);
    }

    /* Narrowest phones: trim the pills rather than let them scroll sideways. */
    @media (max-width: 380px) {
      .stickybar-in { gap: 7px; padding: 8px 10px; }
      .stickybar-controls button { font-size: 11.5px !important; padding: 6px 11px !important; }
      .stickybar-name { font-size: 13.5px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .stickybar { transition: none; }
    }
  }

  /* — landing — */
  .hero {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr);
    gap: 44px; align-items: center;
    max-width: 1180px; margin: 0 auto; padding: 30px 28px 34px;
  }

  .hero-noart { grid-template-columns: minmax(0, 1fr); }
  .hero-noart .hero-art { display: none; }
  .hero-noart .hero-copy { max-width: 760px; margin: 0 auto; text-align: center; }
  .hero-noart .hero-checks { max-width: 560px; margin-left: auto; margin-right: auto; }
  .hero-noart .hero-checks li { justify-content: flex-start; }

  .hero-checks {
    list-style: none; margin: 0 0 26px; padding: 0;
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px 22px;
  }
  .hero-checks li {
    display: flex; align-items: center; gap: 9px;
    font-size: 14.5px; color: var(--color-neutral-800); min-width: 0;
  }
  .hero-check { display: flex; flex: none; color: var(--zg-strong); }
  .hero-check svg { width: 19px; height: 19px; display: block; }

  .landing-points { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
  .feature-card {
    display: flex; align-items: flex-start; gap: 14px;
    background: var(--color-bg); border: 1px solid var(--color-divider);
    border-radius: 14px; padding: 18px 18px 20px;
    box-shadow: 0 1px 3px color-mix(in srgb, #2b2b2d 7%, transparent);
  }
  .feature-badge {
    flex: none; width: 52px; height: 52px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--color-accent-100); color: var(--color-accent-700);
  }
  .feature-badge svg { width: 26px; height: 26px; display: block; }

  @media (max-width: 900px) {
    /* Copy first, then the image — the reading order the mobile design uses. */
    .hero { grid-template-columns: minmax(0, 1fr); gap: 22px; padding: 18px 20px 26px; }
    .hero-checks { gap: 9px 16px; margin-bottom: 20px; }
    .hero-checks li { font-size: 13.5px; }
    .landing-points { gap: 12px; }
    .feature-card { padding: 15px 16px 17px; gap: 12px; }
    .feature-badge { width: 46px; height: 46px; }
    .feature-badge svg { width: 23px; height: 23px; }
  }

  /* Two columns down to the narrowest common phone; the labels shrink rather
     than stacking, which is how the design reads. */
  @media (max-width: 420px) {
    .hero-checks { gap: 8px 12px; }
    .hero-checks li { font-size: 12.5px; }
    .hero-check svg { width: 17px; height: 17px; }
  }
  @media (max-width: 330px) {
    .hero-checks { grid-template-columns: minmax(0, 1fr); }
  }

  /* — app bar — */
  .appbar {
    display: flex; align-items: center; gap: 20px;
    padding: 14px 28px; border-bottom: 1px solid var(--color-divider);
    flex-wrap: wrap;
  }
  .appbar-meta {
    display: flex; align-items: center; gap: 8px; margin-right: auto;
    font-size: 12px; color: var(--color-neutral-700);
  }

  /* — back to top —
     Sits above the bottom bar rather than over it, so it never covers a
     destination. Present at every width; the long money page earns it on a
     desktop too. */
  .backtotop {
    position: fixed; right: 16px; bottom: 20px; z-index: 46;
    width: 44px; height: 44px; border-radius: 50%; border: 0;
    background: var(--color-accent-700); color: #fff;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: 0 2px 10px color-mix(in srgb, #2b2b2d 32%, transparent);
    opacity: 0; visibility: hidden; transform: translateY(6px);
    transition: opacity .18s ease, transform .18s ease, visibility .18s;
  }
  .backtotop svg { width: 21px; height: 21px; display: block; }
  .backtotop.is-on { opacity: 1; visibility: visible; transform: none; }
  .backtotop:hover { background: var(--color-accent-900); }
  .backtotop:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

  /* Clears the fixed bottom bar. Declared after the base rule rather than up in
     the phone block, which comes earlier in this file and would lose to it. */
  @media (max-width: 720px) {
    .backtotop { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
  }

  /* — report toolbar —
     Pinned to the top of the preview's own scroller, so Close and the exports
     stay reachable however long the sheet runs. Darker than the backdrop it
     sits on, or the sheet would read through it as it scrolls past. */
  .report-tools {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-bottom: 14px; padding: 12px 0;
    background: color-mix(in srgb, var(--color-neutral-900) 80%, transparent);
  }
  .report-tools .btn { display: inline-flex; align-items: center; gap: 7px; }

  /* — donation lightbox — */
  .donate-backdrop {
    position: fixed; inset: 0; z-index: 70;
    background: color-mix(in srgb, var(--color-neutral-900) 62%, transparent);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; overflow: auto;
  }
  .donate-sheet {
    position: relative; width: 460px; max-width: 100%;
    background: var(--color-bg); border-radius: 18px;
    padding: 34px 30px 26px; text-align: center;
    box-shadow: var(--shadow-lg);
  }
  .donate-x {
    position: absolute; top: 8px; right: 12px; border: 0; background: transparent;
    font-size: 24px; line-height: 1; color: var(--color-neutral-600);
    cursor: pointer; padding: 4px 8px;
  }
  .donate-x:hover { color: var(--color-text); }
  .donate-kicker {
    font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--color-neutral-600); margin-bottom: 12px;
  }
  .donate-title { margin: 0 0 15px; display: flex; flex-direction: column; gap: 1px; }
  .donate-title span {
    font-family: var(--font-heading); font-weight: 700; font-size: 40px;
    line-height: .98; letter-spacing: .005em;
  }
  .donate-l1 { color: #14a05c; }
  .donate-l2 { color: #1d6f8f; }
  .donate-copy {
    margin: 0 0 20px; font-size: 13.5px; line-height: 1.6;
    color: var(--color-neutral-800);
  }
  .donate-cta {
    display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    width: 100%; border: 0; border-radius: 999px; cursor: pointer;
    padding: 14px 24px; background: linear-gradient(180deg, #f2c552, #d99a1f);
    color: #3d2c05; font-family: var(--font-body); font-size: 16px; font-weight: 700;
    box-shadow: 0 2px 8px color-mix(in srgb, #a06e0a 38%, transparent);
  }
  .donate-cta:hover { background: linear-gradient(180deg, #f6cf68, #c98d16); }
  .donate-cta svg { width: 19px; height: 19px; display: block; fill: currentColor; }
  .donate-later {
    margin-top: 12px; border: 0; background: transparent; cursor: pointer;
    font-family: var(--font-body); font-size: 12.5px;
    color: var(--color-neutral-600); text-decoration: underline;
  }
  .donate-later:hover { color: var(--color-text); }

  @media (max-width: 560px) {
    .donate-sheet { padding: 30px 20px 22px; }
    .donate-title span { font-size: 31px; }
    .donate-copy { font-size: 12.5px; }
    .donate-cta { font-size: 15px; padding: 13px 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .backtotop { transition: none; }
  }

  /* — insights: calorie balance —
     Two half-dials facing each other with the difference between them in the
     middle. On a phone the middle drops below the pair rather than squeezing
     between them, where it would be a two-word column. */
  .cal-kicker {
    font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--color-accent-700); margin: 16px 0 10px;
  }
  .cal-row { display: grid; grid-template-columns: 1fr minmax(0, 1.15fr) 1fr; gap: 8px; align-items: center; }
  .cal-dial { position: relative; text-align: center; min-width: 0; }
  .cal-dial svg { width: 100%; max-width: 132px; height: auto; display: block; margin: 0 auto; }
  .cal-glyph {
    position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%);
    display: flex;
  }
  .cal-glyph svg { width: 21px; height: 21px; }
  .cal-value {
    font-family: var(--font-heading); font-size: 25px; line-height: 1;
    margin-top: -14px;
  }
  .cal-cap {
    font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase;
    color: var(--color-neutral-600); margin-top: 5px; line-height: 1.35;
  }
  .cal-mid { text-align: center; min-width: 0; padding: 0 4px; }
  .cal-net { font-family: var(--font-heading); font-size: 27px; line-height: 1.05; }
  .cal-net span { font-family: var(--font-body); font-size: 11.5px; font-weight: 600; display: block; margin-top: 3px; }
  .cal-note { font-size: 11px; line-height: 1.5; color: var(--color-neutral-600); margin-top: 6px; }
  .cal-rest {
    font-size: 11.5px; line-height: 1.5; color: var(--zg-text);
    font-style: italic; margin-top: 10px;
  }

  /* — insights: the four dimensions —
     Two across, because four in a row makes each one a column of single words
     at the width this section actually gets. */
  .wb-kicker {
    display: block; font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--color-accent-700); margin-bottom: 7px;
  }
  .wb-status { font-size: 13.5px; line-height: 1.6; margin: 16px 0 4px; }
  .wb-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .wb-card {
    border: 1px solid var(--color-divider); border-radius: 12px;
    padding: 13px 14px 14px; background: var(--color-bg); min-width: 0;
  }
  .wb-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .wb-dial { position: relative; flex: none; width: 42px; height: 42px; }
  .wb-dial svg { width: 42px; height: 42px; display: block; }
  .wb-glyph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .wb-glyph svg { width: 18px; height: 18px; }
  .wb-label {
    font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--color-neutral-700); font-weight: 600; min-width: 0;
  }
  .wb-note { font-size: 12px; line-height: 1.55; color: var(--color-neutral-800); }

  /* — insights: pro-tips —
     auto-fit rather than a fixed three: between one and six rules can fire, and
     the row should not leave gaps for cards that were never generated. */
  .tip-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .tip-card {
    border: 1px solid var(--color-divider); border-radius: 12px;
    padding: 13px 14px 14px; background: var(--color-bg); min-width: 0;
  }
  .tip-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .tip-glyph {
    flex: none; width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--color-accent-100); color: var(--color-accent-700);
  }
  .tip-glyph svg { width: 17px; height: 17px; }
  .tip-meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .tip-no {
    font-size: 9px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--color-accent-700);
  }
  .tip-label {
    font-family: var(--font-heading); font-size: 14px; line-height: 1.1;
    overflow-wrap: anywhere;
  }
  .tip-body { font-size: 12px; line-height: 1.55; color: var(--color-neutral-800); }
  .tip-body strong { color: var(--color-text); }

  /* — refine with AI —
     A quieter button than the solid drawer pill: it sits inside a reading
     rather than under one, and should not compete with it. */
  .btn-refine {
    background: #fff; color: #416180; border-color: #416180;
    font-size: 11px; padding: 5px 13px;
  }
  .btn-refine:hover:not(:disabled),
  .btn-refine:focus-visible { background: #416180; color: #fff; border-color: #416180; }
  .btn-refine:disabled { opacity: .6; cursor: default; }

  @media (max-width: 560px) {
    /* The middle reading goes under the pair — between them it would be a
       column two words wide. */
    .cal-row { grid-template-columns: 1fr 1fr; }
    .cal-mid { grid-column: 1 / -1; order: 3; padding-top: 4px; }
    .cal-net { font-size: 23px; }
    .cal-value { font-size: 21px; }
    .wb-grid { grid-template-columns: minmax(0, 1fr); }
    .tip-grid { grid-template-columns: minmax(0, 1fr); }
  }

  /* — financial insights —
     Four figures across where there is room. Left to wrap on its own the
     fourth tile drops to a line by itself on a phone, so the narrow case is
     an explicit 2×2 rather than a 3+1. */
  .fin-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 10px; }
  @media (max-width: 560px) {
    .fin-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px 12px; }
  }

  /* — table cells — */
  .cell-input { width: 100%; border: 0; background: transparent; font: inherit; font-size: 14px; color: inherit; padding: 2px 0; }
  .cell-time { border: 0; background: transparent; font: inherit; font-size: 14px; color: inherit; }
  .cell-num { width: 100%; text-align: right; border: 0; background: transparent; font: inherit; font-size: 14px; color: inherit; }
  .cell-num.is-in { color: var(--color-accent-700); }
  .cell-spent { font-variant-numeric: tabular-nums; color: var(--color-neutral-700); }
  .cell-del { border: 0; background: transparent; cursor: pointer; color: var(--color-neutral-500); font-size: 15px; padding: 2px 4px; }
  .rows-scroll { overflow-x: auto; }

  /* — timer — */
  .timer-card { display: grid; grid-template-columns: auto 1fr auto; gap: 22px; align-items: center; }
  .timer-btn {
    padding: 60px 40px; border-radius: 20px; cursor: pointer;
    font-family: var(--font-heading); font-weight: 600; font-size: 20px;
    color: var(--color-bg);
  }
  /* The block is tall by design; on a phone it should not eat the whole screen. */
  @media (max-width: 900px) { .timer-btn { padding: 34px 40px; } }

  /* — report — */
  .report-wrap { padding: 36px 20px; }
  .report-sheet { padding: 46px 52px 52px; }
  .report-donut { width: 230px; height: 230px; }

  /* ── responsive ──────────────────────────────────────────────
     One layout all the way down. The page grid drops to a single
     column first; below that the cards stack internally and the
     entry tables become stacked rows, so every field stays
     editable without a sideways scroll. */

  @media (max-width: 1240px) {
    [data-page-grid] { grid-template-columns: minmax(0, 1fr) !important; }
  }

  @media (max-width: 900px) {
    [data-page-grid] { padding: 22px 18px !important; gap: 18px !important; }
    .timer-card { grid-template-columns: minmax(0, 1fr); gap: 16px; }
    .timer-btn { width: 100%; }
  }

  @media (max-width: 720px) {
    .appbar { padding: 12px 16px; gap: 10px 12px; }
    .appbar-meta { order: 9; flex: 1 0 100%; margin-right: 0; }
    .appbar .btn { margin-left: auto; }

    [data-page-grid] { padding: 18px 14px !important; }

    /* Entry rows stop being a table and become stacked records. */
    .rows-scroll { overflow-x: visible; }
    .rows, .rows tbody, .rows tr, .rows td { display: block; }
    .rows thead { display: none; }
    .rows tr {
      display: flex; flex-wrap: wrap; align-items: center; gap: 7px 12px;
      padding: 13px 0; border-bottom: 1px solid var(--color-divider);
    }
    .rows td { border: 0; padding: 0; }
    .rows td[data-col="activity"] { flex: 1 1 100%; }
    .rows td[data-col="category"] { flex: 1 1 100%; }
    /* From and To share the row rather than splitting across two: each takes
       just under half, so they always land side by side. */
    .rows td[data-col="from"], .rows td[data-col="to"] { flex: 1 1 42%; min-width: 0; }
    .rows td[data-col="spent"] { flex: 1 1 100%; }
    .rows td[data-col="remove"] { order: 9; margin-left: auto; text-align: right; }
    .rows .cell-num { width: auto; text-align: left; min-width: 74px; }

    /* The activity and its category are the row's content; the times are
       supporting detail, so the content gets the larger type. */
    .rows .cell-input { font-size: 14.5px !important; font-weight: 600; }
    .rows td[data-col="category"] select { font-size: 13px !important; }
    .rows .cell-time { font-size: 13px !important; }
    .rows td[data-label]::before {
      content: attr(data-label); margin-right: 5px;
      font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
      color: var(--color-neutral-600);
    }

    /* Donut beside legend leaves the legend about 110px on a phone, which
       truncates every category name. Stacked, it gets the full width. */
    .chart-row { flex-direction: column; gap: 14px !important; align-items: stretch !important; }
    .chart-row > div:first-child { margin: 0 auto; }

    .report-wrap { padding: 14px 10px; }
    .report-sheet { padding: 26px 20px 30px; }
    .report-donut { width: 190px; height: 190px; margin: 0 auto; }
    .report-hint { display: none; }

    /* Report activity rows: the four fixed columns total more than a phone is
       wide, so they overlapped. The activity takes its own line and the rest
       wrap beneath it. Sizes drop 2px to match the rest of the mobile view. */
    .ract { flex-wrap: wrap; gap: 3px 10px !important; padding: 9px 0 !important; }
    .ract-what { flex: 1 1 100% !important; order: -1; font-size: 12.5px !important; font-weight: 600; }
    .ract-when { flex: 0 0 auto !important; font-size: 10px !important; }
    .ract-cat { flex: 0 1 auto !important; min-width: 0; font-size: 10.5px !important; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ract-amt { flex: 0 0 auto !important; margin-left: auto; text-align: right !important; font-size: 11px !important; }
    .ract-note { padding-left: 0 !important; }
    .ract-note span { font-size: 10.5px !important; }

    /* 2px off the report's own type. */
    .report-sheet h4 { font-size: 19px; }
    .report-sheet table { font-size: 12px; }
    .report-sheet th { font-size: 9px; }
  }

  /* — mobile type scale — 2px down across the app's common sizes. */
  @media (max-width: 720px) {
    .blueprint h4 { font-size: 15px; }
    .cell-input, .cell-time, .cell-num { font-size: 12px !important; }
    .cell-spent { font-size: 12px; }
    .drawer-btn { font-size: 11px; }
    .appbar-meta { font-size: 10.5px; }
  }

  /* Only the report sheet prints, and it has to flow in normal document order:
     the preview backdrop is position:fixed, which pins printed output to a
     single page and would truncate any range longer than a day. */
  @media print {
    .no-print { display: none !important; }
    [data-app] > .appbar,
    [data-app] > [data-page-grid] { display: none !important; }
    [data-app] { min-height: 0 !important; padding-bottom: 0 !important; }
    [data-report-backdrop] {
      position: static !important; inset: auto !important; z-index: auto !important;
      display: block !important; overflow: visible !important;
      background: none !important; padding: 0 !important;
    }
    [data-report-backdrop] > div { width: 100% !important; max-width: none !important; }
    #report-sheet {
      box-shadow: none !important; border: 0 !important;
      padding: 0 !important; background: none !important;
    }
    @page { margin: 14mm; }
  }
</style>
