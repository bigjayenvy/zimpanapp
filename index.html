  .dq-stat.is-out, .dq-stat.is-over { background: #fdf2f1; color: #8f1d14; }
  .dq-stat.is-out { border-color: color-mix(in srgb, #d92d20 22%, transparent); }
  .dq-stat.is-over { border-width: 2px; border-color: color-mix(in srgb, #d92d20 62%, transparent); }
  .dq-stat.is-out .dq-stat-tag { background: color-mix(in srgb, #d92d20 12%, transparent); color: #8f1d14; }
  .dq-stat.is-over .dq-stat-tag { background: #d92d20; color: #fff; }
  .dq-foot { margin: 15px 0 14px; font-size: 11.5px; line-height: 1.55; color: var(--color-neutral-600); }
  .dq-done { width: 100%; min-height: 48px; border-radius: 999px; font-size: 15px; }

  /* On a narrow phone the two cards are still side by side — the comparison is
     the point of the screen — but the type gives way rather than the layout. */
  @media (max-width: 430px) {
    .dq .dq-title { font-size: 19px; }
    .dq-opts { gap: 8px; }
    .dq-opt { padding: 22px 9px 14px; }
    .dq-opt .dq-art { width: 56px; height: 49px; }
    .dq-copy { font-size: 11px; }
    .dq-go { font-size: 13.5px; padding-inline: 8px; }
    .dq-stat { gap: 11px; padding: 26px 12px 15px; }
    .dq-stat .dq-art { width: 64px; height: 56px; }
  }

  /* — donation lightbox — */
  .donate-backdrop {
    position: fixed; inset: 0; z-index: 70;
    background: color-mix(in srgb, var(--color-neutral-900) 62%, transparent);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; overflow: auto;
  }
  /* Overflow hidden so the hero's top corners are clipped to the sheet's
     radius; the sheet itself no longer paints — the hero and the cream body
     each paint their own half. */
  .donate-sheet {
    position: relative; width: 430px; max-width: 100%;
    border-radius: 20px; overflow: hidden; text-align: center;
    box-shadow: var(--shadow-lg); background: #fbf3e4;
  }
  .donate-hero { position: relative; height: 168px; }
  .donate-hero svg { display: block; width: 100%; height: 100%; }
  /* The X rides on the hero, so it is white on the gradient. */
  .donate-x {
    position: absolute; top: 12px; right: 14px; z-index: 2; border: 0;
    width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
    background: color-mix(in srgb, #241f30 42%, transparent); color: #fff;
    font-size: 19px; line-height: 1; display: flex; align-items: center; justify-content: center;
  }
  .donate-x:hover { background: color-mix(in srgb, #241f30 62%, transparent); }
  /* The cream lower half. It overlaps the hero by a hair and rounds its own
     top, so the two meet on a soft seam rather than a hard line. */
  .donate-body {
    position: relative; margin-top: -14px; border-radius: 20px 20px 0 0;
    background: #fbf3e4; padding: 22px 30px 26px;
  }
  /* A framed pill rather than bare small caps, the way the reference sets it. */
  .donate-chip {
    display: inline-block; margin-bottom: 14px; padding: 5px 13px;
    border: 1px solid color-mix(in srgb, #b8892e 34%, transparent); border-radius: 999px;
    font-size: 10px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600;
    color: #9a6f22; background: color-mix(in srgb, #f2d79a 26%, transparent);
  }
  .donate-title { margin: 0 0 15px; display: flex; flex-direction: column; gap: 2px; }
  /* Sized to keep each phrase on its own line — the reference sets it two lines,
     not four. clamp lets it give way on the narrowest phones rather than
     overflowing. nowrap holds "DONATE A DOLLAR" together. */
  .donate-title span {
    font-family: var(--font-heading); font-weight: 700;
    font-size: clamp(26px, 8.2vw, 33px); line-height: 1.02; letter-spacing: .004em; white-space: nowrap;
  }
  .donate-l1 { color: #14a05c; }
  .donate-l2 { color: #1d6f8f; }
  .donate-copy {
    margin: 0 0 20px; font-size: 13.5px; line-height: 1.6;
    color: #6b5f4a;
  }
  .donate-cta {
    display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    width: 100%; border: 0; border-radius: 999px; cursor: pointer;
    padding: 14px 24px; background: linear-gradient(180deg, #f2c552, #d99a1f);
    color: #3d2c05; font-family: var(--font-body); font-size: 16px; font-weight: 700;
    box-shadow: 0 2px 8px color-mix(in srgb, #a06e0a 38%, transparent);
  }
  .donate-cta:hover { background: linear-gradient(180deg, #f6cf68, #c98d16); }
  .donate-cta svg { width: 19px; height: 19px; display: block; fill: currentColor; }
  .donate-later {
    margin-top: 12px; border: 0; background: transparent; cursor: pointer;
    font-family: var(--font-body); font-size: 12.5px;
    color: var(--color-neutral-600); text-decoration: underline;
  }
  .donate-later:hover { color: var(--color-text); }

  @media (max-width: 560px) {
    .donate-hero { height: 148px; }
    .donate-body { padding: 20px 20px 22px; }
    .donate-title span { font-size: clamp(24px, 8vw, 30px); }
    .donate-copy { font-size: 12.5px; }
    .donate-cta { font-size: 15px; padding: 13px 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .backtotop { transition: none; }
  }

  /* — section headers —
     A solid bar rather than a line of text: on a phone every section is a white
     card on a white page, and a heading that is only bigger type does not read
     as a division. Drawn from the accent tokens, so the money tracker takes it
     into green without a second rule. */
  .card-w-head { padding: 0 !important; overflow: hidden; }
  .card-body { padding: 18px 22px 20px; }
  .card-head {
    background: var(--color-accent-900); color: #fff;
    padding: 14px 22px; display: flex; align-items: center;
    gap: 10px 14px; flex-wrap: wrap;
  }
  .card-head-main { min-width: 0; margin-right: auto; }
  .card-head h4 { margin: 0; color: #fff; font-size: 17px; line-height: 1.25; }
  .card-head-meta {
    display: block; margin-top: 3px; font-size: 11.5px; line-height: 1.45;
    color: color-mix(in srgb, #fff 74%, transparent);
  }
  .card-head-right { display: flex; align-items: center; gap: 8px; flex: none; }
  /* The range switch sits on a dark ground here, so its own light styling
     would vanish into it — the white pill and the brand gradient the switch
     wears everywhere else both disappear against this head. Transparent
     track, white pill for the selected one, dark text inside it. */
  .card-head .seg { background: transparent; border-color: color-mix(in srgb, #fff 34%, transparent); }
  .card-head .seg-opt + .seg-opt { border-left-color: color-mix(in srgb, #fff 26%, transparent); }
  .card-head .seg-opt span { color: color-mix(in srgb, #fff 82%, transparent); }
  .card-head .seg-opt:has(input:checked) { background: #fff; }
  .card-head .seg-opt input:checked + span { color: var(--color-accent-900); }
  .head-btn {
    width: 34px; height: 34px; border-radius: 10px; cursor: pointer;
    border: 1px solid color-mix(in srgb, #fff 32%, transparent);
    background: color-mix(in srgb, #fff 12%, transparent); color: #fff;
    font-size: 17px; line-height: 1; display: flex; align-items: center; justify-content: center;
  }
  .head-btn:hover { background: color-mix(in srgb, #fff 24%, transparent); }
  .head-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  /* The insights heading is a bar and nothing else — no body to pad. */
  .insights-head .card-head { padding-block: 16px; }
  .insights-head .card-head h4 { font-size: 21px; }

  /* — logged entries —
     A card each, gathered under the category it belongs to, two columns wide at
     every width. CSS columns rather than a grid: the blocks are all different
     heights, and a grid row would size itself to the tallest one and leave a
     hole under every other. `break-inside` keeps a category whole. */
  .entry-list { column-count: 2; column-gap: 16px; }
  .entry-group { break-inside: avoid; margin: 0 0 16px; }
  .entry-tab {
    display: inline-block; max-width: 100%; margin: 0 0 -8px; padding: 6px 15px;
    border-radius: 10px 10px 0 0; color: #fff; font-weight: 600;
    font-size: 12px; letter-spacing: .01em; position: relative; z-index: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .entry-card {
    background: var(--color-bg); border: 1px solid var(--color-divider);
    border-radius: 12px; padding: 14px 16px 12px; margin-top: 10px;
    box-shadow: 0 1px 3px color-mix(in srgb, #2b2b2d 8%, transparent);
  }
  .entry-tab + .entry-card { margin-top: 0; border-top-left-radius: 4px; }
  .entry-name {
    width: 100%; border: 0; background: transparent; font: inherit;
    font-size: 15px; font-weight: 600; color: var(--color-text); padding: 0 0 2px;
  }
  .entry-name:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .entry-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 7px 0 11px; }
  .entry-controls .cell-note { margin-left: 0; }
  .entry-select { max-width: 100%; }
  .entry-times { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  /* Legend and field travel together, so the pair can stack as a unit once the
     column is too narrow to hold both times on one line. */
  .entry-time { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .entry-leg {
    font-size: 10px; letter-spacing: .09em; text-transform: uppercase;
    color: var(--color-neutral-600); flex: none;
  }
  .entry-times .cell-time { font-size: 14px !important; font-variant-numeric: tabular-nums; }
  .entry-rule { flex: 1 1 20px; height: 1px; background: var(--color-divider); min-width: 14px; }
  .entry-foot {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-top: 9px; padding-top: 9px;
    border-top: 1px solid var(--color-divider);
  }
  .entry-dur { font-size: 12.5px; color: var(--color-neutral-700); font-variant-numeric: tabular-nums; }
  /* What this one entry did to the calorie ledger. Sits between the duration
     and the delete, so the right edge of every card reads the same way. */
  .entry-kcal {
    margin-left: auto; flex: none; white-space: nowrap;
    font-size: 10.5px; font-weight: 600; line-height: 1;
    padding: 4px 9px; border-radius: 999px;
  }
  .entry-kcal[data-kind="food"] { background: color-mix(in srgb, var(--zg-donate) 20%, #fff); color: #8a5a10; }
  .entry-kcal[data-kind="burn"] { background: color-mix(in srgb, var(--zg-strong) 18%, #fff); color: #06603f; }

  /* — insights: calorie balance —
     Four half-dials on one scale: what exercise burned, what food brought in,
     what the body spent at rest, and the three netted off. Two across on a
     phone rather than four, where each would be a column one word wide. */
  .cal-kicker {
    font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--color-accent-700); margin: 16px 0 10px;
  }
  .cal-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 8px; align-items: start; }
  .cal-dial { position: relative; text-align: center; min-width: 0; }
  /* The glyph is placed against the arc, not against .cal-dial.

     .cal-dial is as tall as whatever caption sits under it, and the captions
     differ in length from one dial to the next — so a percentage of it put the
     icon in a different place on each, and on the longest one ("Calories
     burned from workout and movement") it landed on top of the number. This
     box is the arc alone: a fixed 110x62 viewBox that cannot move. */
  .cal-arc { position: relative; width: 100%; max-width: 132px; margin: 0 auto; }
  .cal-dial svg { width: 100%; height: auto; display: block; }
  .cal-glyph {
    position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%);
    display: flex;
  }
  .cal-glyph svg { width: 21px; height: 21px; }
  /* Was -14px, which pulled the number up into the arc and left the glyph
     nowhere to sit. The arc's own viewBox has room below its ends. */
  .cal-value {
    font-family: var(--font-heading); font-size: 25px; line-height: 1;
    margin-top: -8px;
  }
  .cal-cap {
    font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase;
    color: var(--color-neutral-600); margin-top: 5px; line-height: 1.35;
  }
  /* — net calories, day by day —
     Bars from a zero line, deficit above and surplus below. The two sides are
     scaled independently so the smaller one stays visible. */
  .net-block { margin-top: 16px; }
  .net-chart { margin-top: 4px; }
  .net-bars {
    display: flex; align-items: stretch; gap: 3px;
    /* The top and bottom padding is where the outermost bar's number goes. The
       halves are percentages of the content box, so reserving the room here
       shortens the bars to make space rather than letting a label escape. */
    height: 132px; padding: 15px 0;
    /* The zero line, drawn once across the whole row rather than per column. */
    background: linear-gradient(to bottom,
      transparent calc(var(--zero) - 1px),
      color-mix(in srgb, var(--color-accent-900) 26%, transparent) calc(var(--zero) - 1px),
      color-mix(in srgb, var(--color-accent-900) 26%, transparent) var(--zero),
      transparent var(--zero));
  }
  /* The bars are backgrounds, and the PDF export is a print — without this the
     browser drops the fill and the chart prints as an empty row of outlines.
     Applied here rather than in @media print so the same rule covers a user
     printing the page themselves. */
  .net-bars, .net-half i, .net-key { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  .net-col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; }
  .net-half { display: flex; }
  .net-up { align-items: flex-end; }
  .net-down { align-items: flex-start; }
  .net-half i { width: 100%; border-radius: 2px; position: relative; }
  .net-up i { background: var(--zg-strong); border-radius: 3px 3px 0 0; }
  .net-down i { background: var(--zg-alert); border-radius: 0 0 3px 3px; }

  /* The number the bar is worth, printed at its outer end. Outside the bar
     rather than inside it: a short bar has no room within itself, and a figure
     that sometimes sits inside and sometimes above reads as two conventions. */
  .net-half b {
    position: absolute; left: 50%; transform: translateX(-50%);
    font-size: 9.5px; font-weight: 600; line-height: 1; white-space: nowrap;
    font-variant-numeric: tabular-nums; pointer-events: none;
  }
  .net-up b { bottom: 100%; margin-bottom: 3px; color: var(--zg-strong); }
  .net-down b { top: 100%; margin-top: 3px; color: var(--zg-alert); }
  /* Centred on its column everywhere except the two ends, where centring would
     hang half the number off the side of the chart. */
  .net-col:first-child b { left: 0; transform: none; }
  .net-col:last-child b { left: auto; right: 0; transform: none; }
  /* Past this many columns the labels are wider than the bars they belong to,
     and printing them all overlaps them into a smear. The two peaks stay: they
     are the figures a crowded chart is still being asked for, and they are far
     enough apart from everything else to have the room. */
  .net-bars.is-dense b:not(.net-peak) { display: none; }
  .net-peak { font-weight: 700; }

  .net-axis {
    display: flex; justify-content: space-between;
    margin-top: 6px; font-size: 10.5px; color: var(--color-neutral-600);
  }
  .net-legend {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    margin-top: 8px; font-size: 11.5px; color: var(--color-neutral-700);
  }
  .net-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .net-key { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
  .net-key-up { background: var(--zg-strong); }
  .net-key-down { background: var(--zg-alert); }
  .net-avg { margin-left: auto; font-weight: 600; color: var(--color-text); }
  .net-note { margin-top: 7px; font-size: 11.5px; line-height: 1.55; color: var(--color-neutral-600); }

  @media (max-width: 560px) {
    .net-bars { height: 108px; gap: 2px; }
    .net-half b { font-size: 8.5px; }
    /* Half the width for the same month, so the labels give out sooner. */
    .net-bars.is-dense-phone b:not(.net-peak) { display: none; }
    .net-avg { margin-left: 0; flex-basis: 100%; }
  }

  /* Stands in for the gauges when neither side of the balance has anything in
     it, so the panel explains itself rather than vanishing. */
  .cal-empty {
    font-size: 13px; line-height: 1.6; color: var(--color-neutral-700);
    background: var(--color-accent-100); border-radius: var(--radius-md);
    padding: 13px 15px;
  }
  .cal-empty strong { color: var(--color-text); }

  /* The sentence under a dial that says where its figure came from. */
  .cal-sub { font-size: 11px; line-height: 1.5; color: var(--color-neutral-700); margin-top: 6px; }
  .cal-note { font-size: 11px; line-height: 1.5; color: var(--color-neutral-600); margin-top: 6px; }

  /* Set the weight from the reading it changes, rather than only from the card
     further down. Styled as a link because it sits inside a sentence. */
  .cal-link {
    border: 0; background: transparent; padding: 0; cursor: pointer;
    font: inherit; color: var(--color-accent-700);
    text-decoration: underline; text-underline-offset: 2px;
  }
  .cal-link:hover { color: var(--color-accent-900); }
  .cal-link:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; border-radius: 3px; }

  .cal-weight {
    display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
    margin-top: 14px; padding: 12px 14px;
    border: 1px solid var(--color-divider); border-radius: 12px;
    background: var(--color-accent-100);
  }
  .cal-weight label { font-size: 12px; color: var(--color-neutral-700); }
  .cal-weight input { width: 92px; text-align: right; }
  .cal-weight-unit { font-size: 12.5px; color: var(--color-neutral-700); }
  .cal-weight-note { font-size: 11px; color: var(--color-neutral-600); flex: 1 1 100%; }

  .cal-rest {
    font-size: 11.5px; line-height: 1.5; color: var(--zg-text);
    font-style: italic; margin-top: 12px;
  }

  /* — insights: the four dimensions —
     Two across, because four in a row makes each one a column of single words
     at the width this section actually gets. */
  .wb-kicker {
    display: block; font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--color-accent-700); margin-bottom: 7px;
  }
  .wb-status { font-size: 13.5px; line-height: 1.6; margin: 16px 0 4px; }
  .wb-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .wb-card {
    border: 1px solid var(--color-divider); border-radius: 12px;
    padding: 13px 14px 14px; background: var(--color-bg); min-width: 0;
  }
  .wb-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .wb-dial { position: relative; flex: none; width: 42px; height: 42px; }
  .wb-dial svg { width: 42px; height: 42px; display: block; }
  .wb-glyph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .wb-glyph svg { width: 18px; height: 18px; }
  .wb-label {
    font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--color-neutral-700); font-weight: 600; min-width: 0;
  }
  .wb-note { font-size: 12px; line-height: 1.55; color: var(--color-neutral-800); }
  /* The way into the activities behind a pillar's figure. Quiet, because it
     sits under a reading rather than over one. */
  .wb-see {
    margin-top: 10px; border: 0; background: transparent; padding: 0; cursor: pointer;
    font-family: var(--font-body); font-size: 11.5px; font-weight: 600;
    color: var(--color-accent-700); text-decoration: underline; text-underline-offset: 3px;
  }
  .wb-see:hover { color: var(--color-accent-900); }
  .wb-see:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; border-radius: 4px; }

  /* — insights: pro-tips —
     auto-fit rather than a fixed three: between one and six rules can fire, and
     the row should not leave gaps for cards that were never generated. */
  .tip-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .tip-card {
    border: 1px solid var(--color-divider); border-radius: 12px;
    padding: 13px 14px 14px; background: var(--color-bg); min-width: 0;
  }
  .tip-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .tip-glyph {
    flex: none; width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--color-accent-100); color: var(--color-accent-700);
  }
  .tip-glyph svg { width: 17px; height: 17px; }
  .tip-meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .tip-no {
    font-size: 9px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--color-accent-700);
  }
  .tip-label {
    font-family: var(--font-heading); font-size: 14px; line-height: 1.1;
    overflow-wrap: anywhere;
  }
  .tip-body { font-size: 12px; line-height: 1.55; color: var(--color-neutral-800); }
  .tip-body strong { color: var(--color-text); }

  /* — refine with AI —
     A quieter button than the solid drawer pill: it sits inside a reading
     rather than under one, and should not compete with it. */
  .btn-refine {
    background: #fff; color: #5f3ac9; border-color: #5f3ac9;
    font-size: 11px; padding: 5px 13px;
  }
  .btn-refine:hover:not(:disabled),
  .btn-refine:focus-visible { background: #5f3ac9; color: #fff; border-color: #5f3ac9; }
  .btn-refine:disabled { opacity: .6; cursor: default; }

  .food-text { font-size: 12.5px; line-height: 1.55; color: var(--color-neutral-800); }
  .food-items { margin-top: 6px; font-size: 11.5px; line-height: 1.6; color: var(--color-neutral-700); }

  /* — desktop reading size —
     The insights type was set for a 463px column and stayed put when the
     section moved to the 718px one, where it reads as small print. Only the
     prose grows; labels and kickers are already at their size. */
  @media (min-width: 1241px) {
    .wb-note, .tip-body, .food-text { font-size: 14px; line-height: 1.6; }
    .wb-status { font-size: 15px; }
    .food-items { font-size: 12.5px; }
    .cal-note, .cal-sub { font-size: 12px; }
    .tip-label { font-size: 15px; }
    .wb-label { font-size: 10.5px; }
    .cal-value { font-size: 28px; }
  }

  /* — mobile section order —
     `display: contents` dissolves the two layout columns on a phone so every
     section becomes a direct child of the page grid and `order` can interleave
     them. Reordering across two separate containers is otherwise impossible,
     and re-rendering a different DOM order on resize would mean the order was
     wrong until something happened to trigger a render. */
  /* Declared here rather than inline on the element, because an inline
     `display: flex` outranks any stylesheet rule and the phone breakpoint below
     has to be able to dissolve it. */
  .col { display: flex; flex-direction: column; gap: 22px; min-width: 0; }

  @media (max-width: 1240px) {
    [data-page-grid] > .col { display: contents; }
    [data-page-grid] [data-sec] { min-width: 0; }
    [data-sec="entry"]      { order: 1; }
    [data-sec="entrycard"]  { order: 2; }
    [data-sec="log"]        { order: 3; }
    [data-sec="chart"]      { order: 4; }
    [data-sec="board"]      { order: 5; }
    [data-sec="stats"]      { order: 6; }
    [data-sec="timeline"]   { order: 7; }
    [data-sec="ins-head"]   { order: 8; }
    [data-sec="ins-today"]  { order: 9; }
    [data-sec="ins-past"]   { order: 10; }
    [data-sec="ins-weight"] { order: 11; }
  }

  @media (max-width: 560px) {
    .card-head { padding: 13px 16px; }
    .card-head h4 { font-size: 16px; }
    .insights-head .card-head h4 { font-size: 18px; }
    .card-body { padding: 16px 16px 18px; }
    /* Two by two. Four across leaves each dial a column one word wide. */
    .cal-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cal-value { font-size: 21px; }
    .cal-sub { font-size: 10.5px; }
    .cal-weight input { width: 78px; }
    .wb-grid { grid-template-columns: minmax(0, 1fr); }
    .tip-grid { grid-template-columns: minmax(0, 1fr); }
  }

  /* — financial insights —
     Four figures across where there is room. Left to wrap on its own the
     fourth tile drops to a line by itself on a phone, so the narrow case is
     an explicit 2×2 rather than a 3+1. */
  .fin-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 10px; }
  @media (max-width: 560px) {
    .fin-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px 12px; }
  }

  /* — table cells — */
  .cell-input { width: 100%; border: 0; background: transparent; font: inherit; font-size: 14px; color: inherit; padding: 2px 0; }
  .cell-time { border: 0; background: transparent; font: inherit; font-size: 14px; color: inherit; }
  .cell-num { width: 100%; text-align: right; border: 0; background: transparent; font: inherit; font-size: 14px; color: inherit; }
  .cell-num.is-in { color: var(--color-accent-700); }
  .cell-spent { font-variant-numeric: tabular-nums; color: var(--color-neutral-700); }
  .cell-del { border: 0; background: transparent; cursor: pointer; color: var(--color-neutral-500); font-size: 15px; padding: 2px 4px; }
  .rows-scroll { overflow-x: auto; }

  /* — timer — */
  /* — the timer —
     One geometry, two skins: the tokens below are what change when it runs, so
     starting the timer recolours the card instead of reflowing it under the
     cursor that just pressed Start. */
  .timer-card {
    --timer-ink: var(--color-text);
    --timer-dim: var(--color-neutral-600);
    --timer-line: color-mix(in srgb, var(--color-accent-900) 12%, transparent);
    /* A faint fill rather than the surface colour: on a white card an input
       the same white as the card is not a field, it is a caption. */
    --timer-well: color-mix(in srgb, var(--color-accent-900) 4%, #fff);
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
    gap: 26px; align-items: center;
    padding: 22px 26px; border-radius: var(--radius-lg);
    background: #fff;
    border: 1px solid color-mix(in srgb, var(--color-accent-900) 8%, transparent);
    box-shadow: var(--shadow-sm);
    color: var(--timer-ink);
  }
  .timer-card.is-live {
    --timer-ink: #fff;
    --timer-dim: color-mix(in srgb, #fff 76%, transparent);
    --timer-line: color-mix(in srgb, #fff 42%, transparent);
    --timer-well: color-mix(in srgb, #fff 17%, transparent);
    background: var(--grad-time-money);
    border-color: transparent;
    box-shadow: 0 12px 34px color-mix(in srgb, #4f46e5 30%, transparent);
  }

  .timer-read { min-width: 0; }
  .timer-kicker {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600;
    color: var(--timer-dim); margin-bottom: 6px;
  }
  .timer-card.is-live .timer-kicker { color: color-mix(in srgb, #fff 88%, transparent); }
  .timer-card:not(.is-live) .timer-kicker { color: var(--color-accent-700); }
  /* Two rings and a core — the running dot says "live" the way a signal does,
     which is the one place on this page where motion is information. */
  /* A solid core inside a ring that breathes. Pulsing the whole dot made it
     fade to nothing twice a second, which reads as a rendering fault rather
     than as a signal. */
  .timer-live-dot {
    position: relative; flex: none; width: 7px; height: 7px; border-radius: 50%;
    background: #fff; margin-right: 3px;
  }
  .timer-live-dot::after {
    content: ""; position: absolute; inset: -5px; border-radius: 50%;
    border: 1.5px solid color-mix(in srgb, #fff 60%, transparent);
    animation: zPulse 1.9s ease-in-out infinite;
  }
  .timer-clock {
    font-family: var(--font-heading); font-size: 52px; line-height: 1;
    font-variant-numeric: tabular-nums; letter-spacing: -.01em; color: var(--timer-ink);
  }
  .timer-since { font-size: 12px; color: var(--timer-dim); margin-top: 7px; }
  .timer-since.is-stale { color: var(--timer-ink); font-weight: 600; }

  .timer-fields { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  /* .pick-field carries `flex: 2 1 185px`, which is a width in the row layouts
     it was written for. This column reads the same basis as a height and left
     130px of empty card under a 36px button. Here it is as tall as it is. */
  .timer-fields .pick-field { flex: none; }
  /* The name is the one thing on this card you type into, so it carries a
     pencil. Bordered rather than filled: on the gradient a white field would
     punch a hole in it. */
  .timer-name { position: relative; display: flex; }
  .timer-name input {
    flex: 1; min-width: 0; min-height: 44px; padding: 8px 40px 8px 16px;
    font: inherit; font-size: 15px; color: var(--timer-ink);
    background: var(--timer-well); border: 1px solid var(--timer-line);
    border-radius: 12px;
  }
  .timer-name input::placeholder { color: var(--timer-dim); }
  .timer-name input:focus-visible { outline: 2px solid var(--timer-line); outline-offset: 1px; }
  .timer-pencil {
    position: absolute; right: 13px; top: 50%; transform: translateY(-50%);
    color: var(--timer-dim); pointer-events: none;
  }
  /* The picker keeps its own surface either way — a list has to be readable
     against whatever is behind the card. */
  .timer-card.is-live .pick-field > label { color: color-mix(in srgb, #fff 82%, transparent); }
  .timer-card.is-live .pick-btn { background: var(--timer-well); border-color: var(--timer-line); color: #fff; }
  .timer-card.is-live .pick-caret { color: color-mix(in srgb, #fff 80%, transparent); }

  .timer-btn {
    padding: 26px 34px; border-radius: 16px; cursor: pointer; border: 0;
    font-family: var(--font-heading); font-weight: 700; font-size: 15px;
    letter-spacing: .08em; text-transform: uppercase; white-space: nowrap;
    color: #fff; background: var(--grad-brand);
    box-shadow: 0 6px 20px color-mix(in srgb, #4f46e5 34%, transparent);
  }
  /* On the gradient, a gradient button would disappear into it. */
  .timer-card.is-live .timer-btn {
    background: #2a1d5e;
    box-shadow: 0 8px 22px color-mix(in srgb, #150f33 42%, transparent);
  }
  .timer-btn:hover { filter: brightness(1.06); }
  .timer-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  /* — the log's own controls —
     A search field and two pills on one line: what you are looking for, which
     category, and which day. Bordered pills rather than bare controls, so the
     row reads as three things you can act on rather than as a caption. */
  .log-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  /* The basis is what decides whether this wraps, not the shrink. A wrapping
     flex container lines its items up by their hypothetical size and only
     shrinks them afterwards, within a line — so a generous basis on the field
     pushed the date pill onto a second row and then let the field grow into
     the space it had just vacated. Small basis, grow to fill: the field is as
     wide as what is left, and the line holds until the container is genuinely
     too narrow, at which point wrapping is the right answer anyway. */
  .log-search {
    position: relative; display: flex; align-items: center;
    flex: 1 1 150px; min-width: 150px;
  }
  .log-search input {
    width: 100%; min-height: 44px; padding: 8px 16px 8px 40px;
    font: inherit; font-size: 14px; color: var(--color-text);
    background: var(--color-surface); border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--color-accent-900) 12%, transparent);
  }
  .log-search input::placeholder { color: var(--color-neutral-600); }
  .log-search input:focus-visible {
    outline: none; border-color: var(--color-accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-accent) 16%, transparent);
  }
  .log-search.has-q input { padding-right: 38px; }
  .log-search-icon {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    color: var(--color-neutral-600); pointer-events: none;
  }
  .log-search-clear {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 28px; height: 28px; border: 0; border-radius: 50%; cursor: pointer;
    background: transparent; color: var(--color-neutral-600); font-size: 13px;
  }
  .log-search-clear:hover { background: color-mix(in srgb, var(--color-text) 8%, transparent); }

  .log-pill {
    flex: none; display: flex; align-items: center; gap: 6px;
    min-height: 44px; padding: 0 13px; border-radius: 999px;
    background: var(--color-surface); color: var(--color-text);
    border: 1px solid color-mix(in srgb, var(--color-accent-900) 12%, transparent);
    font-family: var(--font-body); font-size: 13.5px;
  }
  .log-pill > span[aria-hidden] { color: var(--color-neutral-600); flex: none; }
  .log-pill-leg { color: var(--color-neutral-600); flex: none; }
  .log-pill-val { font-weight: 600; }
  .log-pill-caret { font-size: 10px; color: var(--color-neutral-600); margin-left: -3px; }
  /* The select carries no chrome of its own — the pill around it is the
     control, and a native arrow beside our own caret would be two of them. */
  .log-pill select {
    appearance: none; -webkit-appearance: none;
    border: 0; background: transparent; padding: 0 2px 0 0;
    font: inherit; font-weight: 600; color: inherit; cursor: pointer;
    max-width: 104px; text-overflow: ellipsis;
  }
  .log-pill select:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 3px; border-radius: 4px; }
  .log-pill.is-on {
    border-color: var(--color-accent);
    background: color-mix(in srgb, var(--color-accent) 9%, var(--color-surface));
  }
  .log-pill.is-on > span[aria-hidden], .log-pill.is-on .log-pill-leg { color: var(--color-accent-700); }
  .log-pill-btn { cursor: pointer; }
  .log-pill-btn:hover { border-color: var(--color-accent); }
  .log-pill-btn[aria-disabled="true"] { cursor: default; opacity: .55; }
  .log-pill-btn[aria-disabled="true"]:hover { border-color: color-mix(in srgb, var(--color-accent-900) 12%, transparent); }

  /* — report — */
  .report-wrap { padding: 36px 20px; }
  .report-sheet { padding: 46px 52px 52px; }
  .report-donut { width: 230px; height: 230px; }

  /* ── responsive ──────────────────────────────────────────────
     One layout all the way down. The page grid drops to a single
     column first; below that the cards stack internally and the
     entry tables become stacked rows, so every field stays
     editable without a sideways scroll. */

  @media (max-width: 1240px) {
    [data-page-grid] { grid-template-columns: minmax(0, 1fr) !important; }
  }

  @media (max-width: 900px) {
    [data-page-grid] { padding: 22px 18px !important; gap: 18px !important; }
    .timer-card { grid-template-columns: minmax(0, 1fr); gap: 16px; padding: 20px; }
    .timer-clock { font-size: 44px; }
    .timer-btn { width: 100%; padding: 18px 34px; }
  }

  @media (max-width: 720px) {
    .appbar { padding: 12px 16px; gap: 10px 12px; }
    .appbar-meta { order: 9; flex: 1 0 100%; margin-right: 0; }
    .appbar .btn { margin-left: auto; }

    [data-page-grid] { padding: 18px 14px !important; }

    /* Entry rows stop being a table and become stacked records. */
    .rows-scroll { overflow-x: visible; }
    .rows, .rows tbody, .rows tr, .rows td { display: block; }
    .rows thead { display: none; }
    .rows tr {
      display: flex; flex-wrap: wrap; align-items: center; gap: 7px 12px;
      padding: 13px 0; border-bottom: 1px solid var(--color-divider);
    }
    .rows td { border: 0; padding: 0; }
    .rows td[data-col="activity"] { flex: 1 1 100%; }
    .rows td[data-col="category"] { flex: 1 1 100%; }
    /* From and To share the row rather than splitting across two: each takes
       just under half, so they always land side by side. */
    .rows td[data-col="from"], .rows td[data-col="to"] { flex: 1 1 42%; min-width: 0; }
    .rows td[data-col="spent"] { flex: 1 1 100%; }
    .rows td[data-col="remove"] { order: 9; margin-left: auto; text-align: right; }
    .rows .cell-num { width: auto; text-align: left; min-width: 74px; }

    /* The activity and its category are the row's content; the times are
       supporting detail, so the content gets the larger type. */
    .rows .cell-input { font-size: 14.5px !important; font-weight: 600; }
    .rows td[data-col="category"] select { font-size: 13px !important; }
    .rows .cell-time { font-size: 13px !important; }
    .rows td[data-label]::before {
      content: attr(data-label); margin-right: 5px;
      font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
      color: var(--color-neutral-600);
    }

    /* Donut beside legend leaves the legend about 110px on a phone, which
       truncates every category name. Stacked, it gets the full width. */
    .chart-row { flex-direction: column; gap: 14px !important; align-items: stretch !important; }
    .chart-row > div:first-child { margin: 0 auto; }

    .report-wrap { padding: 14px 10px; }
    .report-sheet { padding: 26px 20px 30px; }
    .report-donut { width: 190px; height: 190px; margin: 0 auto; }
    .report-hint { display: none; }

    /* Report activity rows: the four fixed columns total more than a phone is
       wide, so they overlapped. The activity takes its own line and the rest
       wrap beneath it. Sizes drop 2px to match the rest of the mobile view. */
    .ract { flex-wrap: wrap; gap: 3px 10px !important; padding: 9px 0 !important; }
    .ract-what { flex: 1 1 100% !important; order: -1; font-size: 12.5px !important; font-weight: 600; }
    .ract-when { flex: 0 0 auto !important; font-size: 10px !important; }
    .ract-cat { flex: 0 1 auto !important; min-width: 0; font-size: 10.5px !important; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ract-amt { flex: 0 0 auto !important; margin-left: auto; text-align: right !important; font-size: 11px !important; }
    .ract-note { padding-left: 0 !important; }
    .ract-note span { font-size: 10.5px !important; }

    /* 2px off the report's own type. */
    .report-sheet h4 { font-size: 19px; }
    .report-sheet table { font-size: 12px; }
    .report-sheet th { font-size: 9px; }
  }

  /* — mobile type scale — 2px down across the app's common sizes. */
  @media (max-width: 720px) {
    .blueprint h4 { font-size: 15px; }
    .cell-input, .cell-time, .cell-num { font-size: 12px !important; }
    .cell-spent { font-size: 12px; }
    .drawer-btn { font-size: 11px; }
    .appbar-meta { font-size: 10.5px; }

    /* Entry cards keep their two columns on a phone, which leaves each one
       about half of 320px. Everything inside tightens to suit, and From and To
       stop sharing a line — side by side they would be 60px each. */
    .entry-list { column-gap: 10px; }
    .entry-group { margin-bottom: 13px; }
    .entry-tab { font-size: 11px; padding: 5px 11px; }
    .entry-card { padding: 11px 12px 10px; }
    .entry-name { font-size: 13.5px; }
    .entry-controls { gap: 6px; margin: 6px 0 9px; }
    .entry-times { flex-direction: column; align-items: stretch; gap: 5px; }
    .entry-time { justify-content: space-between; }
    .entry-rule { display: none; }
    .entry-times .cell-time { font-size: 12.5px !important; }
    .entry-foot { margin-top: 8px; padding-top: 8px; }
    .entry-dur { font-size: 11.5px; }
    /* Half a phone leaves no room beside the duration, so the chip takes its
       own line rather than crushing both. */
    .entry-foot { flex-wrap: wrap; row-gap: 7px; }
    .entry-kcal { font-size: 10px; padding: 3px 8px; order: 3; margin-left: 0; flex-basis: 100%; text-align: center; }
  }

  /* — no zoom on focus (phones) —
     iOS Safari zooms the viewport whenever a focused field computes under 16px,
     and it has ignored user-scalable=no and maximum-scale since iOS 10 — so the
     meta tag cannot fix this and the fields themselves have to be big enough.
     Declared last, and with !important, because the rules it overrides are
     themselves !important and sit earlier in this file.

     The dense fields get their space back by giving up padding rather than
     type, so rows grow a little but nothing overflows. */
  @media (max-width: 720px) {
    input, select, textarea,
    .input, .cell-input, .cell-time, .cell-num, .entry-name, .entry-select,
    .entry-times .cell-time, .rows .cell-input, .rows .cell-time,
    .rows td[data-col="category"] select {
      font-size: 16px !important;
    }
    /* 16px in a half-width card needs the padding back. */
    .entry-card { padding: 10px 11px 9px; }
    .entry-name { padding-bottom: 1px; }
    .entry-controls { gap: 5px; margin: 5px 0 8px; }
    .entry-select { padding: 2px 8px !important; }
    .entry-leg { font-size: 9px; letter-spacing: .06em; }
    .entry-times { gap: 4px; }
    .entry-time { gap: 4px; }
    .cell-note { font-size: 10px; padding: 3px 8px; }
  }

  /* — the report deck —
     One card at a time, snapped horizontally. Scroll-snap rather than a
     gesture handler: it gives native momentum and rubber-banding, and it does
     not fight the browser for the touch. */
  .deck-backdrop {
    position: fixed; inset: 0; z-index: 58;
    background: color-mix(in srgb, var(--color-accent-900) 92%, transparent);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .deck-shell {
    position: relative; width: 560px; max-width: 100%;
    height: min(760px, calc(100vh - 32px));
    display: flex; flex-direction: column; gap: 12px;
  }
  .deck-bars { display: flex; gap: 5px; flex: none; padding: 0 2px; }
  .deck-bar {
    flex: 1; height: 4px; border: 0; padding: 0; cursor: pointer; border-radius: 999px;
    background: color-mix(in srgb, #fff 30%, transparent);
  }
  .deck-bar.is-on { background: #fff; }
  .deck-bar:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

  /* Sits over the card on a phone, where a white glyph on a white card is no
     glyph at all — so it carries its own dark ground at every width. */
  .deck-x {
    position: absolute; top: 16px; right: 10px; z-index: 4;
    width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
    border: 1px solid color-mix(in srgb, #fff 34%, transparent);
    background: color-mix(in srgb, var(--color-accent-900) 68%, transparent);
    color: #fff; font-size: 21px; line-height: 1; padding: 0 0 2px;
    display: flex; align-items: center; justify-content: center;
  }
  .deck-x:hover { background: var(--color-accent-900); }
  .deck-x:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  /* The deck's own window. Sits in the shell rather than inside a card, so it
     is there whichever card you are on, and it moves nothing on the page
     behind it. */
  /* Eight windows, and the row is as wide as it is. It scrolls rather than
     wrapping — a second line of pills would push the card down — and centres
     only while it fits: `safe center` on an overflowing row would otherwise
     push its first pill past the left edge of the scroll box, where nothing
     can reach it. The right padding is what keeps the last pill out from
     out from under the close button — and it has to be margin rather than
     padding, because a scroll container clips at its padding edge and pills
     scrolling past would be painted right through it. */
  .deck-ranges {
    flex: none; display: flex; gap: 4px; justify-content: safe center; flex-wrap: nowrap;
    /* The close button sits 10px from the edge and is 34px across, so it ends
       at 44px. 52px leaves the last pill a real gap rather than landing its
       edge exactly on the button's — which is a touch target under another
       touch target, whatever it looks like. */
    margin-right: 52px;
    overflow-x: auto; scrollbar-width: none;
  }
  .deck-ranges::-webkit-scrollbar { display: none; }
  .deck-range { flex: none; }
  .deck-range {
    border: 1px solid color-mix(in srgb, #fff 28%, transparent);
    background: transparent; color: color-mix(in srgb, #fff 82%, transparent);
    font-family: var(--font-body); font-size: 12.5px; font-weight: 600;
    padding: 6px 13px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  }
  .deck-range:hover { background: color-mix(in srgb, #fff 16%, transparent); color: #fff; }
  .deck-range.is-on { background: #fff; color: var(--color-accent-900); border-color: #fff; }
  .deck-range:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  .deck-track {
    flex: 1; min-height: 0;
    display: flex; overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .deck-track::-webkit-scrollbar { display: none; }
  .deck-slide { flex: 0 0 100%; scroll-snap-align: center; min-width: 0; display: flex; }

  .deck-card {
    --card-accent: var(--color-accent);
    flex: 1; min-width: 0;
    background: #fff; border-radius: var(--radius-lg);
    padding: 30px 30px 24px; display: flex; flex-direction: column;
    box-shadow: var(--shadow-lg);
  }
  /* The content sits in the middle of the card rather than hugging its top —
     a sparse card is three lines, and pinned to the top it read as a mistake.
     Scrolls within itself when a card carries six rows and a note. */
  /* `safe` matters here. A centred flex container whose content overflows
     pushes the overflow out of BOTH ends, and the top end of a scroll box is
     not reachable — so a tall card (the closing one, now that it carries five
     readings) opened with its first line already cut off and no way to scroll
     back to it. `safe center` centres while there is room and falls back to
     the start when there is not. A browser that does not know the keyword
     drops the declaration and top-aligns, which is the same fallback. */
  .deck-body {
    flex: 1; min-height: 0; overflow-y: auto;
    display: flex; flex-direction: column; justify-content: safe center;
  }
  .deck-kicker {
    font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase;
    font-weight: 600; color: var(--card-accent); margin-bottom: 14px;
  }
  .deck-big {
    font-family: var(--font-heading); font-weight: 700; line-height: 1;
    font-size: clamp(52px, 15vw, 82px); letter-spacing: -.01em;
    overflow-wrap: anywhere;
  }
  .deck-title { font-size: 21px; line-height: 1.35; color: var(--color-neutral-800); margin-top: 12px; }
  .deck-lines { margin-top: 12px; }
  .deck-lines p { margin: 0 0 7px; font-size: 14.5px; line-height: 1.55; color: var(--color-neutral-700); }

  /* The deck's own donut: the ring, then a legend under it.

     The ring is capped rather than full-width — a donut the width of a desktop
     card is a hoop, and the card has a legend to get to. */
  .deck-donut { margin-top: 10px; }
  .deck-donut svg { display: block; width: 100%; max-width: 236px; height: auto; margin: 0 auto; }
  /* Printed on the arc, so it is white on the slice's own colour. Only the
     slices wide enough to hold it get one; the legend has the rest. */
  /* The fill is set per slice, from that slice's own luminance. */
  .deck-donut .dk-share {
    font-family: var(--font-body); font-size: 11.5px; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  /* Two columns where there is room for two, one where there is not. Each row
     is swatch, name, share, figure — the name gives way, the numbers never do. */
  .dk-legend {
    list-style: none; margin: 14px 0 0; padding: 0;
    display: grid; gap: 2px 20px; grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
  }
  .dk-legend li {
    display: flex; align-items: baseline; gap: 8px;
    padding: 4px 0; font-size: 12.5px; line-height: 1.35;
  }
  .dk-legend i {
    width: 9px; height: 9px; flex: none; border-radius: 2px;
    align-self: center; print-color-adjust: exact;
  }
  .dk-legend .dk-key {
    flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--color-text);
  }
  .dk-legend b { flex: none; font-weight: 600; font-variant-numeric: tabular-nums; }
  .dk-legend em {
    flex: none; font-style: normal; min-width: 62px; text-align: right;
    color: var(--color-neutral-600); font-variant-numeric: tabular-nums;
  }
  /* The rolled-up row is a summary of the others, not one of them. */
  .dk-legend li.is-folded .dk-key { color: var(--color-neutral-600); font-style: italic; }

  /* The written paragraph. Sized to be read rather than scanned, which is why
     it is looser than the rows above it. */
  .deck-summary {
    margin-top: 14px; font-size: 13px; line-height: 1.62;
    color: var(--color-neutral-800);
  }
  .deck-summary:first-child { margin-top: 0; }
  /* The note leads into the paragraph now, so it sits tighter to it. */
  .deck-note-lead { margin-bottom: -4px; }

  .deck-writing {
    display: flex; align-items: center; gap: 7px;
    margin-top: 10px; font-size: 11.5px; color: var(--color-neutral-600);
  }
  .deck-writing.is-off { color: var(--color-text); }

  .deck-close { margin-top: 18px; }
  .deck-disclaimer {
    margin: 0; padding-top: 13px; border-top: 1px solid var(--color-divider);
    font-size: 11px; line-height: 1.55; color: var(--color-neutral-600);
  }
  .deck-ask { margin: 12px 0 0; font-size: 12.5px; line-height: 1.55; color: var(--color-neutral-800); }
  .deck-donate { margin-top: 11px; display: inline-flex; }

  .deck-chart { margin-top: 16px; }
  /* Inside a card the chart carries its own captions, so the block's own
     kicker would say the same thing twice. */
  .deck-chart .net-legend { margin-top: 10px; }
  .deck-chart .net-note { display: none; }

  .deck-rows { margin-top: 18px; }
  .deck-row {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 0; border-bottom: 1px solid var(--color-divider);
    font-size: 15px;
  }
  .deck-dot { width: 11px; height: 11px; flex: none; border-radius: 3px; }
  .deck-row-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .deck-row-meta { flex: none; font-size: 12.5px; color: var(--color-neutral-600); }
  .deck-row-value { flex: none; font-variant-numeric: tabular-nums; font-weight: 600; }

  .deck-note { margin-top: 16px; font-size: 13.5px; line-height: 1.6; color: var(--color-neutral-700); }
  /* Says which way there is something to reach, rather than asserting both. */
  /* Above the body now, so it is not the first thing a tall card pushes off
     the bottom of a phone. */
  .deck-hint {
    flex: none; display: flex; align-items: center; justify-content: center; gap: 8px;
    padding-bottom: 14px; font-size: 11.5px; letter-spacing: .04em;
    color: var(--color-neutral-500);
  }
  .deck-hint-arrow { font-size: 15px; line-height: 1; color: var(--card-accent); }

  /* — the raw summary —
     A timeline, not a table. Each entry is a card on a trace that runs down
     the left with a node at every stop — the same circuit-node language the
     icons use — so the day reads as one continuous thing rather than as six
     unrelated rows. The card is tinted with its own category, which is what
     lets you see a run of the same work without reading a word. */
  .deck-raw { display: flex; flex-direction: column; gap: 10px; text-align: left; margin-top: 2px; }
  .deck-raw-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .deck-raw-row {
    --row-tint: var(--color-accent);
    position: relative; display: flex; gap: 14px; padding-left: 22px;
  }
  .deck-raw-row.is-extra { display: none; }
  .deck-raw.is-open .deck-raw-row.is-extra { display: flex; }
  /* The trace. Drawn on the row rather than as one element behind them all, so
     it cannot fall out of step with a list that folds in half. */
  .deck-raw-row::before {
    content: ""; position: absolute; left: 5px; top: 0; bottom: -8px; width: 1.5px;
    background: color-mix(in srgb, var(--color-accent-900) 13%, transparent);
  }
  .deck-raw-row:last-child::before { bottom: 50%; }
  .deck-raw-node {
    position: absolute; left: 0; top: 15px; width: 11px; height: 11px; border-radius: 50%;
    background: var(--row-tint); box-shadow: 0 0 0 3px var(--color-surface);
  }
  /* Pastels built from the category's hue, not from a weak mix of its colour.
     Mixing 7% of a dark navy into white does not give a pale navy — it gives
     grey, because most of what makes a dark colour dark is what the mix throws
     away. Fixing lightness high and rebuilding a gentle chroma keeps the hue
     legible however dark the category is, and keeps every card in the stack
     legible however dark the category is.

     Lightness is mapped rather than pinned. PALETTE separates its categories
     mostly by how dark they are — five of its eight are purples — so fixing
     every card at one lightness threw away the only thing telling them apart
     and produced a stack of identical lilacs. Carrying the original lightness
     through, compressed into the top of the range, keeps a near-black plum
     and a muted lilac visibly different while both stay pastel.

     The srgb line first is the fallback for anything without relative colour
     syntax; it is the old muddy mix, which is still perfectly readable. */
  .deck-raw-body {
    flex: 1; min-width: 0;
    padding: 11px 14px 12px; border-radius: 14px;
    background: color-mix(in srgb, var(--row-tint) 17%, #fff);
    background: oklch(from var(--row-tint) calc(0.855 + l * 0.135) calc(c * 0.5 + 0.018) h);
    border: 1px solid color-mix(in srgb, var(--row-tint) 20%, transparent);
    border-color: oklch(from var(--row-tint) calc(0.755 + l * 0.16) calc(c * 0.6 + 0.024) h);
  }
  .deck-raw-top {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    margin-bottom: 5px;
  }
  .deck-raw-when {
    font-size: 11.5px; font-variant-numeric: tabular-nums; letter-spacing: .01em;
    color: var(--color-neutral-600); white-space: nowrap;
  }
  .deck-raw-arrow { padding: 0 5px; opacity: .6; }
  /* The duration is the one number worth comparing down the column, so it gets
     a chip of its own and sits on a shared right edge. */
  .deck-raw-dur {
    flex: none; padding: 2px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap;
    background: color-mix(in srgb, var(--row-tint) 18%, #fff);
    background: oklch(from var(--row-tint) calc(0.775 + l * 0.145) calc(c * 0.62 + 0.03) h);
    color: color-mix(in srgb, var(--row-tint) 72%, var(--color-text));
    color: oklch(from var(--row-tint) 0.44 calc(c * 0.7 + 0.03) h);
  }
  .deck-raw-said { font-size: 14.5px; line-height: 1.3; font-weight: 600; color: var(--color-text); }
  /* The note is what was written at the time and is often the longer half —
     it gets its own line rather than being run onto the title with a dash. */
  .deck-raw-note {
    font-size: 12px; line-height: 1.45; color: var(--color-neutral-800);
    margin-top: 3px;
  }
  .deck-raw-cat {
    display: inline-flex; align-items: center; gap: 5px; margin-top: 7px;
    padding: 3px 9px 3px 7px; border-radius: 999px;
    font-size: 11px; font-weight: 600;
    background: color-mix(in srgb, var(--row-tint) 18%, #fff);
    background: oklch(from var(--row-tint) calc(0.77 + l * 0.145) calc(c * 0.62 + 0.03) h);
    color: color-mix(in srgb, var(--row-tint) 74%, var(--color-text));
    color: oklch(from var(--row-tint) 0.42 calc(c * 0.7 + 0.03) h);
  }
  .deck-raw-more {
    align-self: flex-start; margin: 2px 0 0 22px;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: 999px; cursor: pointer;
    border: 1px solid color-mix(in srgb, var(--color-accent) 30%, transparent);
    background: color-mix(in srgb, var(--color-accent) 8%, transparent);
    font-family: var(--font-body); font-size: 12.5px; font-weight: 600; color: var(--color-accent-800);
  }
  .deck-raw-more span { font-size: 9px; transition: transform .16s ease; }
  .deck-raw.is-open .deck-raw-more span { transform: rotate(180deg); }
  .deck-raw-more:hover { background: color-mix(in srgb, var(--color-accent) 14%, transparent); }
  .deck-raw-more:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

  /* — what it may be doing to you —
     A heading line per dimension and a paragraph under it. Left-aligned
     against the centred card on purpose: these are four things to read, not
     four things to glance at. */
  .deck-effects { display: flex; flex-direction: column; gap: 14px; text-align: left; margin-top: 4px; }
  .deck-effect-head { display: flex; align-items: baseline; gap: 8px; }
  .deck-effect-label {
    font-family: var(--font-heading); font-weight: 700; font-size: 14px; color: var(--color-text);
  }
  .deck-effect-value { margin-left: auto; font-size: 12px; color: var(--color-neutral-600); font-variant-numeric: tabular-nums; }
  .deck-effect-text { margin: 3px 0 0; font-size: 12.5px; line-height: 1.5; color: var(--color-neutral-800); }

  .deck-mark {
    flex: none; padding-top: 10px;
    font-family: var(--font-heading); font-weight: 700; font-size: 13px;
    color: var(--color-neutral-500);
  }
  .deck-mark span { color: var(--card-accent); }

  .deck-arrow {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 3;
    width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
    border: 1px solid color-mix(in srgb, #fff 40%, transparent);
    background: color-mix(in srgb, var(--color-accent-900) 55%, transparent);
    color: #fff; font-size: 24px; line-height: 1; padding: 0 0 3px;
  }
  .deck-arrow:hover { background: var(--color-accent-900); }
  .deck-prev { left: -18px; }
  .deck-next { right: -18px; }

  .deck-foot { flex: none; display: flex; gap: 10px; justify-content: center; }
  .deck-foot .btn { font-size: 14px; }

  /* Screen-hidden; the PDF's closing pages. */
  .deck-print { display: none; }

  @media (max-width: 620px) {
    .deck-backdrop { padding: 0; }
    /* 100vh on a phone is the viewport as it would be with the browser chrome
       hidden, which is taller than what you can actually see — so the top of
       the deck sat under the address bar. dvh is the height that is really
       there, and the safe-area inset keeps the dots clear of the notch. */
    .deck-shell {
      height: 100vh;
      height: 100dvh;
      width: 100%; gap: 7px;
      padding: max(10px, env(safe-area-inset-top, 0px)) 10px
               max(12px, env(safe-area-inset-bottom, 0px));
    }
    /* Five windows do not fit a phone on one line, and a switch that breaks
       three-and-two reads as a mistake. It scrolls instead — the same treatment
       the landing nav and the sticky bar's controls already use. */
    /* Margin, not padding: padding pads the scrolling content, so a pill
       scrolled to the start still slides underneath the close button and reads
       as a collision. A margin moves the scroller's own edge clear of it, and
       the overflow is then clipped where the row ends. */
    .deck-ranges {
      gap: 3px; justify-content: flex-start;
    }
    .deck-ranges::-webkit-scrollbar { display: none; }
    .deck-range { font-size: 11.5px; padding: 5px 11px; }
    .deck-bars { padding-top: 4px; padding-right: 42px; }
    .deck-x { top: 22px; }
    .deck-card { border-radius: 14px; padding: 26px 20px 20px; }
    /* 148px of time column leaves nothing for the activity at 320px — but
       under about 126px "11:00 AM to 11:30 AM" breaks across two lines and
       the timeline stops looking like one. */
    .deck-raw-when { width: 126px; font-size: 10.5px; }
    .deck-raw-row { gap: 10px; }
    /* No room beside the card on a phone, and a thumb does not need them. */
    .deck-arrow { display: none; }
    .deck-foot .btn { flex: 1; justify-content: center; padding-inline: 12px; }
  }

  /* — the PDF —
     Printing unrolls the deck: the fixed backdrop becomes ordinary flow (fixed
     positioning pins output to a single page and truncates everything after
     it), the horizontal scroller becomes a stack, and each card takes a page.
     The detail pages the deck hides on screen follow at the end, so the file
     carries both the story and the evidence behind it. */
  @media print {
    .no-print { display: none !important; }
    [data-app] > .appbar,
    [data-app] > [data-page-grid] { display: none !important; }
    [data-app] { min-height: 0 !important; padding-bottom: 0 !important; }

    .deck-backdrop {
      position: static !important; inset: auto !important; z-index: auto !important;
      display: block !important; background: none !important; padding: 0 !important;
    }
    .deck-shell {
      width: 100% !important; max-width: none !important; height: auto !important;
      display: block !important; padding: 0 !important;
    }
    .deck-track {
      display: block !important; overflow: visible !important;
      scroll-snap-type: none !important;
    }
    .deck-slide {
      display: block !important; width: 100% !important;
      break-after: page; page-break-after: always;
    }
    .deck-slide:last-of-type { break-after: auto; page-break-after: auto; }
    .deck-card {
      box-shadow: none !important; border: 1px solid #ddd !important;
      border-radius: 0 !important; overflow: visible !important;
      padding: 0 0 18px !important; min-height: 0 !important;
      display: block !important;
    }
    .deck-big { font-size: 44px !important; }
    /* A drawer is a screen affordance. On paper there is no reason to hide
       half the day, and no button to get it back. */
    .deck-raw-row.is-extra { display: flex !important; }
    .deck-mark { margin-top: 20px !important; }

    .deck-print { display: block !important; break-before: page; page-break-before: always; }
    .deck-print h4 { font-size: 20px; margin: 0 0 12px; }
    .deck-print table { width: 100%; }

    @page { margin: 14mm; }
  }
</style>
