<link rel="stylesheet" href="ds/styles.css">
<style>
  body { margin: 0; }
  input, select, button { font-family: inherit; }
  .btn { border-radius: 999px; padding-inline: 18px; }
  .btn-icon { border-radius: 999px; padding-inline: 0; }
  .seg { border-radius: 999px; max-width: 100%; }
  .seg-opt { padding-inline: 15px; }
  /* Four options at full padding need 307px, and the insights column on a
     320px phone offers about 270. The labels stay whole and the padding gives
     way — "Yesterday" abbreviated would be worse than a tighter pill. */
  @media (max-width: 560px) {
    .seg-opt { padding-inline: 9px; font-size: 12px; }
  }
  input[type="time"]::-webkit-calendar-picker-indicator { opacity: .35; }

  /* — semantic colour —
     These carry meaning rather than brand: energy out, energy in, giving. They
     stay green/amber through the rebrand — recolouring "burned" violet would
     make it agree with everything else on the page and mean nothing — but both
     are retuned to sit with the violet rather than against it. */
  :root {
    --zg-strong: #0e9f6e;
    --zg-text: #57516b;
    /* The selected block in the bottom bar: a tint of the brand, since the
       brand is now the thing the app is built out of. */
    --bn-active: #efe9fe;
    --zg-donate: #e9a13b;
    /* A calorie surplus is a warning rather than a nudge, so it leaves the
       amber the food gauge uses and takes a red of its own. */
    --zg-alert: #d92d20;
    /* The empty half of any meter — the donut's ring, a progress bar's rest,
       the unlogged part of the timeline. A wash of the accent rather than the
       neutral grey these all used, and it repoints with the tracker. */
    --track: color-mix(in srgb, var(--color-accent) 15%, #fff);
  }

  /* Small inline labels take a violet-cast grey rather than a flat one, so the
     captions belong to the palette. neutral-600 is the app's caption grey; the
     darker body greys are deliberately left alone. */
  [data-app] { --color-neutral-600: var(--zg-text); }

  /* — donate —
     Amber rather than an accent shade, so it reads as its own thing against
     both the blue time theme and the green money theme. */
  .btn-donate {
    display: inline-flex; align-items: center; gap: 7px;
    background: #e08a1e; border: 1px solid #c9761200; color: #fff;
    text-decoration: none; font-weight: 600;
    box-shadow: 0 1px 3px color-mix(in srgb, #8a5100 30%, transparent);
  }
  .btn-donate svg { width: 15px; height: 15px; display: block; }
  .btn-donate:hover { background: #c9760f; color: #fff; }
  .btn-donate:focus-visible { outline: 2px solid #8a5100; outline-offset: 2px; }

  /* — money tracker theme —
     Accent tokens are inherited custom properties, so re-declaring them on the
     page wrapper repoints every accent in the money view — buttons, kickers,
     chips, the report sheet — without touching the design system. Teal rather
     than violet, so which tracker you are in is readable at arm's length; both
     hues are drawn from the same gradient family. */
  [data-app="money"] {
    --color-accent: #16a394;
    --color-accent-2: #0f766e;
    --color-accent-100: #e6f7f4;
    --color-accent-200: #c7ede7;
    --color-accent-300: #97ddd2;
    --color-accent-400: #63c8ba;
    --color-accent-500: #35ae9f;
    --color-accent-600: #199184;
    --color-accent-700: #10756c;
    --color-accent-800: #0b5750;
    --color-accent-900: #073b36;
    --color-accent-2-100: #e6f7f4;
    --color-accent-2-200: #cceee9;
    --color-accent-2-300: #a3ded5;
    --color-accent-2-400: #72c9bd;
    --color-accent-2-500: #46b0a2;
    --color-accent-2-600: #229286;
    --color-accent-2-700: #14746b;
    --color-accent-2-800: #0d5751;
    --color-accent-2-900: #083c37;
    --grad-brand: linear-gradient(115deg, #2bb8a5 0%, #16a394 45%, #0f766e 100%);
    --grad-brand-hover: linear-gradient(115deg, #22a795 0%, #12907f 45%, #0b6259 100%);
  }

  /* — loading affordances — */
  @keyframes zimpan-spin { to { transform: rotate(360deg); } }
  .spinner {
    display: inline-block; width: 14px; height: 14px; flex: none;
    border: 2px solid currentColor; border-right-color: transparent;
    border-radius: 50%; animation: zimpan-spin .7s linear infinite;
  }
  .spinner.lg { width: 24px; height: 24px; border-width: 3px; }

  /* Sits above everything while any request is in flight. */
  .topbar { position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 60; pointer-events: none; overflow: hidden; }
  @keyframes zimpan-slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(420%); } }
  .topbar > i { display: block; height: 100%; width: 28%; background: var(--color-accent); animation: zimpan-slide 1.15s ease-in-out infinite; }

  .toast {
    position: fixed; left: 20px; bottom: 20px; z-index: 60;
    background: var(--color-neutral-900); color: var(--color-bg);
    font-family: var(--font-body); font-size: 13px;
    padding: 9px 15px; border-radius: 999px; box-shadow: var(--shadow-md);
    max-width: calc(100vw - 40px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* A labelled control rather than a faint glyph — at 25% opacity nobody
     could tell it was a button. */
  .cell-note {
    border: 1px solid var(--color-divider); background: transparent;
    cursor: pointer; font-family: var(--font-body); font-size: 10.5px;
    line-height: 1; padding: 3px 9px; margin-left: 6px;
    border-radius: 999px; vertical-align: middle; white-space: nowrap;
    color: var(--color-neutral-700);
  }
  .cell-note[data-has-note] {
    border-color: var(--zg-strong); color: var(--zg-text); font-weight: 600;
  }
  .cell-note:hover { background: var(--color-accent-700); border-color: var(--color-accent-700); color: #fff; }
  .cell-note:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 1px; }

  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 2.4s; }
    .topbar > i { animation-duration: 3s; }
  }

  /* — drawers —
     Collapsed sections keep the phone view short. The button says how much is
     hidden, so "Show more" is never a guess. */
  /* Solid pill by default, inverting to white on hover. The accent tokens are
     used rather than a fixed navy so the money tracker's green theme carries
     through here too. */
  .drawer-btn {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--color-accent-700);
    background: var(--color-accent-700);
    color: #fff;
    font-family: var(--font-body); font-size: 12.5px; font-weight: 600;
    padding: 7px 17px; border-radius: 999px; cursor: pointer;
    transition: background-color .15s ease, color .15s ease, border-color .15s ease;
  }
  .drawer-btn:hover,
  .drawer-btn:focus-visible {
    background: #fff;
    color: var(--color-accent-900);
    border-color: var(--color-accent-900);
  }
  .drawer-btn:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .drawer-btn .drawer-caret { font-size: 10px; line-height: 1; opacity: .85; }
  .drawer-row { display: flex; justify-content: center; padding: 12px 0 2px; }

  @media (prefers-reduced-motion: reduce) { .drawer-btn { transition: none; } }

  /* — mobile bottom bar —
     Hidden entirely on desktop; the top bar keeps its buttons there. */
  .bottomnav { display: none; }

  /* Same story, and declared here rather than beside its own rules further
     down: the phone block below turns it on, and an equal-specificity
     `display: none` appearing after that block would quietly win. */
  .stickybar { display: none; }

  @media (max-width: 720px) {
    /* The landing's own phone rules are NOT here — they sit after the landing
       block further down, which declares the same properties later in the file
       and would otherwise win at equal specificity. */

    /* The tabs and the duplicated Donate/Export buttons live in the bottom bar
       on a phone. Who is signed in, and the way out, stay in the header. */
    .appbar-tabs, .appbar-cta { display: none !important; }
    .appbar-actions { margin-left: auto; }
    .appbar-account { flex-direction: column; align-items: flex-end; gap: 0; }
    .appbar-account .btn { padding-inline: 0; }
    .appbar-email { font-size: 11.5px; }

    .bottomnav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 45;
      display: flex; align-items: stretch;
      background: var(--color-bg);
      border-top: 1px solid var(--color-divider);
      box-shadow: 0 -2px 10px color-mix(in srgb, #2b2b2d 10%, transparent);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .bottomnav a, .bottomnav button {
      flex: 1 1 0; min-width: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      border: 0; background: transparent; cursor: pointer;
      font-family: var(--font-body); font-size: 10px; letter-spacing: .01em;
      color: var(--color-neutral-600); text-decoration: none;
      padding: 9px 2px 10px; -webkit-tap-highlight-color: transparent;
      transition: color .15s ease;
    }
    .bottomnav .bn-icon { display: flex; }
    .bottomnav .bn-icon svg { width: 22px; height: 22px; display: block; }
    .bottomnav .bn-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }

    /* The active destination carries a filled block as well as weight and
       colour, so it still reads on a screen in bright sun where the hue washes
       out. Only Time and Money can be current — Report and Insights are
       actions, and nothing should look selected after pressing them. */
    .bottomnav [aria-current="page"] {
      color: var(--color-accent-900); font-weight: 600;
      background: var(--bn-active);
    }
    .bottomnav [aria-current="page"] .bn-icon svg { stroke-width: 2.1; }

    /* The one item that is a link out rather than a destination, so it is
       given the donate amber instead of the nav grey. */
    .bn-donate .bn-icon svg { fill: var(--zg-donate); stroke: var(--zg-donate); }
    .bottomnav button:active .bn-icon, .bottomnav a:active .bn-icon { transform: scale(.92); }
    .bottomnav .bn-icon { transition: transform .12s ease; }
    .bottomnav button:focus-visible, .bottomnav a:focus-visible { outline: 2px solid var(--color-accent); outline-offset: -3px; border-radius: 6px; }

    @media (prefers-reduced-motion: reduce) {
      .bottomnav a, .bottomnav button, .bottomnav .bn-icon { transition: none; }
    }

    /* Content must clear the fixed bar. */
    [data-page-grid] { padding-bottom: 84px !important; }
    .toast { bottom: 78px; }

    .stickybar {
      display: block;
      position: fixed; top: 0; left: 0; right: 0; z-index: 46;
      background: var(--color-neutral-200);
      border-bottom: 1px solid var(--color-divider);
      box-shadow: 0 1px 6px color-mix(in srgb, #2b2b2d 12%, transparent);
      transform: translateY(-101%);
      transition: transform .2s ease;
      pointer-events: none;
    }
    .stickybar.is-on { transform: translateY(0); pointer-events: auto; }
    .stickybar-in { display: flex; align-items: center; gap: 10px; padding: 8px 12px; }
    /* Scrolls rather than wraps: two pills and a mark must stay on one line. */
    .stickybar-controls {
      display: flex; align-items: center; gap: 8px; min-width: 0;
      overflow-x: auto; scrollbar-width: none;
    }
    .stickybar-controls::-webkit-scrollbar { display: none; }
    /* The full wordmark takes 145px of a 320px bar once its tagline is counted,
       which pushes the pills into a scroller. The sticky bar gets the mark and
       the name only. */
    .stickybar-mark {
      margin-left: auto; flex: none; display: flex; align-items: center; gap: 7px;
      border: 0; background: transparent; padding: 0; cursor: pointer;
    }
    .stickybar-name {
      font-family: var(--font-heading); font-weight: 600; font-size: 15px;
      letter-spacing: .02em; line-height: 1; color: var(--color-text);
    }

    /* Narrowest phones: trim the pills rather than let them scroll sideways. */
    @media (max-width: 380px) {
      .stickybar-in { gap: 7px; padding: 8px 10px; }
      .stickybar-controls button { font-size: 11.5px !important; padding: 6px 11px !important; }
      .stickybar-name { font-size: 13.5px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .stickybar { transition: none; }
    }
  }

  /* — form validation —
     A refused add used to be a silent no-op, which reads as a broken button. */
  .field-err {
    display: flex; align-items: center; gap: 6px;
    margin-top: 8px; font-size: 12px; line-height: 1.45; color: #a4291f;
  }
  .field-err::before {
    content: "!"; flex: none;
    width: 15px; height: 15px; border-radius: 50%;
    background: #a4291f; color: #fff;
    font-size: 10px; font-weight: 700; line-height: 15px; text-align: center;
  }
  [aria-invalid="true"] { border-color: #a4291f !important; }
  [aria-invalid="true"]:focus-visible { outline-color: #a4291f; }

  /* — legend —
     The rows have always been clickable; nothing on them said so.

     The row bleeds 6px past its column so the selected tint reads as a band
     rather than as a box around the words. Declared here rather than inline
     because the narrow case below has to be able to take the bleed back: with
     it, the row is its column plus 12px, which is enough to push a 320px page
     sideways once "See Entries" is on the end of it. */
  .legend-row {
    display: flex; align-items: center; gap: 9px;
    font: inherit; font-size: 13px; text-align: left;
    border: 0; cursor: pointer; color: inherit;
    padding: 4px 6px; margin: 0 -6px; border-radius: var(--radius-md);
  }
  .legend-see {
    flex: none; font-size: 10.5px; letter-spacing: .01em;
    color: var(--color-accent-700); text-decoration: underline;
    text-underline-offset: 2px; white-space: nowrap;
  }

  @media (max-width: 560px) {
    .legend-row { margin: 0; padding: 4px 0; gap: 7px; }
    .legend-see { font-size: 10px; }
  }

  /* The chip that ends the timer's category row. Dashed, so it reads as a way
     to add one rather than as another category to pick. */
  .chip-add {
    display: inline-flex; align-items: center; cursor: pointer;
    font-family: var(--font-body); font-size: 11px; padding: 4px 12px;
    border-radius: 999px; border: 1px dashed var(--color-accent-700);
    background: transparent; color: var(--color-accent-700); font-weight: 600;
  }
  .chip-add:hover { background: var(--color-accent-100); }
  .chip-add:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

  /* — the entries behind a slice —
     A lightbox rather than a panel under the chart: on a phone the list opened
     below the fold of a card you were already scrolled past, so nothing
     appeared to happen. 55 clears the fixed chrome (bottom bar 45, sticky
     header and back-to-top 46) and stays under the donation sheet at 70. */
  .focus-backdrop {
    position: fixed; inset: 0; z-index: 55;
    background: color-mix(in srgb, var(--color-neutral-900) 58%, transparent);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; overflow: auto;
  }
  .focus-sheet {
    width: 560px; max-width: 100%; max-height: calc(100vh - 40px);
    display: flex; flex-direction: column;
    background: var(--color-bg); border-radius: 16px;
    box-shadow: var(--shadow-lg); overflow: hidden;
  }
  .focus-head {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 16px 18px 14px; border-bottom: 1px solid var(--color-divider);
  }
  .focus-swatch { width: 12px; height: 12px; flex: none; margin-top: 5px; }
  .focus-title { min-width: 0; margin-right: auto; }
  .focus-title h4 { margin: 0; font-size: 18px; line-height: 1.2; overflow-wrap: anywhere; }
  .focus-sub { display: block; margin-top: 3px; font-size: 11.5px; color: var(--color-neutral-600); }
  .focus-x {
    flex: none; border: 0; background: transparent; cursor: pointer;
    font-size: 24px; line-height: 1; padding: 0 4px; color: var(--color-neutral-600);
  }
  .focus-x:hover { color: var(--color-text); }
  .focus-body { overflow-y: auto; padding: 4px 18px; -webkit-overflow-scrolling: touch; }
  .focus-row {
    display: flex; align-items: baseline; gap: 10px;
    padding: 9px 0; border-bottom: 1px solid var(--color-divider);
  }
  .focus-date { flex: 0 0 54px; font-size: 11px; color: var(--color-neutral-600); font-variant-numeric: tabular-nums; }
  .focus-what { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
  .focus-meta { flex: none; font-size: 11px; color: var(--color-neutral-600); font-variant-numeric: tabular-nums; }
  .focus-val { flex: none; min-width: 56px; text-align: right; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .focus-foot {
    display: flex; align-items: center; justify-content: flex-end; gap: 12px;
    padding: 12px 18px 14px; border-top: 1px solid var(--color-divider);
  }
  /* — steps — */
  .steps-sheet { width: 420px; }
  .steps-body { padding: 18px; }
  .steps-label { display: block; font-size: 13px; color: var(--color-neutral-800); margin-bottom: 8px; }
  .steps-input { font-size: 20px; font-family: var(--font-heading); height: 48px; text-align: center; }
  .steps-preview { margin-top: 12px; font-size: 13px; line-height: 1.55; color: var(--color-text); }
  .steps-preview strong { color: var(--zg-strong); }
  .steps-note { margin-top: 10px; font-size: 11.5px; line-height: 1.5; color: var(--color-neutral-600); }

  .focus-foot-note {
    margin-right: auto; font-size: 11px; line-height: 1.45;
    color: var(--color-neutral-600); max-width: 60%;
  }

  @media (max-width: 560px) {
    .focus-backdrop { padding: 12px; align-items: flex-end; }
    .focus-sheet { max-height: calc(100vh - 90px); }
    .focus-title h4 { font-size: 16px; }
    .focus-what { font-size: 12.5px; }
    .focus-date { flex-basis: 46px; font-size: 10.5px; }
  }

  /* — landing —
     A tinted ground with the brand bleeding in from the top right, so the page
     reads as part of the gradient rather than as white paper under it. */
  /* The banner fills the screen and stays there.
     Painted on a fixed pseudo-element rather than on .landing itself: the page
     scrolls well past one screen, and `cover` on the element would scale the
     artwork to the full scroll height — a huge crop of it behind the first
     viewport. Pinned to the viewport, "cover" means what it says. Chosen over
     background-attachment: fixed, which iOS Safari does not honour.
     The gradients under it are not decoration for its own sake: they are what
     shows if ds/home-bg.jpg is ever missing, so the page never falls to white. */
  .landing { position: relative; min-height: 100vh; color: var(--color-text); font-family: var(--font-body); }
  .landing::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      url('ds/home-bg.jpg') center right / cover no-repeat,
      radial-gradient(1100px 620px at 88% -8%, color-mix(in srgb, #4a2458 18%, transparent), transparent 62%),
      radial-gradient(760px 520px at 6% 4%, color-mix(in srgb, #2a8b7d 12%, transparent), transparent 60%),
      var(--color-bg);
  }

  /* Everything below the hero rides above the artwork, and the sections that
     carry reading matter take a wash so the words keep their ground. */
  .landing > * { position: relative; }
  .landing > .strip, .landing > footer {
    background: linear-gradient(180deg, color-mix(in srgb, var(--color-bg) 82%, transparent), var(--color-bg) 42%);
  }

  .landing-bar {
    display: flex; align-items: center; gap: 18px;
    padding: 16px 30px; flex-wrap: wrap;
    max-width: 1240px; margin: 0 auto;
  }
  .landing-brand {
    display: flex; align-items: center; gap: 10px;
    text-decoration: none; color: inherit; flex: none;
  }
  .landing-name {
    font-family: var(--font-heading); font-weight: 800; font-size: 21px;
    letter-spacing: .01em; line-height: 1;
  }
  .landing-nav { display: flex; align-items: center; gap: 4px; margin: 0 auto; }
  .landing-nav button {
    border: 0; background: transparent; cursor: pointer;
    font-family: var(--font-body); font-size: 14px; font-weight: 500;
    color: var(--color-neutral-800); padding: 8px 13px; border-radius: 999px;
  }
  .landing-nav button:hover { background: color-mix(in srgb, var(--color-accent) 11%, transparent); color: var(--color-accent-800); }
  .landing-nav button:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 1px; }
  .landing-actions { display: flex; align-items: center; gap: 10px; flex: none; }
  .landing-login {
    border: 0; background: transparent; cursor: pointer;
    font-family: var(--font-body); font-size: 14px; font-weight: 500;
    color: var(--color-neutral-800); padding: 8px 6px;
  }
  .landing-login:hover { color: var(--color-accent-700); }
  .landing-login:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; border-radius: 6px; }

  .hero {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr);
    gap: 44px; align-items: center;
    max-width: 1240px; margin: 0 auto; padding: 26px 30px 40px;
  }
  .hero-eyebrow {
    display: inline-block; margin-bottom: 16px; padding: 6px 14px;
    border-radius: 999px; background: #fff;
    border: 1px solid color-mix(in srgb, var(--color-accent) 26%, transparent);
    font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase;
    color: var(--color-accent-700); font-weight: 600;
    box-shadow: var(--shadow-sm);
  }
  /* The reference sets its headline in caps. Done with text-transform rather
     than in the string, so the copy stays readable in the source. */
  .hero-h1 {
    font-family: var(--font-heading); font-weight: 800;
    font-size: clamp(34px, 4.6vw, 58px); line-height: 1.04;
    letter-spacing: -.01em; text-transform: uppercase;
    margin: 0 0 18px; text-wrap: balance;
  }
  .hero-lede {
    font-size: 16px; line-height: 1.65; color: var(--color-neutral-800);
    margin: 0 0 24px; max-width: 52ch;
  }
  .hero-ctas { display: flex; flex-wrap: wrap; gap: 12px; }
  .hero-cta2 { font-size: 15px; font-weight: 600; padding: 13px 26px; }

  .hero-svg { width: 100%; height: auto; display: block; overflow: visible; }

  /* — the featured strip — */
  .strip { max-width: 1240px; margin: 0 auto; padding: 12px 30px 20px; scroll-margin-top: 20px; }
  .strip-head { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
  .strip-kicker {
    flex: none; font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase;
    font-weight: 600; color: var(--color-accent-800);
  }
  .strip-rule { flex: 1; height: 1px; background: color-mix(in srgb, var(--color-accent-900) 16%, transparent); }
  .strip-note { flex: none; font-size: 12px; color: var(--color-neutral-600); }

  /* — landing on a phone —
     Declared here rather than in the shared phone block near the top of this
     file: that block comes before the landing rules above, and at equal
     specificity the later declaration wins. */
  @media (max-width: 720px) {
    /* The artwork's clear half is on its left, which a phone-width crop of a
       landscape banner loses — so a scrim goes over it to keep the headline
       readable on top. Still viewport-sized, still fixed. */
    .landing::before {
      background:
        linear-gradient(180deg, color-mix(in srgb, #f8f7fb 74%, transparent) 0%, color-mix(in srgb, #f8f7fb 90%, transparent) 52%, #f8f7fb 78%),
        url('ds/home-bg.jpg') center right / cover no-repeat,
        var(--color-bg);
    }

    /* The header keeps the wordmark and a way in — the hero's own Start
       Tracking button sits a thumb-length below it. */
    .landing-cta-top { display: none; }
    .landing-bar { padding: 14px 18px; gap: 10px; }
    .landing-actions { margin-left: auto; }
    /* The links move under the brand row rather than squeezing beside it, and
       scroll rather than wrap — four links breaking to two lines leave one
       stranded, and no amount of trimming holds them on one line at 320px.
       Same treatment the sticky bar's controls already use. */
    .landing-nav {
      order: 9; flex: 1 0 100%; margin: 2px 0 0;
      justify-content: flex-start; flex-wrap: nowrap; gap: 0;
      overflow-x: auto; scrollbar-width: none;
    }
    .landing-nav::-webkit-scrollbar { display: none; }
    .landing-nav button { font-size: 12.5px; padding: 6px 10px; flex: none; }
    .hero-h1 { font-size: clamp(28px, 8.4vw, 40px); }
    .hero-lede { font-size: 15px; }
    .hero-ctas { gap: 10px; }
    .hero-ctas .btn { width: 100%; justify-content: center; }
    .strip { padding: 8px 18px 16px; }
    .strip-note { display: none; }
  }

  .hero-checks {
    list-style: none; margin: 0 0 26px; padding: 0;
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px 22px;
  }
  .hero-checks li {
    display: flex; align-items: center; gap: 9px;
    font-size: 14.5px; color: var(--color-neutral-800); min-width: 0;
  }
  .hero-check { display: flex; flex: none; color: var(--color-accent); }
  .hero-check svg { width: 19px; height: 19px; display: block; }

  .landing-points { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
  .feature-card {
    display: flex; align-items: flex-start; gap: 14px;
    background: #fff; border: 1px solid color-mix(in srgb, var(--color-accent-900) 8%, transparent);
    border-radius: var(--radius-lg); padding: 20px 20px 22px;
    box-shadow: var(--shadow-sm);
    transition: transform .16s ease, box-shadow .16s ease;
  }
  .feature-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
  .feature-badge {
    flex: none; width: 52px; height: 52px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    background: var(--grad-brand); color: #fff;
    box-shadow: 0 4px 12px color-mix(in srgb, #4f46e5 28%, transparent);
  }
  .feature-badge svg { width: 26px; height: 26px; display: block; }

  @media (max-width: 900px) {
    /* Copy first, then the image — the reading order the mobile design uses. */
    .hero { grid-template-columns: minmax(0, 1fr); gap: 26px; padding: 14px 20px 28px; }
    .hero-checks { gap: 9px 16px; margin-bottom: 20px; }
    .hero-checks li { font-size: 13.5px; }
    .landing-points { gap: 12px; }
    .feature-card { padding: 15px 16px 17px; gap: 12px; }
    .feature-badge { width: 46px; height: 46px; }
    .feature-badge svg { width: 23px; height: 23px; }
  }

  /* Two columns down to the narrowest common phone; the labels shrink rather
     than stacking, which is how the design reads. */
  @media (max-width: 420px) {
    .hero-checks { gap: 8px 12px; }
    .hero-checks li { font-size: 12.5px; }
    .hero-check svg { width: 17px; height: 17px; }
  }
  @media (max-width: 330px) {
    .hero-checks { grid-template-columns: minmax(0, 1fr); }
  }

  /* — app bar — */
  .appbar {
    display: flex; align-items: center; gap: 20px;
    padding: 14px 28px; border-bottom: 1px solid var(--color-divider);
    flex-wrap: wrap;
  }
  .appbar-meta {
    display: flex; align-items: center; gap: 8px; margin-right: auto;
    font-size: 12px; color: var(--color-neutral-700);
  }

  /* — back to top —
     Sits above the bottom bar rather than over it, so it never covers a
     destination. Present at every width; the long money page earns it on a
     desktop too. */
  .backtotop {
    position: fixed; right: 16px; bottom: 20px; z-index: 46;
    width: 44px; height: 44px; border-radius: 50%; border: 0;
    background: var(--color-accent-700); color: #fff;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: 0 2px 10px color-mix(in srgb, #2b2b2d 32%, transparent);
    opacity: 0; visibility: hidden; transform: translateY(6px);
    transition: opacity .18s ease, transform .18s ease, visibility .18s;
  }
  .backtotop svg { width: 21px; height: 21px; display: block; }
  .backtotop.is-on { opacity: 1; visibility: visible; transform: none; }
  .backtotop:hover { background: var(--color-accent-900); }
  .backtotop:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

  /* Clears the fixed bottom bar. Declared after the base rule rather than up in
     the phone block, which comes earlier in this file and would lose to it. */
  @media (max-width: 720px) {
    .backtotop { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
  }

  /* — report toolbar —
     Pinned to the top of the preview's own scroller, so Close and the exports
     stay reachable however long the sheet runs. Darker than the backdrop it
     sits on, or the sheet would read through it as it scrolls past. */
  .report-tools {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-bottom: 14px; padding: 12px 0;
    background: color-mix(in srgb, var(--color-neutral-900) 80%, transparent);
  }
  .report-tools .btn { display: inline-flex; align-items: center; gap: 7px; }

  /* — donation lightbox — */
  .donate-backdrop {
    position: fixed; inset: 0; z-index: 70;
    background: color-mix(in srgb, var(--color-neutral-900) 62%, transparent);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; overflow: auto;
  }
  .donate-sheet {
    position: relative; width: 460px; max-width: 100%;
    background: var(--color-bg); border-radius: 18px;
    padding: 34px 30px 26px; text-align: center;
    box-shadow: var(--shadow-lg);
  }
  .donate-x {
    position: absolute; top: 8px; right: 12px; border: 0; background: transparent;
    font-size: 24px; line-height: 1; color: var(--color-neutral-600);
    cursor: pointer; padding: 4px 8px;
  }
  .donate-x:hover { color: var(--color-text); }
  .donate-kicker {
    font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--color-neutral-600); margin-bottom: 12px;
  }
  .donate-title { margin: 0 0 15px; display: flex; flex-direction: column; gap: 1px; }
  .donate-title span {
    font-family: var(--font-heading); font-weight: 700; font-size: 40px;
    line-height: .98; letter-spacing: .005em;
  }
  .donate-l1 { color: #14a05c; }
  .donate-l2 { color: #1d6f8f; }
  .donate-copy {
    margin: 0 0 20px; font-size: 13.5px; line-height: 1.6;
    color: var(--color-neutral-800);
  }
  .donate-cta {
    display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    width: 100%; border: 0; border-radius: 999px; cursor: pointer;
    padding: 14px 24px; background: linear-gradient(180deg, #f2c552, #d99a1f);
    color: #3d2c05; font-family: var(--font-body); font-size: 16px; font-weight: 700;
    box-shadow: 0 2px 8px color-mix(in srgb, #a06e0a 38%, transparent);
  }
  .donate-cta:hover { background: linear-gradient(180deg, #f6cf68, #c98d16); }
  .donate-cta svg { width: 19px; height: 19px; display: block; fill: currentColor; }
  .donate-later {
    margin-top: 12px; border: 0; background: transparent; cursor: pointer;
    font-family: var(--font-body); font-size: 12.5px;
    color: var(--color-neutral-600); text-decoration: underline;
  }
  .donate-later:hover { color: var(--color-text); }

  @media (max-width: 560px) {
    .donate-sheet { padding: 30px 20px 22px; }
    .donate-title span { font-size: 31px; }
    .donate-copy { font-size: 12.5px; }
    .donate-cta { font-size: 15px; padding: 13px 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .backtotop { transition: none; }
  }

  /* — section headers —
     A solid bar rather than a line of text: on a phone every section is a white
     card on a white page, and a heading that is only bigger type does not read
     as a division. Drawn from the accent tokens, so the money tracker takes it
     into green without a second rule. */
  .card-w-head { padding: 0 !important; overflow: hidden; }
  .card-body { padding: 18px 22px 20px; }
  .card-head {
    background: var(--color-accent-900); color: #fff;
    padding: 14px 22px; display: flex; align-items: center;
    gap: 10px 14px; flex-wrap: wrap;
  }
  .card-head-main { min-width: 0; margin-right: auto; }
  .card-head h4 { margin: 0; color: #fff; font-size: 17px; line-height: 1.25; }
  .card-head-meta {
    display: block; margin-top: 3px; font-size: 11.5px; line-height: 1.45;
    color: color-mix(in srgb, #fff 74%, transparent);
  }
  .card-head-right { display: flex; align-items: center; gap: 8px; flex: none; }
  /* The range switch sits on a dark ground here, so its own light styling
     would vanish into it — the white pill and the brand gradient the switch
     wears everywhere else both disappear against this head. Transparent
     track, white pill for the selected one, dark text inside it. */
  .card-head .seg { background: transparent; border-color: color-mix(in srgb, #fff 34%, transparent); }
  .card-head .seg-opt + .seg-opt { border-left-color: color-mix(in srgb, #fff 26%, transparent); }
  .card-head .seg-opt span { color: color-mix(in srgb, #fff 82%, transparent); }
  .card-head .seg-opt:has(input:checked) { background: #fff; }
  .card-head .seg-opt input:checked + span { color: var(--color-accent-900); }
  .head-btn {
    width: 34px; height: 34px; border-radius: 10px; cursor: pointer;
    border: 1px solid color-mix(in srgb, #fff 32%, transparent);
    background: color-mix(in srgb, #fff 12%, transparent); color: #fff;
    font-size: 17px; line-height: 1; display: flex; align-items: center; justify-content: center;
  }
  .head-btn:hover { background: color-mix(in srgb, #fff 24%, transparent); }
  .head-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  /* The insights heading is a bar and nothing else — no body to pad. */
  .insights-head .card-head { padding-block: 16px; }
  .insights-head .card-head h4 { font-size: 21px; }

  /* — logged entries —
     A card each, gathered under the category it belongs to, two columns wide at
     every width. CSS columns rather than a grid: the blocks are all different
     heights, and a grid row would size itself to the tallest one and leave a
     hole under every other. `break-inside` keeps a category whole. */
  .entry-list { column-count: 2; column-gap: 16px; }
  .entry-group { break-inside: avoid; margin: 0 0 16px; }
  .entry-tab {
    display: inline-block; max-width: 100%; margin: 0 0 -8px; padding: 6px 15px;
    border-radius: 10px 10px 0 0; color: #fff; font-weight: 600;
    font-size: 12px; letter-spacing: .01em; position: relative; z-index: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .entry-card {
    background: var(--color-bg); border: 1px solid var(--color-divider);
    border-radius: 12px; padding: 14px 16px 12px; margin-top: 10px;
    box-shadow: 0 1px 3px color-mix(in srgb, #2b2b2d 8%, transparent);
  }
  .entry-tab + .entry-card { margin-top: 0; border-top-left-radius: 4px; }
  .entry-name {
    width: 100%; border: 0; background: transparent; font: inherit;
    font-size: 15px; font-weight: 600; color: var(--color-text); padding: 0 0 2px;
  }
  .entry-name:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .entry-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 7px 0 11px; }
  .entry-controls .cell-note { margin-left: 0; }
  .entry-select { max-width: 100%; }
  .entry-times { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  /* Legend and field travel together, so the pair can stack as a unit once the
     column is too narrow to hold both times on one line. */
  .entry-time { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .entry-leg {
    font-size: 10px; letter-spacing: .09em; text-transform: uppercase;
    color: var(--color-neutral-600); flex: none;
  }
  .entry-times .cell-time { font-size: 14px !important; font-variant-numeric: tabular-nums; }
  .entry-rule { flex: 1 1 20px; height: 1px; background: var(--color-divider); min-width: 14px; }
  .entry-foot {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-top: 9px; padding-top: 9px;
    border-top: 1px solid var(--color-divider);
  }
  .entry-dur { font-size: 12.5px; color: var(--color-neutral-700); font-variant-numeric: tabular-nums; }
  /* What this one entry did to the calorie ledger. Sits between the duration
     and the delete, so the right edge of every card reads the same way. */
  .entry-kcal {
    margin-left: auto; flex: none; white-space: nowrap;
    font-size: 10.5px; font-weight: 600; line-height: 1;
    padding: 4px 9px; border-radius: 999px;
  }
  .entry-kcal[data-kind="food"] { background: color-mix(in srgb, var(--zg-donate) 20%, #fff); color: #8a5a10; }
  .entry-kcal[data-kind="burn"] { background: color-mix(in srgb, var(--zg-strong) 18%, #fff); color: #06603f; }

  /* — insights: calorie balance —
     Four half-dials on one scale: what exercise burned, what food brought in,
     what the body spent at rest, and the three netted off. Two across on a
     phone rather than four, where each would be a column one word wide. */
  .cal-kicker {
    font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--color-accent-700); margin: 16px 0 10px;
  }
  .cal-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 8px; align-items: start; }
  .cal-dial { position: relative; text-align: center; min-width: 0; }
  .cal-dial svg { width: 100%; max-width: 132px; height: auto; display: block; margin: 0 auto; }
  .cal-glyph {
    position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%);
    display: flex;
  }
  .cal-glyph svg { width: 21px; height: 21px; }
  .cal-value {
    font-family: var(--font-heading); font-size: 25px; line-height: 1;
    margin-top: -14px;
  }
  .cal-cap {
    font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase;
    color: var(--color-neutral-600); margin-top: 5px; line-height: 1.35;
  }
  /* The sentence under a dial that says where its figure came from. */
  .cal-sub { font-size: 11px; line-height: 1.5; color: var(--color-neutral-700); margin-top: 6px; }
  .cal-note { font-size: 11px; line-height: 1.5; color: var(--color-neutral-600); margin-top: 6px; }

  /* Set the weight from the reading it changes, rather than only from the card
     further down. Styled as a link because it sits inside a sentence. */
  .cal-link {
    border: 0; background: transparent; padding: 0; cursor: pointer;
    font: inherit; color: var(--color-accent-700);
    text-decoration: underline; text-underline-offset: 2px;
  }
  .cal-link:hover { color: var(--color-accent-900); }
  .cal-link:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; border-radius: 3px; }

  .cal-weight {
    display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
    margin-top: 14px; padding: 12px 14px;
    border: 1px solid var(--color-divider); border-radius: 12px;
    background: var(--color-accent-100);
  }
  .cal-weight label { font-size: 12px; color: var(--color-neutral-700); }
  .cal-weight input { width: 92px; text-align: right; }
  .cal-weight-unit { font-size: 12.5px; color: var(--color-neutral-700); }
  .cal-weight-note { font-size: 11px; color: var(--color-neutral-600); flex: 1 1 100%; }

  .cal-rest {
    font-size: 11.5px; line-height: 1.5; color: var(--zg-text);
    font-style: italic; margin-top: 12px;
  }

  /* — insights: the four dimensions —
     Two across, because four in a row makes each one a column of single words
     at the width this section actually gets. */
  .wb-kicker {
    display: block; font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--color-accent-700); margin-bottom: 7px;
  }
  .wb-status { font-size: 13.5px; line-height: 1.6; margin: 16px 0 4px; }
  .wb-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .wb-card {
    border: 1px solid var(--color-divider); border-radius: 12px;
    padding: 13px 14px 14px; background: var(--color-bg); min-width: 0;
  }
  .wb-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .wb-dial { position: relative; flex: none; width: 42px; height: 42px; }
  .wb-dial svg { width: 42px; height: 42px; display: block; }
  .wb-glyph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .wb-glyph svg { width: 18px; height: 18px; }
  .wb-label {
    font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--color-neutral-700); font-weight: 600; min-width: 0;
  }
  .wb-note { font-size: 12px; line-height: 1.55; color: var(--color-neutral-800); }
  /* The way into the activities behind a pillar's figure. Quiet, because it
     sits under a reading rather than over one. */
  .wb-see {
    margin-top: 10px; border: 0; background: transparent; padding: 0; cursor: pointer;
    font-family: var(--font-body); font-size: 11.5px; font-weight: 600;
    color: var(--color-accent-700); text-decoration: underline; text-underline-offset: 3px;
  }
  .wb-see:hover { color: var(--color-accent-900); }
  .wb-see:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; border-radius: 4px; }

  /* — insights: pro-tips —
     auto-fit rather than a fixed three: between one and six rules can fire, and
     the row should not leave gaps for cards that were never generated. */
  .tip-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .tip-card {
    border: 1px solid var(--color-divider); border-radius: 12px;
    padding: 13px 14px 14px; background: var(--color-bg); min-width: 0;
  }
  .tip-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .tip-glyph {
    flex: none; width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--color-accent-100); color: var(--color-accent-700);
  }
  .tip-glyph svg { width: 17px; height: 17px; }
  .tip-meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .tip-no {
    font-size: 9px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--color-accent-700);
  }
  .tip-label {
    font-family: var(--font-heading); font-size: 14px; line-height: 1.1;
    overflow-wrap: anywhere;
  }
  .tip-body { font-size: 12px; line-height: 1.55; color: var(--color-neutral-800); }
  .tip-body strong { color: var(--color-text); }

  /* — refine with AI —
     A quieter button than the solid drawer pill: it sits inside a reading
     rather than under one, and should not compete with it. */
  .btn-refine {
    background: #fff; color: #5f3ac9; border-color: #5f3ac9;
    font-size: 11px; padding: 5px 13px;
  }
  .btn-refine:hover:not(:disabled),
  .btn-refine:focus-visible { background: #5f3ac9; color: #fff; border-color: #5f3ac9; }
  .btn-refine:disabled { opacity: .6; cursor: default; }

  .food-text { font-size: 12.5px; line-height: 1.55; color: var(--color-neutral-800); }
  .food-items { margin-top: 6px; font-size: 11.5px; line-height: 1.6; color: var(--color-neutral-700); }

  /* — desktop reading size —
     The insights type was set for a 463px column and stayed put when the
     section moved to the 718px one, where it reads as small print. Only the
     prose grows; labels and kickers are already at their size. */
  @media (min-width: 1241px) {
    .wb-note, .tip-body, .food-text { font-size: 14px; line-height: 1.6; }
    .wb-status { font-size: 15px; }
    .food-items { font-size: 12.5px; }
    .cal-note, .cal-sub { font-size: 12px; }
    .tip-label { font-size: 15px; }
    .wb-label { font-size: 10.5px; }
    .cal-value { font-size: 28px; }
  }

  /* — mobile section order —
     `display: contents` dissolves the two layout columns on a phone so every
     section becomes a direct child of the page grid and `order` can interleave
     them. Reordering across two separate containers is otherwise impossible,
     and re-rendering a different DOM order on resize would mean the order was
     wrong until something happened to trigger a render. */
  /* Declared here rather than inline on the element, because an inline
     `display: flex` outranks any stylesheet rule and the phone breakpoint below
     has to be able to dissolve it. */
  .col { display: flex; flex-direction: column; gap: 22px; min-width: 0; }

  @media (max-width: 1240px) {
    [data-page-grid] > .col { display: contents; }
    [data-page-grid] [data-sec] { min-width: 0; }
    [data-sec="entry"]      { order: 1; }
    [data-sec="entrycard"]  { order: 2; }
    [data-sec="log"]        { order: 3; }
    [data-sec="chart"]      { order: 4; }
    [data-sec="board"]      { order: 5; }
    [data-sec="stats"]      { order: 6; }
    [data-sec="timeline"]   { order: 7; }
    [data-sec="ins-head"]   { order: 8; }
    [data-sec="ins-today"]  { order: 9; }
    [data-sec="ins-past"]   { order: 10; }
    [data-sec="ins-weight"] { order: 11; }
  }

  @media (max-width: 560px) {
    .card-head { padding: 13px 16px; }
    .card-head h4 { font-size: 16px; }
    .insights-head .card-head h4 { font-size: 18px; }
    .card-body { padding: 16px 16px 18px; }
    /* Two by two. Four across leaves each dial a column one word wide. */
    .cal-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cal-value { font-size: 21px; }
    .cal-sub { font-size: 10.5px; }
    .cal-weight input { width: 78px; }
    .wb-grid { grid-template-columns: minmax(0, 1fr); }
    .tip-grid { grid-template-columns: minmax(0, 1fr); }
  }

  /* — financial insights —
     Four figures across where there is room. Left to wrap on its own the
     fourth tile drops to a line by itself on a phone, so the narrow case is
     an explicit 2×2 rather than a 3+1. */
  .fin-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 10px; }
  @media (max-width: 560px) {
    .fin-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px 12px; }
  }

  /* — table cells — */
  .cell-input { width: 100%; border: 0; background: transparent; font: inherit; font-size: 14px; color: inherit; padding: 2px 0; }
  .cell-time { border: 0; background: transparent; font: inherit; font-size: 14px; color: inherit; }
  .cell-num { width: 100%; text-align: right; border: 0; background: transparent; font: inherit; font-size: 14px; color: inherit; }
  .cell-num.is-in { color: var(--color-accent-700); }
  .cell-spent { font-variant-numeric: tabular-nums; color: var(--color-neutral-700); }
  .cell-del { border: 0; background: transparent; cursor: pointer; color: var(--color-neutral-500); font-size: 15px; padding: 2px 4px; }
  .rows-scroll { overflow-x: auto; }

  /* — timer — */
  .timer-card { display: grid; grid-template-columns: auto 1fr auto; gap: 22px; align-items: center; }
  .timer-btn {
    padding: 60px 40px; border-radius: 20px; cursor: pointer;
    font-family: var(--font-heading); font-weight: 600; font-size: 20px;
    color: var(--color-bg);
  }
  /* The block is tall by design; on a phone it should not eat the whole screen. */
  @media (max-width: 900px) { .timer-btn { padding: 34px 40px; } }

  /* — report — */
  .report-wrap { padding: 36px 20px; }
  .report-sheet { padding: 46px 52px 52px; }
  .report-donut { width: 230px; height: 230px; }

  /* ── responsive ──────────────────────────────────────────────
     One layout all the way down. The page grid drops to a single
     column first; below that the cards stack internally and the
     entry tables become stacked rows, so every field stays
     editable without a sideways scroll. */

  @media (max-width: 1240px) {
    [data-page-grid] { grid-template-columns: minmax(0, 1fr) !important; }
  }

  @media (max-width: 900px) {
    [data-page-grid] { padding: 22px 18px !important; gap: 18px !important; }
    .timer-card { grid-template-columns: minmax(0, 1fr); gap: 16px; }
    .timer-btn { width: 100%; }
  }

  @media (max-width: 720px) {
    .appbar { padding: 12px 16px; gap: 10px 12px; }
    .appbar-meta { order: 9; flex: 1 0 100%; margin-right: 0; }
    .appbar .btn { margin-left: auto; }

    [data-page-grid] { padding: 18px 14px !important; }

    /* Entry rows stop being a table and become stacked records. */
    .rows-scroll { overflow-x: visible; }
    .rows, .rows tbody, .rows tr, .rows td { display: block; }
    .rows thead { display: none; }
    .rows tr {
      display: flex; flex-wrap: wrap; align-items: center; gap: 7px 12px;
      padding: 13px 0; border-bottom: 1px solid var(--color-divider);
    }
    .rows td { border: 0; padding: 0; }
    .rows td[data-col="activity"] { flex: 1 1 100%; }
    .rows td[data-col="category"] { flex: 1 1 100%; }
    /* From and To share the row rather than splitting across two: each takes
       just under half, so they always land side by side. */
    .rows td[data-col="from"], .rows td[data-col="to"] { flex: 1 1 42%; min-width: 0; }
    .rows td[data-col="spent"] { flex: 1 1 100%; }
    .rows td[data-col="remove"] { order: 9; margin-left: auto; text-align: right; }
    .rows .cell-num { width: auto; text-align: left; min-width: 74px; }

    /* The activity and its category are the row's content; the times are
       supporting detail, so the content gets the larger type. */
    .rows .cell-input { font-size: 14.5px !important; font-weight: 600; }
    .rows td[data-col="category"] select { font-size: 13px !important; }
    .rows .cell-time { font-size: 13px !important; }
    .rows td[data-label]::before {
      content: attr(data-label); margin-right: 5px;
      font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
      color: var(--color-neutral-600);
    }

    /* Donut beside legend leaves the legend about 110px on a phone, which
       truncates every category name. Stacked, it gets the full width. */
    .chart-row { flex-direction: column; gap: 14px !important; align-items: stretch !important; }
    .chart-row > div:first-child { margin: 0 auto; }

    .report-wrap { padding: 14px 10px; }
    .report-sheet { padding: 26px 20px 30px; }
    .report-donut { width: 190px; height: 190px; margin: 0 auto; }
    .report-hint { display: none; }

    /* Report activity rows: the four fixed columns total more than a phone is
       wide, so they overlapped. The activity takes its own line and the rest
       wrap beneath it. Sizes drop 2px to match the rest of the mobile view. */
    .ract { flex-wrap: wrap; gap: 3px 10px !important; padding: 9px 0 !important; }
    .ract-what { flex: 1 1 100% !important; order: -1; font-size: 12.5px !important; font-weight: 600; }
    .ract-when { flex: 0 0 auto !important; font-size: 10px !important; }
    .ract-cat { flex: 0 1 auto !important; min-width: 0; font-size: 10.5px !important; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ract-amt { flex: 0 0 auto !important; margin-left: auto; text-align: right !important; font-size: 11px !important; }
    .ract-note { padding-left: 0 !important; }
    .ract-note span { font-size: 10.5px !important; }

    /* 2px off the report's own type. */
    .report-sheet h4 { font-size: 19px; }
    .report-sheet table { font-size: 12px; }
    .report-sheet th { font-size: 9px; }
  }

  /* — mobile type scale — 2px down across the app's common sizes. */
  @media (max-width: 720px) {
    .blueprint h4 { font-size: 15px; }
    .cell-input, .cell-time, .cell-num { font-size: 12px !important; }
    .cell-spent { font-size: 12px; }
    .drawer-btn { font-size: 11px; }
    .appbar-meta { font-size: 10.5px; }

    /* Entry cards keep their two columns on a phone, which leaves each one
       about half of 320px. Everything inside tightens to suit, and From and To
       stop sharing a line — side by side they would be 60px each. */
    .entry-list { column-gap: 10px; }
    .entry-group { margin-bottom: 13px; }
    .entry-tab { font-size: 11px; padding: 5px 11px; }
    .entry-card { padding: 11px 12px 10px; }
    .entry-name { font-size: 13.5px; }
    .entry-controls { gap: 6px; margin: 6px 0 9px; }
    .entry-times { flex-direction: column; align-items: stretch; gap: 5px; }
    .entry-time { justify-content: space-between; }
    .entry-rule { display: none; }
    .entry-times .cell-time { font-size: 12.5px !important; }
    .entry-foot { margin-top: 8px; padding-top: 8px; }
    .entry-dur { font-size: 11.5px; }
    /* Half a phone leaves no room beside the duration, so the chip takes its
       own line rather than crushing both. */
    .entry-foot { flex-wrap: wrap; row-gap: 7px; }
    .entry-kcal { font-size: 10px; padding: 3px 8px; order: 3; margin-left: 0; flex-basis: 100%; text-align: center; }
  }

  /* — no zoom on focus (phones) —
     iOS Safari zooms the viewport whenever a focused field computes under 16px,
     and it has ignored user-scalable=no and maximum-scale since iOS 10 — so the
     meta tag cannot fix this and the fields themselves have to be big enough.
     Declared last, and with !important, because the rules it overrides are
     themselves !important and sit earlier in this file.

     The dense fields get their space back by giving up padding rather than
     type, so rows grow a little but nothing overflows. */
  @media (max-width: 720px) {
    input, select, textarea,
    .input, .cell-input, .cell-time, .cell-num, .entry-name, .entry-select,
    .entry-times .cell-time, .rows .cell-input, .rows .cell-time,
    .rows td[data-col="category"] select {
      font-size: 16px !important;
    }
    /* 16px in a half-width card needs the padding back. */
    .entry-card { padding: 10px 11px 9px; }
    .entry-name { padding-bottom: 1px; }
    .entry-controls { gap: 5px; margin: 5px 0 8px; }
    .entry-select { padding: 2px 8px !important; }
    .entry-leg { font-size: 9px; letter-spacing: .06em; }
    .entry-times { gap: 4px; }
    .entry-time { gap: 4px; }
    .cell-note { font-size: 10px; padding: 3px 8px; }
  }

  /* — the report deck —
     One card at a time, snapped horizontally. Scroll-snap rather than a
     gesture handler: it gives native momentum and rubber-banding, and it does
     not fight the browser for the touch. */
  .deck-backdrop {
    position: fixed; inset: 0; z-index: 58;
    background: color-mix(in srgb, var(--color-accent-900) 92%, transparent);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .deck-shell {
    position: relative; width: 560px; max-width: 100%;
    height: min(760px, calc(100vh - 32px));
    display: flex; flex-direction: column; gap: 12px;
  }
  .deck-bars { display: flex; gap: 5px; flex: none; padding: 0 2px; }
  .deck-bar {
    flex: 1; height: 4px; border: 0; padding: 0; cursor: pointer; border-radius: 999px;
    background: color-mix(in srgb, #fff 30%, transparent);
  }
  .deck-bar.is-on { background: #fff; }
  .deck-bar:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

  /* Sits over the card on a phone, where a white glyph on a white card is no
     glyph at all — so it carries its own dark ground at every width. */
  .deck-x {
    position: absolute; top: 16px; right: 10px; z-index: 4;
    width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
    border: 1px solid color-mix(in srgb, #fff 34%, transparent);
    background: color-mix(in srgb, var(--color-accent-900) 68%, transparent);
    color: #fff; font-size: 21px; line-height: 1; padding: 0 0 2px;
    display: flex; align-items: center; justify-content: center;
  }
  .deck-x:hover { background: var(--color-accent-900); }
  .deck-x:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  .deck-track {
    flex: 1; min-height: 0;
    display: flex; overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .deck-track::-webkit-scrollbar { display: none; }
  .deck-slide { flex: 0 0 100%; scroll-snap-align: center; min-width: 0; display: flex; }

  .deck-card {
    --card-accent: var(--color-accent);
    flex: 1; min-width: 0;
    background: #fff; border-radius: var(--radius-lg);
    padding: 30px 30px 24px; display: flex; flex-direction: column;
    box-shadow: var(--shadow-lg);
  }
  /* The content sits in the middle of the card rather than hugging its top —
     a sparse card is three lines, and pinned to the top it read as a mistake.
     Scrolls within itself when a card carries six rows and a note. */
  .deck-body {
    flex: 1; min-height: 0; overflow-y: auto;
    display: flex; flex-direction: column; justify-content: center;
  }
  .deck-kicker {
    font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase;
    font-weight: 600; color: var(--card-accent); margin-bottom: 14px;
  }
  .deck-big {
    font-family: var(--font-heading); font-weight: 700; line-height: 1;
    font-size: clamp(52px, 15vw, 82px); letter-spacing: -.01em;
    overflow-wrap: anywhere;
  }
  .deck-title { font-size: 21px; line-height: 1.35; color: var(--color-neutral-800); margin-top: 12px; }
  .deck-lines { margin-top: 12px; }
  .deck-lines p { margin: 0 0 7px; font-size: 14.5px; line-height: 1.55; color: var(--color-neutral-700); }

  .deck-rows { margin-top: 18px; }
  .deck-row {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 0; border-bottom: 1px solid var(--color-divider);
    font-size: 15px;
  }
  .deck-dot { width: 11px; height: 11px; flex: none; border-radius: 3px; }
  .deck-row-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .deck-row-meta { flex: none; font-size: 12.5px; color: var(--color-neutral-600); }
  .deck-row-value { flex: none; font-variant-numeric: tabular-nums; font-weight: 600; }

  .deck-note { margin-top: 16px; font-size: 13.5px; line-height: 1.6; color: var(--color-neutral-700); }
  .deck-mark {
    flex: none; padding-top: 18px;
    font-family: var(--font-heading); font-weight: 700; font-size: 13px;
    color: var(--color-neutral-500);
  }
  .deck-mark span { color: var(--card-accent); }

  .deck-arrow {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 3;
    width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
    border: 1px solid color-mix(in srgb, #fff 40%, transparent);
    background: color-mix(in srgb, var(--color-accent-900) 55%, transparent);
    color: #fff; font-size: 24px; line-height: 1; padding: 0 0 3px;
  }
  .deck-arrow:hover { background: var(--color-accent-900); }
  .deck-prev { left: -18px; }
  .deck-next { right: -18px; }

  .deck-foot { flex: none; display: flex; gap: 10px; justify-content: center; }
  .deck-foot .btn { font-size: 14px; }

  /* Screen-hidden; the PDF's closing pages. */
  .deck-print { display: none; }

  @media (max-width: 620px) {
    .deck-backdrop { padding: 0; }
    .deck-shell { height: 100vh; width: 100%; gap: 8px; padding: 10px 10px 12px; }
    .deck-bars { padding-top: 4px; padding-right: 42px; }
    .deck-x { top: 22px; }
    .deck-card { border-radius: 14px; padding: 26px 20px 20px; }
    /* No room beside the card on a phone, and a thumb does not need them. */
    .deck-arrow { display: none; }
    .deck-foot .btn { flex: 1; justify-content: center; padding-inline: 12px; }
  }

  /* — the PDF —
     Printing unrolls the deck: the fixed backdrop becomes ordinary flow (fixed
     positioning pins output to a single page and truncates everything after
     it), the horizontal scroller becomes a stack, and each card takes a page.
     The detail pages the deck hides on screen follow at the end, so the file
     carries both the story and the evidence behind it. */
  @media print {
    .no-print { display: none !important; }
    [data-app] > .appbar,
    [data-app] > [data-page-grid] { display: none !important; }
    [data-app] { min-height: 0 !important; padding-bottom: 0 !important; }

    .deck-backdrop {
      position: static !important; inset: auto !important; z-index: auto !important;
      display: block !important; background: none !important; padding: 0 !important;
    }
    .deck-shell {
      width: 100% !important; max-width: none !important; height: auto !important;
      display: block !important; padding: 0 !important;
    }
    .deck-track {
      display: block !important; overflow: visible !important;
      scroll-snap-type: none !important;
    }
    .deck-slide {
      display: block !important; width: 100% !important;
      break-after: page; page-break-after: always;
    }
    .deck-slide:last-of-type { break-after: auto; page-break-after: auto; }
    .deck-card {
      box-shadow: none !important; border: 1px solid #ddd !important;
      border-radius: 0 !important; overflow: visible !important;
      padding: 0 0 18px !important; min-height: 0 !important;
      display: block !important;
    }
    .deck-big { font-size: 44px !important; }
    .deck-mark { margin-top: 20px !important; }

    .deck-print { display: block !important; break-before: page; page-break-before: always; }
    .deck-print h4 { font-size: 20px; margin: 0 0 12px; }
    .deck-print table { width: 100%; }

    @page { margin: 14mm; }
  }
</style>
