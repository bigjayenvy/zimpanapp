<link rel="stylesheet" href="ds/styles.css">
<style>
  body { margin: 0; }
  input, select, button { font-family: inherit; }
  .btn { border-radius: 999px; padding-inline: 18px; }
  .btn-icon { border-radius: 999px; padding-inline: 0; }
  .seg { border-radius: 999px; max-width: 100%; }
  .seg-opt { padding-inline: 15px; }
  /* Four options at full padding need 307px, and the insights column on a
     320px phone offers about 270. The labels stay whole and the padding gives
     way — "Yesterday" abbreviated would be worse than a tighter pill.

     With the three long windows there are seven, which no amount of padding
     will fit, so the control scrolls inside itself and keeps its pill shape.
     "3 Months" cut down to "3M" would save the row and lose the reader. */
  @media (max-width: 560px) {
    .seg-opt { padding-inline: 9px; font-size: 12px; }
  }
  .seg { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  .seg::-webkit-scrollbar { display: none; }
  .seg-opt { flex: none; }
  input[type="time"]::-webkit-calendar-picker-indicator { opacity: .35; }

  /* ── the mobile logging flow ──
     Everything else on the phone is drawn with the design system's classes and
     tokens. These three are the pieces it has no equivalent for: a card that
     has to pulse, a rail that has to be dragged, and a fill that has to read as
     "nothing was here". The animations are named because the flow leans on
     them by name — a step slides in, a tick pops, a running timer breathes. */
  @keyframes zStep { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes zPop  { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: none; } }
  @keyframes zPulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

  /* The running timer. Outlined rather than filled, so the idle card's
     gradient stays the thing that invites a tap and this one just reports. */
  .m-timer {
    display: flex; align-items: center; gap: 14px;
    padding: 16px; border-radius: 18px;
    background: #fff; border: 1.5px solid var(--color-accent);
    box-shadow: 0 8px 22px color-mix(in srgb, var(--color-accent) 18%, transparent);
  }
  .m-timer-dot {
    width: 10px; height: 10px; flex: none; border-radius: 50%;
    background: var(--color-accent);
    animation: zPulse 1.4s ease-in-out infinite;
  }

  /* The drag track. The hit area is 38px tall against a 10px rail, because the
     thing being aimed at is a finger's width even though it does not look it.
     touch-action is what stops the browser scrolling the page instead. */
  .m-track {
    position: relative; height: 38px; margin-top: 12px;
    cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .m-track:active { cursor: grabbing; }
  .m-rail {
    position: absolute; left: 0; right: 0; top: 14px;
    height: 10px; border-radius: 999px; background: var(--color-neutral-200);
  }
  .m-fill {
    position: absolute; top: 14px; height: 10px; border-radius: 999px;
    background: linear-gradient(90deg, #8b5cf6, #4f46e5);
  }
  .m-handle {
    position: absolute; top: 5px; width: 28px; height: 28px;
    margin-left: -14px; border-radius: 50%;
    background: #fff; border: 2.5px solid var(--color-accent);
    box-shadow: 0 4px 12px color-mix(in srgb, var(--color-accent-2) 35%, transparent);
  }

  /* Unlogged time. Hatched rather than a flat colour: a solid bar reads as a
     category you cannot name, and this is the absence of one. */
  .m-hatch {
    background: repeating-linear-gradient(115deg,
      var(--color-accent-300) 0 7px, var(--color-accent-200) 7px 14px);
  }
  /* The banner's tile carries the same hatch at a tighter pitch, since it is a
     third of the width and the stripes would otherwise read as two blocks. */
  .m-hatch-tile {
    background: repeating-linear-gradient(115deg,
      var(--color-accent-300) 0 6px, var(--color-accent-200) 6px 12px);
  }

  /* The search field is a line, not a box — but .input's focus ring would draw
     the box back the moment it was tapped, so the underline takes the focus
     instead and grows into the accent. */
  input[data-k="search-q"]:focus-visible {
    border-color: transparent transparent var(--color-accent) transparent !important;
    box-shadow: 0 1px 0 0 var(--color-accent) !important;
    outline: none;
  }
  input[data-k="search-q"]:hover { border-bottom-color: var(--color-accent) !important; }

  /* The scrolling bar chart. No visible scrollbar — it would sit across the
     day letters — and momentum scrolling so the drag feels like the rest of
     the phone. The fade on the right edge is what says there is more. */
  .m-bars.is-wide {
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    -ms-overflow-style: none;
    mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 22px), transparent 100%);
    -webkit-mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 22px), transparent 100%);
  }
  .m-bars.is-wide::-webkit-scrollbar { display: none; }
  /* At the right-hand end there is nothing more to promise, so the fade goes. */
  .m-bars.is-wide.at-end {
    mask-image: none;
    -webkit-mask-image: none;
  }

  /* Held down, a numpad key lights rather than moves — the finger is already
     covering it, so anything subtler is invisible. */
  .m-key:active { background: var(--color-accent-200) !important; }

  /* The category picker borrows the desktop popover wholesale; what it cannot
     borrow is the desktop's hit target. A 31px row is a comfortable click and
     a poor tap, so the rows grow to the 44px this flow holds everything else
     to, and the popover sits on white rather than the surface tint so it reads
     as a sheet over the step rather than part of it. */
  .m-pick .pick-pop { background: #fff; padding: 10px; }
  /* 46 rather than 44. Forty-four is the minimum a touch target is allowed to
     be, and sitting exactly on it meant the measured height straddled the line
     — sub-pixel layout put some rows a hair under. A minimum is a floor to
     clear, not a number to land on. */
  .m-pick .pick-opt {
    display: flex; align-items: center; gap: 9px;
    min-height: 46px; padding: 8px 10px; font-size: 15px; border-radius: 10px;
  }
  /* `filterPicker` hides rows with the `hidden` attribute, which works through
     the UA rule [hidden] { display: none }. A class selector setting display
     outranks it, so the rule above quietly beat the filter: rows were marked
     hidden and stayed on screen. Anything that sets display on something
     hideable has to say what hidden means for it. */
  .m-pick .pick-opt[hidden] { display: none; }
  /* Same reasoning as the option itself: a flex row needs telling what hidden
     means for it, or the UA rule loses to the display declaration. */
  .pick-row[hidden] { display: none; }
  .m-pick .pick-opt.is-on { background: var(--color-accent-100); }
  .m-pick .pick-list { gap: 2px; }
  .m-pick .pick-btn { box-shadow: var(--shadow-sm); }

  @media (prefers-reduced-motion: reduce) {
    .m-timer-dot { animation: none; }
    [style*="zStep"], [style*="zPop"] { animation: none !important; }
  }

  /* — semantic colour —
     These carry meaning rather than brand: energy out, energy in, giving. They
     stay green/amber through the rebrand — recolouring "burned" violet would
     make it agree with everything else on the page and mean nothing — but both
     are retuned to sit with the violet rather than against it. */
  :root {
    /* Time on the left, money on the right, and the card that carries both
       figures sweeps from one tracker's hue to the other. The stops run
       through blue rather than straight from violet to teal — the direct path
       between them passes through a muddy grey at the midpoint, which is
       exactly where this card is widest. */
    --grad-time-money: linear-gradient(100deg, #8b5cf6 0%, #6d54f0 32%, #3f7fd4 66%, #16a394 100%);
    --zg-strong: #0e9f6e;
    --zg-text: #57516b;
    /* The selected block in the bottom bar: a tint of the brand, since the
       brand is now the thing the app is built out of. */
    --bn-active: #efe9fe;
    --zg-donate: #e9a13b;
    /* A calorie surplus is a warning rather than a nudge, so it leaves the
       amber the food gauge uses and takes a red of its own. */
    --zg-alert: #d92d20;
    /* The empty half of any meter — the donut's ring, a progress bar's rest,
       the unlogged part of the timeline. A wash of the accent rather than the
       neutral grey these all used, and it repoints with the tracker. */
    --track: color-mix(in srgb, var(--color-accent) 15%, #fff);
  }

  /* Small inline labels take a violet-cast grey rather than a flat one, so the
     captions belong to the palette. neutral-600 is the app's caption grey; the
     darker body greys are deliberately left alone. */
  [data-app] { --color-neutral-600: var(--zg-text); }

  /* — donate —
     Amber rather than an accent shade, so it reads as its own thing against
     both the blue time theme and the green money theme. */
  .btn-donate {
    display: inline-flex; align-items: center; gap: 7px;
    background: #e08a1e; border: 1px solid #c9761200; color: #fff;
    text-decoration: none; font-weight: 600;
    box-shadow: 0 1px 3px color-mix(in srgb, #8a5100 30%, transparent);
  }
  .btn-donate svg { width: 15px; height: 15px; display: block; }
  .btn-donate:hover { background: #c9760f; color: #fff; }
  .btn-donate:focus-visible { outline: 2px solid #8a5100; outline-offset: 2px; }

  /* — money tracker theme —
     Accent tokens are inherited custom properties, so re-declaring them on the
     page wrapper repoints every accent in the money view — buttons, kickers,
     chips, the report sheet — without touching the design system. Teal rather
     than violet, so which tracker you are in is readable at arm's length; both
     hues are drawn from the same gradient family. */
  [data-app="money"] {
    --color-accent: #16a394;
    --color-accent-2: #0f766e;
    --color-accent-100: #e6f7f4;
    --color-accent-200: #c7ede7;
    --color-accent-300: #97ddd2;
    --color-accent-400: #63c8ba;
    --color-accent-500: #35ae9f;
    --color-accent-600: #199184;
    --color-accent-700: #10756c;
    --color-accent-800: #0b5750;
    --color-accent-900: #073b36;
    --color-accent-2-100: #e6f7f4;
    --color-accent-2-200: #cceee9;
    --color-accent-2-300: #a3ded5;
    --color-accent-2-400: #72c9bd;
    --color-accent-2-500: #46b0a2;
    --color-accent-2-600: #229286;
    --color-accent-2-700: #14746b;
    --color-accent-2-800: #0d5751;
    --color-accent-2-900: #083c37;
    --grad-brand: linear-gradient(115deg, #2bb8a5 0%, #16a394 45%, #0f766e 100%);
    --grad-brand-hover: linear-gradient(115deg, #22a795 0%, #12907f 45%, #0b6259 100%);
  }

  /* — loading affordances — */
  @keyframes zimpan-spin { to { transform: rotate(360deg); } }
  .spinner {
    display: inline-block; width: 14px; height: 14px; flex: none;
    border: 2px solid currentColor; border-right-color: transparent;
    border-radius: 50%; animation: zimpan-spin .7s linear infinite;
  }
  .spinner.lg { width: 24px; height: 24px; border-width: 3px; }

  /* Sits above everything while any request is in flight. */
  .topbar { position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 60; pointer-events: none; overflow: hidden; }
  @keyframes zimpan-slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(420%); } }
  .topbar > i { display: block; height: 100%; width: 28%; background: var(--color-accent); animation: zimpan-slide 1.15s ease-in-out infinite; }

  .toast {
    position: fixed; left: 20px; bottom: 20px; z-index: 60;
    background: var(--color-neutral-900); color: var(--color-bg);
    font-family: var(--font-body); font-size: 13px;
    padding: 9px 15px; border-radius: 999px; box-shadow: var(--shadow-md);
    max-width: calc(100vw - 40px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* A labelled control rather than a faint glyph — at 25% opacity nobody
     could tell it was a button. */
  .cell-note {
    border: 1px solid var(--color-divider); background: transparent;
    cursor: pointer; font-family: var(--font-body); font-size: 10.5px;
    line-height: 1; padding: 3px 9px; margin-left: 6px;
    border-radius: 999px; vertical-align: middle; white-space: nowrap;
    color: var(--color-neutral-700);
  }
  .cell-note[data-has-note] {
    border-color: var(--zg-strong); color: var(--zg-text); font-weight: 600;
  }
  .cell-note:hover { background: var(--color-accent-700); border-color: var(--color-accent-700); color: #fff; }
  .cell-note:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 1px; }

  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 2.4s; }
    .topbar > i { animation-duration: 3s; }
  }

  /* — drawers —
     Collapsed sections keep the phone view short. The button says how much is
     hidden, so "Show more" is never a guess. */
  /* Solid pill by default, inverting to white on hover. The accent tokens are
     used rather than a fixed navy so the money tracker's green theme carries
     through here too. */
  .drawer-btn {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--color-accent-700);
    background: var(--color-accent-700);
    color: #fff;
    font-family: var(--font-body); font-size: 12.5px; font-weight: 600;
    padding: 7px 17px; border-radius: 999px; cursor: pointer;
    transition: background-color .15s ease, color .15s ease, border-color .15s ease;
  }
  .drawer-btn:hover,
  .drawer-btn:focus-visible {
    background: #fff;
    color: var(--color-accent-900);
    border-color: var(--color-accent-900);
  }
  .drawer-btn:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .drawer-btn .drawer-caret { font-size: 10px; line-height: 1; opacity: .85; }
  .drawer-row { display: flex; justify-content: center; padding: 12px 0 2px; }

  @media (prefers-reduced-motion: reduce) { .drawer-btn { transition: none; } }

  /* — mobile bottom bar —
     Hidden entirely on desktop; the top bar keeps its buttons there. */
  .bottomnav { display: none; }

  /* Same story, and declared here rather than beside its own rules further
     down: the phone block below turns it on, and an equal-specificity
     `display: none` appearing after that block would quietly win. */
  .stickybar { display: none; }

  @media (max-width: 720px) {
    /* The landing's own phone rules are NOT here — they sit after the landing
       block further down, which declares the same properties later in the file
       and would otherwise win at equal specificity. */

    /* The tabs and the duplicated Donate/Export buttons live in the bottom bar
       on a phone. Who is signed in, and the way out, stay in the header. */
    .appbar-tabs, .appbar-cta { display: none !important; }
    .appbar-actions { margin-left: auto; }
    .appbar-account { flex-direction: column; align-items: flex-end; gap: 0; }
    .appbar-account .btn { padding-inline: 0; }
    .appbar-email { font-size: 11.5px; }

    .bottomnav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 45;
      display: flex; align-items: stretch;
      background: var(--color-bg);
      border-top: 1px solid var(--color-divider);
      box-shadow: 0 -2px 10px color-mix(in srgb, #2b2b2d 10%, transparent);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .bottomnav a, .bottomnav button {
      flex: 1 1 0; min-width: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      border: 0; background: transparent; cursor: pointer;
      font-family: var(--font-body); font-size: 10px; letter-spacing: .01em;
      color: var(--color-neutral-600); text-decoration: none;
      padding: 9px 2px 10px; -webkit-tap-highlight-color: transparent;
      transition: color .15s ease;
    }
    .bottomnav .bn-icon { display: flex; }
    .bottomnav .bn-icon svg { width: 22px; height: 22px; display: block; }
    .bottomnav .bn-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }

    /* The active destination carries a filled block as well as weight and
       colour, so it still reads on a screen in bright sun where the hue washes
       out. Only Time and Money can be current — Report and Insights are
       actions, and nothing should look selected after pressing them. */
    .bottomnav [aria-current="page"] {
      color: var(--color-accent-900); font-weight: 600;
      background: var(--bn-active);
    }
    .bottomnav [aria-current="page"] .bn-icon svg { stroke-width: 2.1; }

    /* The one item that is a link out rather than a destination, so it is
       given the donate amber instead of the nav grey. */
    .bn-donate .bn-icon svg { fill: var(--zg-donate); stroke: var(--zg-donate); }
    .bottomnav button:active .bn-icon, .bottomnav a:active .bn-icon { transform: scale(.92); }
    .bottomnav .bn-icon { transition: transform .12s ease; }
    .bottomnav button:focus-visible, .bottomnav a:focus-visible { outline: 2px solid var(--color-accent); outline-offset: -3px; border-radius: 6px; }

    @media (prefers-reduced-motion: reduce) {
      .bottomnav a, .bottomnav button, .bottomnav .bn-icon { transition: none; }
    }

    /* Content must clear the fixed bar. */
    [data-page-grid] { padding-bottom: 84px !important; }
    .toast { bottom: 78px; }

    .stickybar {
      display: block;
      position: fixed; top: 0; left: 0; right: 0; z-index: 46;
      background: var(--color-neutral-200);
      border-bottom: 1px solid var(--color-divider);
      box-shadow: 0 1px 6px color-mix(in srgb, #2b2b2d 12%, transparent);
      transform: translateY(-101%);
      transition: transform .2s ease;
      pointer-events: none;
    }
    .stickybar.is-on { transform: translateY(0); pointer-events: auto; }
    .stickybar-in { display: flex; align-items: center; gap: 10px; padding: 8px 12px; }
    /* Scrolls rather than wraps: two pills and a mark must stay on one line. */
    .stickybar-controls {
      display: flex; align-items: center; gap: 8px; min-width: 0;
      overflow-x: auto; scrollbar-width: none;
    }
    .stickybar-controls::-webkit-scrollbar { display: none; }
    /* The full wordmark takes 145px of a 320px bar once its tagline is counted,
       which pushes the pills into a scroller. The sticky bar gets the mark and
       the name only. */
    .stickybar-mark {
      margin-left: auto; flex: none; display: flex; align-items: center; gap: 7px;
      border: 0; background: transparent; padding: 0; cursor: pointer;
    }
    .stickybar-name {
      font-family: var(--font-heading); font-weight: 600; font-size: 15px;
      letter-spacing: .02em; line-height: 1; color: var(--color-text);
    }

    /* Narrowest phones: trim the pills rather than let them scroll sideways. */
    @media (max-width: 380px) {
      .stickybar-in { gap: 7px; padding: 8px 10px; }
      .stickybar-controls button { font-size: 11.5px !important; padding: 6px 11px !important; }
      .stickybar-name { font-size: 13.5px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .stickybar { transition: none; }
    }
  }

  /* — form validation —
     A refused add used to be a silent no-op, which reads as a broken button. */
  .field-err {
    display: flex; align-items: center; gap: 6px;
    margin-top: 8px; font-size: 12px; line-height: 1.45; color: #a4291f;
  }
  .field-err::before {
    content: "!"; flex: none;
    width: 15px; height: 15px; border-radius: 50%;
    background: #a4291f; color: #fff;
    font-size: 10px; font-weight: 700; line-height: 15px; text-align: center;
  }
  [aria-invalid="true"] { border-color: #a4291f !important; }
  [aria-invalid="true"]:focus-visible { outline-color: #a4291f; }

  /* — the searchable picker —
     Sized to sit where the <select> it replaces sat, so the form row wraps the
     same way it always did. The panel is absolute so opening it moves nothing;
     a panel that pushed the row apart would shift the button out from under
     the finger that just tapped it. */
  .pick-field { flex: 2 1 185px; min-width: 165px; }
  /* The panel hangs off the BUTTON, not off the field. `flex: 2 1 185px` reads
     as a width in the money form, which is a flex row — but the timer card
     lays its fields out in a column, where the same basis becomes a height and
     leaves the field 185px tall around a 36px button. Anchored to the field,
     `top: 100%` then measured from the bottom of 130px of empty space, and the
     list opened a long way clear of the control that opened it. */
  .pick-anchor { position: relative; display: block; }
  .pick-btn {
    display: flex; align-items: center; gap: 8px; text-align: left;
    cursor: pointer; background: var(--color-surface);
  }
  .pick-current { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pick-caret { flex: none; font-size: 10px; color: var(--color-neutral-600); }
  .pick-pop {
    position: absolute; z-index: 40; top: calc(100% + 5px); left: 0; right: 0;
    /* min-width, because the anchor is the button and a narrow button would
       otherwise give a narrow list. */
    min-width: 100%;
    display: flex; flex-direction: column; gap: 6px;
    padding: 8px; border-radius: var(--radius-md);
    background: var(--color-surface);
    border: 1px solid color-mix(in srgb, var(--color-accent-900) 15%, transparent);
    box-shadow: 0 14px 34px color-mix(in srgb, var(--color-accent-900) 22%, transparent);
  }
  .pick-search { flex: none; min-height: 32px; font-size: 13px; }
  /* Capped rather than unbounded: the point of the search is that the list
     never has to be scrolled far, and a panel taller than the phone defeats it. */
  .pick-list { max-height: 210px; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; }
  .pick-opt {
    /* flex: none is load-bearing. A column flex container with a capped height
       shrinks its children to fit rather than scrolling, so without this every
       row is squeezed under its own line height and the overflow below clips
       the text to a sliver — the taller the list, the thinner the slice. */
    flex: none;
    border: 0; background: transparent; font: inherit; font-size: 13.5px;
    text-align: left; padding: 7px 9px; border-radius: 7px; cursor: pointer;
    color: var(--color-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pick-opt:hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }
  .pick-opt.is-on { background: color-mix(in srgb, var(--color-accent) 16%, transparent); font-weight: 600; }
  .pick-empty { flex: none; padding: 8px 9px; font-size: 12.5px; color: var(--color-neutral-600); }
  .pick-new {
    flex: none;
    border: 0; border-top: 1px solid var(--color-divider); background: transparent;
    font: inherit; font-size: 12.5px; text-align: left; padding: 8px 9px 3px;
    color: var(--color-accent-700); cursor: pointer;
  }
  /* Catches the tap that means "not this one". Behind the panel, over the page. */
  .pick-shade { position: fixed; inset: 0; z-index: 30; }
  /* The naming row, in the popover rather than somewhere else on the page. */
  /* A row is the name plus its delete. The delete stays quiet until the row is
     reached for — a column of red crosses beside a list you are only trying to
     choose from reads as a warning rather than a list. */
  .pick-row { flex: none; display: flex; align-items: stretch; gap: 2px; }
  .pick-row .pick-opt { flex: 1; min-width: 0; }
  .pick-del {
    flex: none; width: 28px; border: 0; background: transparent; cursor: pointer;
    border-radius: 7px; font-size: 12px; line-height: 1;
    color: color-mix(in srgb, var(--color-text) 30%, transparent);
    opacity: 0; transition: opacity .12s ease;
  }
  .pick-row:hover .pick-del, .pick-del:focus-visible { opacity: 1; }
  .pick-del:hover { background: color-mix(in srgb, #8a2f4a 12%, transparent); color: #8a2f4a; }
  /* Nothing hovers on a touch screen, so there it is simply always there. */
  @media (hover: none) {
    .pick-del { opacity: .55; width: 34px; }
  }
  /* And unconditionally in the phone app, which is only ever touched — some
     Android browsers claim hover capability, and a delete that never appears
     is a feature that does not exist. */
  .m-pick .pick-del { opacity: .55; width: 34px; }

  /* Renaming happens in the row itself rather than in a dialog over the top of
     it: the list is the thing being edited, and a panel covering it would hide
     the other names — which are exactly what you check a new one against. */
  .pick-row.is-editing { gap: 4px; align-items: center; }
  .pick-rename { flex: 1; min-width: 0; min-height: 32px; font-size: 13.5px; padding-inline: 8px; }
  /* The two controls beside it stay put while editing — a confirm that only
     appears on hover is a confirm nobody finds. */
  .pick-row.is-editing .pick-del { opacity: 1; }
  .pick-ok { color: var(--color-accent-700); font-size: 14px; }
  .pick-ok:hover { background: color-mix(in srgb, var(--color-accent) 16%, transparent); color: var(--color-accent-900); }

  .pick-create { flex: none; display: flex; gap: 6px; padding-top: 6px; border-top: 1px solid var(--color-divider); }
  .pick-create .input { flex: 1; min-width: 0; min-height: 34px; font-size: 13.5px; }
  .pick-create .btn { flex: none; min-height: 34px; padding-inline: 14px; font-size: 13px; }

  @media (max-width: 720px) {
    .pick-list { max-height: 38vh; }
  }

  /* — legend —
     The rows have always been clickable; nothing on them said so.

     The row bleeds 6px past its column so the selected tint reads as a band
     rather than as a box around the words. Declared here rather than inline
     because the narrow case below has to be able to take the bleed back: with
     it, the row is its column plus 12px, which is enough to push a 320px page
     sideways once "See Entries" is on the end of it. */
  .legend-row {
    display: flex; align-items: center; gap: 9px;
    font: inherit; font-size: 13px; text-align: left;
    border: 0; cursor: pointer; color: inherit;
    padding: 4px 6px; margin: 0 -6px; border-radius: var(--radius-md);
  }
  .legend-see {
    flex: none; font-size: 10.5px; letter-spacing: .01em;
    color: var(--color-accent-700); text-decoration: underline;
    text-underline-offset: 2px; white-space: nowrap;
  }

  @media (max-width: 560px) {
    .legend-row { margin: 0; padding: 4px 0; gap: 7px; }
    .legend-see { font-size: 10px; }
  }

  /* The chip that ends the timer's category row. Dashed, so it reads as a way
     to add one rather than as another category to pick. */
  .chip-add {
    display: inline-flex; align-items: center; cursor: pointer;
    font-family: var(--font-body); font-size: 11px; padding: 4px 12px;
    border-radius: 999px; border: 1px dashed var(--color-accent-700);
    background: transparent; color: var(--color-accent-700); font-weight: 600;
  }
  .chip-add:hover { background: var(--color-accent-100); }
  .chip-add:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

  /* — the entries behind a slice —
     A lightbox rather than a panel under the chart: on a phone the list opened
     below the fold of a card you were already scrolled past, so nothing
     appeared to happen. 55 clears the fixed chrome (bottom bar 45, sticky
     header and back-to-top 46) and stays under the donation sheet at 70. */
  .focus-backdrop {
    position: fixed; inset: 0; z-index: 55;
    background: color-mix(in srgb, var(--color-neutral-900) 58%, transparent);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; overflow: auto;
  }
  .focus-sheet {
    width: 560px; max-width: 100%; max-height: calc(100vh - 40px);
    display: flex; flex-direction: column;
    background: var(--color-bg); border-radius: 16px;
    box-shadow: var(--shadow-lg); overflow: hidden;
  }
  .focus-head {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 16px 18px 14px; border-bottom: 1px solid var(--color-divider);
  }
  .focus-swatch { width: 12px; height: 12px; flex: none; margin-top: 5px; }
  .focus-title { min-width: 0; margin-right: auto; }
  .focus-title h4 { margin: 0; font-size: 18px; line-height: 1.2; overflow-wrap: anywhere; }
  .focus-sub { display: block; margin-top: 3px; font-size: 11.5px; color: var(--color-neutral-600); }
  .focus-x {
    flex: none; border: 0; background: transparent; cursor: pointer;
    font-size: 24px; line-height: 1; padding: 0 4px; color: var(--color-neutral-600);
  }
  .focus-x:hover { color: var(--color-text); }
  .focus-body { overflow-y: auto; padding: 4px 18px; -webkit-overflow-scrolling: touch; }
  .focus-row {
    display: flex; align-items: baseline; gap: 10px;
    padding: 9px 0; border-bottom: 1px solid var(--color-divider);
  }
  .focus-date { flex: 0 0 54px; font-size: 11px; color: var(--color-neutral-600); font-variant-numeric: tabular-nums; }
  .focus-what { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
  .focus-meta { flex: none; font-size: 11px; color: var(--color-neutral-600); font-variant-numeric: tabular-nums; }
  .focus-val { flex: none; min-width: 56px; text-align: right; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .focus-foot {
    display: flex; align-items: center; justify-content: flex-end; gap: 12px;
    padding: 12px 18px 14px; border-top: 1px solid var(--color-divider);
  }
  /* — steps — */
  .steps-sheet { width: 420px; }
  .steps-body { padding: 18px; }
  .steps-label { display: block; font-size: 13px; color: var(--color-neutral-800); margin-bottom: 8px; }
  .steps-input { font-size: 20px; font-family: var(--font-heading); height: 48px; text-align: center; }
  .steps-preview { margin-top: 12px; font-size: 13px; line-height: 1.55; color: var(--color-text); }
  .steps-preview strong { color: var(--zg-strong); }
  .steps-note { margin-top: 10px; font-size: 11.5px; line-height: 1.5; color: var(--color-neutral-600); }

  .focus-foot-note {
    margin-right: auto; font-size: 11px; line-height: 1.45;
    color: var(--color-neutral-600); max-width: 60%;
  }

  @media (max-width: 560px) {
    .focus-backdrop { padding: 12px; align-items: flex-end; }
    .focus-sheet { max-height: calc(100vh - 90px); }
    .focus-title h4 { font-size: 16px; }
    .focus-what { font-size: 12.5px; }
    .focus-date { flex-basis: 46px; font-size: 10.5px; }
  }

  /* — landing —
     A tinted ground with the brand bleeding in from the top right, so the page
     reads as part of the gradient rather than as white paper under it. */
  /* The banner fills the screen and stays there.
     Painted on a fixed pseudo-element rather than on .landing itself: the page
     scrolls well past one screen, and `cover` on the element would scale the
     artwork to the full scroll height — a huge crop of it behind the first
     viewport. Pinned to the viewport, "cover" means what it says. Chosen over
     background-attachment: fixed, which iOS Safari does not honour.
     The gradients under it are not decoration for its own sake: they are what
     shows if ds/home-bg.jpg is ever missing, so the page never falls to white. */
  .landing { position: relative; min-height: 100vh; color: var(--color-text); font-family: var(--font-body); }
  .landing::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      url('ds/home-bg.jpg') center right / cover no-repeat,
      radial-gradient(1100px 620px at 88% -8%, color-mix(in srgb, #4a2458 18%, transparent), transparent 62%),
      radial-gradient(760px 520px at 6% 4%, color-mix(in srgb, #2a8b7d 12%, transparent), transparent 60%),
      var(--color-bg);
  }

  /* Everything below the hero rides above the artwork, and the sections that
     carry reading matter take a wash so the words keep their ground. */
  .landing > * { position: relative; }
  .landing > .strip, .landing > footer {
    background: linear-gradient(180deg, color-mix(in srgb, var(--color-bg) 82%, transparent), var(--color-bg) 42%);
  }

  .landing-bar {
    display: flex; align-items: center; gap: 18px;
    padding: 16px 30px; flex-wrap: wrap;
    max-width: 1240px; margin: 0 auto;
  }
  .landing-brand {
    display: flex; align-items: center; gap: 10px;
    text-decoration: none; color: inherit; flex: none;
  }
  .landing-name {
    font-family: var(--font-heading); font-weight: 800; font-size: 21px;
    letter-spacing: .01em; line-height: 1;
  }
  .landing-nav { display: flex; align-items: center; gap: 4px; margin: 0 auto; }
  .landing-nav button {
    border: 0; background: transparent; cursor: pointer;
    font-family: var(--font-body); font-size: 14px; font-weight: 500;
    color: var(--color-neutral-800); padding: 8px 13px; border-radius: 999px;
  }
  .landing-nav button:hover { background: color-mix(in srgb, var(--color-accent) 11%, transparent); color: var(--color-accent-800); }
  .landing-nav button:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 1px; }
  .landing-actions { display: flex; align-items: center; gap: 10px; flex: none; }
  .landing-login {
    border: 0; background: transparent; cursor: pointer;
    font-family: var(--font-body); font-size: 14px; font-weight: 500;
    color: var(--color-neutral-800); padding: 8px 6px;
  }
  .landing-login:hover { color: var(--color-accent-700); }
  .landing-login:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; border-radius: 6px; }

  .hero {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr);
    gap: 44px; align-items: center;
    max-width: 1240px; margin: 0 auto; padding: 26px 30px 40px;
  }
  .hero-eyebrow {
    display: inline-block; margin-bottom: 16px; padding: 6px 14px;
    border-radius: 999px; background: #fff;
    border: 1px solid color-mix(in srgb, var(--color-accent) 26%, transparent);
    font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase;
    color: var(--color-accent-700); font-weight: 600;
    box-shadow: var(--shadow-sm);
  }
  /* The reference sets its headline in caps. Done with text-transform rather
     than in the string, so the copy stays readable in the source. */
  .hero-h1 {
    font-family: var(--font-heading); font-weight: 800;
    font-size: clamp(34px, 4.6vw, 58px); line-height: 1.04;
    letter-spacing: -.01em; text-transform: uppercase;
    margin: 0 0 18px; text-wrap: balance;
  }
  .hero-lede {
    font-size: 16px; line-height: 1.65; color: var(--color-neutral-800);
    margin: 0 0 24px; max-width: 52ch;
  }
  /* Two buttons on the first row, the team one on its own beneath them running
     the full width of both. A grid rather than a wrapping flex row: wrapping
     would put it under only the first button whenever the row happened to
     break, and "the width of the pair" is the whole point of it. */
  .hero-ctas { display: grid; grid-template-columns: auto auto; gap: 12px; justify-content: start; }
  .hero-cta2 { font-size: 15px; font-weight: 600; padding: 13px 26px; }
  .hero-cta3 {
    grid-column: 1 / -1;
    display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    width: 100%; padding: 13px 26px; border-radius: 999px; border: 0; cursor: pointer;
    font-family: var(--font-body); font-size: 15px; font-weight: 600;
    background: var(--zg-donate); color: #fff;
    box-shadow: 0 6px 18px color-mix(in srgb, var(--zg-donate) 42%, transparent);
  }
  .hero-cta3 svg { width: 16px; height: 16px; display: block; }
  .hero-cta3:hover { background: #d8901f; }
  .hero-cta3:focus-visible { outline: 2px solid #8a5100; outline-offset: 2px; }

  /* On a narrow screen the pair stacks, and the team button keeps its row. */
  @media (max-width: 520px) {
    .hero-ctas { grid-template-columns: 1fr; }
  }

  /* The one gold item in the nav, because it goes somewhere else. */
  .landing-nav .nav-gold { color: #885bf6; font-weight: 700; }
  .landing-nav .nav-gold:hover { color: #6d43d4; }

  .hero-svg { width: 100%; height: auto; display: block; overflow: visible; }

  /* — the featured strip — */
  .strip { max-width: 1240px; margin: 0 auto; padding: 12px 30px 20px; scroll-margin-top: 20px; }
  .strip-head { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
  .strip-kicker {
    flex: none; font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase;
    font-weight: 600; color: var(--color-accent-800);
  }
  .strip-rule { flex: 1; height: 1px; background: color-mix(in srgb, var(--color-accent-900) 16%, transparent); }
  .strip-note { flex: none; font-size: 12px; color: var(--color-neutral-600); }

  /* — landing on a phone —
     Declared here rather than in the shared phone block near the top of this
     file: that block comes before the landing rules above, and at equal
     specificity the later declaration wins. */
  @media (max-width: 720px) {
    /* The artwork's clear half is on its left, which a phone-width crop of a
       landscape banner loses — so a scrim goes over it to keep the headline
       readable on top. Still viewport-sized, still fixed. */
    .landing::before {
      background:
        linear-gradient(180deg, color-mix(in srgb, #f8f7fb 74%, transparent) 0%, color-mix(in srgb, #f8f7fb 90%, transparent) 52%, #f8f7fb 78%),
        url('ds/home-bg.jpg') center right / cover no-repeat,
        var(--color-bg);
    }

    /* The header keeps the wordmark and a way in — the hero's own Start
       Tracking button sits a thumb-length below it. */
    .landing-cta-top { display: none; }
    .landing-bar { padding: 14px 18px; gap: 10px; }
    .landing-actions { margin-left: auto; }
    /* The links move under the brand row rather than squeezing beside it, and
       scroll rather than wrap — four links breaking to two lines leave one
       stranded, and no amount of trimming holds them on one line at 320px.
       Same treatment the sticky bar's controls already use. */
    .landing-nav {
      order: 9; flex: 1 0 100%; margin: 2px 0 0;
      justify-content: flex-start; flex-wrap: nowrap; gap: 0;
      overflow-x: auto; scrollbar-width: none;
    }
    .landing-nav::-webkit-scrollbar { display: none; }
    .landing-nav button { font-size: 12.5px; padding: 6px 10px; flex: none; }
    .hero-h1 { font-size: clamp(28px, 8.4vw, 40px); }
    .hero-lede { font-size: 15px; }
    .hero-ctas { gap: 10px; }
    .hero-ctas .btn { width: 100%; justify-content: center; }
    .strip { padding: 8px 18px 16px; }
    .strip-note { display: none; }
  }

  .hero-checks {
    list-style: none; margin: 0 0 26px; padding: 0;
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px 22px;
  }
  .hero-checks li {
    display: flex; align-items: center; gap: 9px;
    font-size: 14.5px; color: var(--color-neutral-800); min-width: 0;
  }
  .hero-check { display: flex; flex: none; color: var(--color-accent); }
  .hero-check svg { width: 19px; height: 19px; display: block; }

  .landing-points { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
  .feature-card {
    display: flex; align-items: flex-start; gap: 14px;
    background: #fff; border: 1px solid color-mix(in srgb, var(--color-accent-900) 8%, transparent);
    border-radius: var(--radius-lg); padding: 20px 20px 22px;
    box-shadow: var(--shadow-sm);
    transition: transform .16s ease, box-shadow .16s ease;
  }
  .feature-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
  .feature-badge {
    flex: none; width: 52px; height: 52px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    background: var(--grad-brand); color: #fff;
    box-shadow: 0 4px 12px color-mix(in srgb, #4f46e5 28%, transparent);
  }
  .feature-badge svg { width: 26px; height: 26px; display: block; }

  @media (max-width: 900px) {
    /* Copy first, then the image — the reading order the mobile design uses. */
    .hero { grid-template-columns: minmax(0, 1fr); gap: 26px; padding: 14px 20px 28px; }
    .hero-checks { gap: 9px 16px; margin-bottom: 20px; }
    .hero-checks li { font-size: 13.5px; }
    .landing-points { gap: 12px; }
    .feature-card { padding: 15px 16px 17px; gap: 12px; }
    .feature-badge { width: 46px; height: 46px; }
    .feature-badge svg { width: 23px; height: 23px; }
  }

  /* Two columns down to the narrowest common phone; the labels shrink rather
     than stacking, which is how the design reads. */
  @media (max-width: 420px) {
    .hero-checks { gap: 8px 12px; }
    .hero-checks li { font-size: 12.5px; }
    .hero-check svg { width: 17px; height: 17px; }
  }
  @media (max-width: 330px) {
    .hero-checks { grid-template-columns: minmax(0, 1fr); }
  }

  /* — app bar — */
  /* Sticky from the top on a laptop. Everything worth reaching from the bar —
     Ask Zimpan, the report, sign out — was a scroll back up the page, and the
     page is long. Opaque rather than translucent: the cards behind it carry
     their own borders, and a blurred edge over them reads as a rendering
     fault. z-index sits under the dialogs (60) and the floating column. */
  .appbar {
    display: flex; align-items: center; gap: 20px;
    padding: 14px 28px; border-bottom: 1px solid var(--color-divider);
    flex-wrap: wrap;
    position: sticky; top: 0; z-index: 30;
    background: var(--color-surface, #fff);
  }
  /* The phone has its own bars top and bottom; a third one pinned up here
     would eat a fifth of the screen. */
  @media (max-width: 720px) { .appbar { position: static; } }
  .appbar-meta {
    display: flex; align-items: center; gap: 8px; margin-right: auto;
    font-size: 12px; color: var(--color-neutral-700);
  }

  /* — the floating column: Ask, then back to top —
     Sits above the bottom bar rather than over it, so it never covers a
     destination. Present at every width; the long money page earns it on a
     desktop too.

     One fixed column rather than two separately fixed buttons, because
     back-to-top comes and goes with scroll position and Ask must not move when
     it does. A hidden flex child still occupies its track, so the slot below
     Ask stays reserved and the pill holds still.

     pointer-events are handed back to the children only: the column is as wide
     as the pill and as tall as both buttons plus the gap, and none of that
     empty space has any business swallowing clicks meant for the page. */
  .fabs {
    position: fixed; right: 16px; bottom: 20px; z-index: 46;
    display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
    pointer-events: none;
  }
  .fabs > * { pointer-events: auto; }

  /* Labelled rather than another circle: on a phone in full view this is the
     only way into the chat, since .appbar-cta is hidden below 720px, and an
     unlabelled icon is a poor thing to make the only door. Darker than
     back-to-top so the two read as different actions, and both follow the
     accent tokens, so the money tracker takes them into green unaided. */
  .fab-ask {
    display: inline-flex; align-items: center; gap: 8px;
    height: 44px; padding: 0 16px; border: 0; border-radius: 999px;
    background: var(--color-accent-900); color: #fff; cursor: pointer;
    font-family: var(--font-body); font-size: 13px; font-weight: 600;
    white-space: nowrap;
    box-shadow: 0 0 0 2px var(--color-bg), 0 2px 10px color-mix(in srgb, #2b2b2d 32%, transparent);
  }
  .fab-ask svg { width: 16px; height: 16px; display: block; }
  .fab-ask:hover { background: var(--color-accent-700); }
  .fab-ask:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

  .backtotop {
    width: 44px; height: 44px; border-radius: 50%; border: 0;
    background: var(--color-accent-700); color: #fff;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: 0 0 0 2px var(--color-bg), 0 2px 10px color-mix(in srgb, #2b2b2d 32%, transparent);
    opacity: 0; visibility: hidden; transform: translateY(6px);
    transition: opacity .18s ease, transform .18s ease, visibility .18s;
  }
  .backtotop svg { width: 21px; height: 21px; display: block; }
  .backtotop.is-on { opacity: 1; visibility: visible; transform: none; }
  .backtotop:hover { background: var(--color-accent-900); }
  .backtotop:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

  /* Clears the fixed bottom bar. Declared after the base rule rather than up in
     the phone block, which comes earlier in this file and would lose to it. */
  @media (max-width: 720px) {
    .fabs { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
  }

  /* — report toolbar —
     Pinned to the top of the preview's own scroller, so Close and the exports
     stay reachable however long the sheet runs. Darker than the backdrop it
     sits on, or the sheet would read through it as it scrolls past. */
  .report-tools {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-bottom: 14px; padding: 12px 0;
    background: color-mix(in srgb, var(--color-neutral-900) 80%, transparent);
  }
  .report-tools .btn { display: inline-flex; align-items: center; gap: 7px; }

  /* A dial you can ask about. Only the two with a list behind them get this —
     resting and the net are arithmetic over the other two and have nothing to
     open, so they stay plain and the affordance means something. */
  /* The way into a dial's breakdown. Its own control rather than the dial being
     one: two of these captions already contain buttons, and a button inside a
     button neither parses nor reads. */
  .cal-more {
    display: inline-block; margin-top: 7px; padding: 4px 10px;
    border: 1px solid color-mix(in srgb, var(--color-accent) 30%, transparent);
    border-radius: 999px; background: transparent; cursor: pointer;
    font-family: var(--font-body); font-size: 10.5px; font-weight: 600;
    color: var(--color-accent-700);
  }
  .cal-more:hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }
  .cal-more:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

  /* — the asking lightbox —
     One shell for every dialog that puts a question. Scrolls and centres
     safely: a tall one on a short phone would otherwise overflow the top of a
     centred flex box, where no scroll can reach it. */
  .lb-back {
    position: fixed; inset: 0; z-index: 70; overflow: auto; padding: 20px;
    background: color-mix(in srgb, var(--color-neutral-900) 58%, transparent);
    display: flex; align-items: safe center; justify-content: safe center;
  }
  .lb {
    position: relative; width: 420px; max-width: 100%; margin: auto;
    background: var(--color-bg); border-radius: 22px; padding: 26px 26px 22px;
    box-shadow: var(--shadow-lg); text-align: center;
  }
  /* Its own corner, clear of the title. The consent dialogs used to borrow the
     donation sheet's, which is placed to sit on that sheet's picture band —
     without one it landed on the heading. */
  .lb-x {
    position: absolute; top: 12px; right: 12px; z-index: 2;
    width: 34px; height: 34px; border: 0; border-radius: 50%; cursor: pointer;
    background: color-mix(in srgb, var(--color-text) 7%, transparent);
    color: var(--color-neutral-700); font-size: 15px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .lb-x:hover { background: color-mix(in srgb, var(--color-text) 14%, transparent); color: var(--color-text); }
  /* The medallion. Tinted from the tone the dialog is about, so a deletion, a
     privacy question and a note are told apart before a word is read. */
  .lb-mark {
    width: 56px; height: 56px; margin: 2px auto 14px; border-radius: 18px;
    display: grid; place-items: center;
    background: color-mix(in srgb, var(--lb-tone) 13%, transparent);
    color: var(--lb-tone);
  }
  .lb-kicker {
    font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
    font-weight: 700; margin-bottom: 6px;
  }
  .lb-title {
    margin: 0 0 10px; font-family: var(--font-heading); font-weight: 700;
    font-size: 21px; line-height: 1.24; color: var(--color-text);
  }
  .lb-body { font-size: 13.5px; line-height: 1.6; color: var(--color-neutral-800); text-align: left; }
  .lb-body p { margin: 0 0 11px; }
  .lb-body p:last-child { margin-bottom: 0; }
  .lb-acts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .lb-acts .btn { flex: 1 1 auto; min-height: 46px; border-radius: 999px; justify-content: center; }
  /* One under the other, in the order written. Two classes on purpose: the
     narrow-screen rule below turns every other action row upside down so the
     primary sits on top, and a stack whose order is the point must not be
     caught by it. */
  /* — the FAQ's collapsible entries —
     <details> with no JavaScript behind it, so nothing has to survive the next
     re-render. The default triangle is replaced by a marker that rotates: the
     native one sits outside the padded row and lines up with nothing. */
  .faq-item {
    border-bottom: 1px solid var(--color-divider);
  }
  .faq-item summary {
    list-style: none; cursor: pointer;
    display: flex; align-items: baseline; gap: 10px;
    padding: 11px 0; font-size: 14px; font-weight: 600;
    color: var(--color-text);
  }
  .faq-item summary::-webkit-details-marker { display: none; }
  .faq-item summary::before {
    content: '+'; flex: none; width: 14px;
    font-weight: 400; font-size: 16px; line-height: 1.1;
    color: var(--color-accent-700);
  }
  .faq-item[open] summary::before { content: '−'; }
  .faq-item summary:hover { color: var(--color-accent-700); }
  .faq-item summary:focus-visible {
    outline: 2px solid var(--color-accent-600); outline-offset: 2px; border-radius: 4px;
  }
  .faq-answer {
    padding: 0 0 14px 24px;
    font-size: 13.5px; line-height: 1.65; color: var(--color-neutral-800);
  }

  .lb-acts.lb-stack { flex-direction: column; }
  .lb-acts.lb-stack .btn { width: 100%; flex: 0 0 auto; }
  /* Figures worth reading before deciding to read more. Chips rather than a
     sentence: three short facts scan in a glance where a clause does not. */
  .lb-stats {
    display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; margin: 0 0 12px;
  }
  .lb-stats span {
    padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 600;
    background: color-mix(in srgb, var(--color-accent) 11%, transparent);
    color: var(--color-accent-700);
  }
  .lb-foot { margin: 12px 0 0; font-size: 11px; line-height: 1.5; color: var(--color-neutral-600); }

  @media (max-width: 430px) {
    .lb { padding: 22px 18px 18px; border-radius: 20px; }
    .lb-title { font-size: 19px; }
    /* Stacked, because two pill buttons side by side on a narrow phone leaves
       neither with room for its own words. */
    .lb-acts { flex-direction: column-reverse; }
    .lb-acts .btn { width: 100%; }
  }

  /* — chat with Zimpan —
     One class set behind two frames, like the money-out question: the phone
     drops it into a sheet, the laptop into a dialog. The log scrolls inside a
     fixed height so the field it is asked from never leaves the screen — a
     conversation that pushes its own input below the fold is unusable on a
     phone, which is where this was asked for. */
  .chat { display: flex; flex-direction: column; min-height: 0; }
  .chat-shell { width: 460px; max-width: 100%; margin: auto; padding: 16px 18px 14px; }
  .chat-head { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--color-divider); }
  .chat-mark {
    width: 34px; height: 34px; flex: none; border-radius: 11px; display: grid; place-items: center;
    background: color-mix(in srgb, var(--color-accent) 14%, transparent); color: var(--color-accent-700);
  }
  .chat-title { display: flex; flex-direction: column; min-width: 0; margin-right: auto; }
  .chat-title strong { font-family: var(--font-heading); font-size: 16px; line-height: 1.2; }
  .chat-title span { font-size: 11px; color: var(--color-neutral-600); }
  .chat-icon {
    flex: none; border: 0; background: transparent; cursor: pointer; font-size: 15px;
    min-width: 38px; min-height: 38px; border-radius: 10px; color: var(--color-neutral-700);
  }
  .chat-icon:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
  /* The icons are drawn, so they need centring in their hit area. */
  .chat-icon svg, .chat-mic svg { margin: 0 auto; }
  .chat-icon.is-on { color: var(--color-accent-700); }

  .chat-log {
    flex: 1; min-height: 180px; max-height: min(46vh, 380px); overflow-y: auto;
    overscroll-behavior: contain; padding: 14px 2px; display: flex; flex-direction: column; gap: 10px;
  }
  .chat-turn { display: flex; flex-direction: column; max-width: 86%; }
  .chat-turn.is-me { align-self: flex-end; align-items: flex-end; }
  .chat-turn.is-it { align-self: flex-start; align-items: flex-start; }
  .chat-bubble { padding: 10px 13px; border-radius: 15px; font-size: 14px; line-height: 1.5; }
  .is-me .chat-bubble { background: var(--color-accent); color: #fff; border-bottom-right-radius: 5px; }
  .is-it .chat-bubble {
    background: color-mix(in srgb, var(--color-text) 6%, transparent);
    color: var(--color-text); border-bottom-left-radius: 5px;
  }
  .chat-bubble.is-wait { display: inline-flex; align-items: center; gap: 9px; color: var(--color-neutral-700); }
  .chat-cut { margin-top: 4px; font-size: 10.5px; color: var(--color-neutral-600); }
  .chat-err { font-size: 12.5px; line-height: 1.5; color: #8a2f4a; padding: 2px 4px; }

  .chat-empty { margin: auto 0; text-align: center; }
  .chat-empty p { margin: 0 0 12px; font-size: 13px; line-height: 1.5; color: var(--color-neutral-700); }
  .chat-seeds { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; }
  .chat-seed {
    border: 1px solid color-mix(in srgb, var(--color-accent) 26%, transparent);
    background: transparent; border-radius: 999px; cursor: pointer; padding: 7px 12px;
    font-family: var(--font-body); font-size: 12.5px; color: var(--color-accent-700);
  }
  .chat-seed:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }

  .chat-ask { display: flex; align-items: center; gap: 8px; padding-top: 10px; border-top: 1px solid var(--color-divider); }
  .chat-input { flex: 1; min-width: 0; min-height: 44px; font-size: 15px; }
  .chat-send { flex: none; min-height: 44px; border-radius: 999px; padding-inline: 18px; }
  .chat-mic {
    flex: none; width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
    display: grid; place-items: center;
    border: 1px solid color-mix(in srgb, var(--color-accent) 30%, transparent);
    background: transparent; color: var(--color-accent-700);
  }
  .chat-mic:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }
  /* Listening has to be unmistakable — it is a live microphone. */
  .chat-mic.is-live { background: var(--zg-alert); border-color: var(--zg-alert); color: #fff; animation: chat-pulse 1.4s ease-in-out infinite; }
  @keyframes chat-pulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, #d92d20 45%, transparent); } 50% { box-shadow: 0 0 0 7px transparent; } }
  @media (prefers-reduced-motion: reduce) { .chat-mic.is-live { animation: none; } }
  .chat-foot { margin: 9px 0 0; font-size: 10.5px; line-height: 1.45; color: var(--color-neutral-600); text-align: center; }

  /* — money in and out, as lines —
     preserveAspectRatio is none so the plot fills its column at any width; the
     strokes are vector-effect'd so stretching the box does not stretch the line
     weight with it. */
  .mline-svg { display: block; width: 100%; height: 190px; }
  .mline-svg path { vector-effect: non-scaling-stroke; }
  .mline-axis { stroke: color-mix(in srgb, var(--color-text) 14%, transparent); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .mline-foot { display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap; margin-top: 10px; font-size: 11.5px; color: var(--color-neutral-700); }
  .mline-key { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
  .mline-key i { width: 10px; height: 3px; border-radius: 2px; flex: none; }
  .mline-span { margin-left: auto; color: var(--color-neutral-600); font-weight: 400; }

  /* — sleep, night by night —
     A column per night in the window, coloured by the band it falls in. Fixed
     height rather than aspect-driven: the bars are read against each other and
     against the bands, so the plot has to be the same height whether the window
     is seven nights or thirty. */
  .sleep-chart { margin: 2px 0 18px; padding: 14px 14px 12px; border-radius: 14px; background: color-mix(in srgb, var(--color-accent) 6%, transparent); }
  .sleep-chart-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    flex-wrap: wrap; margin-bottom: 12px; font-size: 11.5px; color: var(--color-neutral-700);
  }
  .sleep-avg { font-weight: 600; color: var(--color-accent-700); }
  .sleep-cols { display: flex; align-items: flex-end; gap: 3px; height: 110px; overflow-x: auto; }
  .sleep-col { flex: 1 1 0; min-width: 12px; display: flex; flex-direction: column; align-items: center; height: 100%; }
  .sleep-track { flex: 1; width: 100%; display: flex; align-items: flex-end; }
  .sleep-bar { width: 100%; border-radius: 4px 4px 0 0; min-height: 3px; }
  /* A night with nothing logged is a gap, drawn as one — a zero-height bar and
     an absent bar look identical, and only one of them is honest. */
  .sleep-none { width: 100%; height: 3px; border-radius: 2px; background: color-mix(in srgb, var(--color-text) 14%, transparent); }
  .sleep-day { margin-top: 5px; font-size: 9.5px; color: var(--color-neutral-600); white-space: nowrap; }
  .sleep-keys { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; }
  .sleep-key { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--color-neutral-700); }
  .sleep-key i { width: 9px; height: 9px; border-radius: 2px; flex: none; }

  /* — the money-out question —
     One class set behind two frames: the laptop's dialog and the phone's sheet
     drop the same markup in, so what the two layouts say about a spend cannot
     drift apart.

     The accent tokens are repointed on the block itself rather than the teal
     being hardcoded into each rule — the same trick [data-app="money"] uses
     above. It matters because the phone's sheet is rendered outside that
     wrapper: without this the primary button would come out violet there and
     teal on the laptop, for the same question. */
  .dq {
    --color-accent: #16a394;
    --color-accent-2: #0f766e;
    --color-accent-100: #e6f7f4;
    --color-accent-200: #c7ede7;
    --color-accent-600: #199184;
    --color-accent-700: #10756c;
    --grad-brand: linear-gradient(115deg, #2bb8a5 0%, #16a394 45%, #0f766e 100%);
    --grad-brand-hover: linear-gradient(115deg, #22a795 0%, #12907f 45%, #0b6259 100%);
    text-align: center;
  }
  .dq-shell { width: 470px; max-width: 100%; margin: auto; padding: 24px 24px 22px; }
  /* Scoped rather than bare, so the mobile type scale's `.blueprint h4` — a
     more specific selector — does not shrink the title inside the laptop's
     dialog when the window is narrow. */
  .dq .dq-title {
    margin: 0 0 5px; font-family: var(--font-heading); font-weight: 700;
    font-size: 21px; line-height: 1.22; color: var(--color-text);
  }
  .dq-sub { margin: 0; font-size: 12.5px; color: var(--color-neutral-600); }
  .dq-art { display: block; width: 64px; height: 56px; }

  /* — the two ways of filing it — */
  .dq-opts {
    position: relative; display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px; margin-top: 22px;
  }
  /* The amount rides the seam between the two cards: it is the subject of both,
     and putting it on either one would read as belonging to that answer. */
  .dq-pill {
    position: absolute; top: 0; left: 50%; transform: translate(-50%, -50%); z-index: 2;
    padding: 5px 15px; border-radius: 999px; white-space: nowrap;
    background: #fff; border: 1.5px solid color-mix(in srgb, #16a394 40%, transparent);
    font-family: var(--font-heading); font-weight: 700; font-size: 14px; color: #0f766e;
    box-shadow: 0 2px 8px color-mix(in srgb, #16a394 22%, transparent);
  }
  .dq-opt {
    position: relative; display: flex; flex-direction: column; align-items: center;
    padding: 24px 12px 16px; border-radius: 16px; border: 1.5px solid;
  }
  .dq-opt .dq-art { margin-bottom: 8px; }
  .dq-opt.is-take { border-color: color-mix(in srgb, #16a394 34%, transparent); background: #f0faf8; color: #0b5750; }
  .dq-opt.is-aside { border-color: color-mix(in srgb, #b8892e 30%, transparent); background: #fdf7ea; color: #7d5a15; }
  .dq-cap { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; }
  .dq-copy { margin: 6px 0 0; font-size: 11.5px; line-height: 1.5; color: var(--color-neutral-800); }
  .dq-tag {
    position: absolute; top: 8px; right: 8px; max-width: calc(100% - 16px);
    padding: 3px 8px; border-radius: 999px;
    font-size: 8px; letter-spacing: .09em; text-transform: uppercase; font-weight: 700;
    color: #8a6415; background: color-mix(in srgb, #e9a13b 26%, transparent);
  }

  /* — "do this every time" —
     A switch rather than a checkbox: it sets a standing preference, which is
     what a switch means and what a tickbox on a form does not. */
  .dq-switch {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; margin: 20px 0 14px; padding: 4px 0; border: 0; background: transparent;
    cursor: pointer; font-family: var(--font-body); font-size: 13px; color: var(--color-text);
  }
  .dq-track {
    position: relative; flex: none; width: 40px; height: 23px; border-radius: 999px;
    background: color-mix(in srgb, var(--color-text) 20%, transparent); transition: background .16s ease;
  }
  .dq-knob {
    position: absolute; top: 3px; left: 3px; width: 17px; height: 17px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 3px color-mix(in srgb, #241f30 34%, transparent);
    transition: transform .16s ease;
  }
  .dq-switch[aria-checked="true"] .dq-track { background: #16a394; }
  .dq-switch[aria-checked="true"] .dq-knob { transform: translateX(17px); }
  /* — the team page —
     Everything here is additional to the landing's own classes, which the page
     reuses wholesale: the bar, the hero, the strips and the feature cards are
     the same ones, so the two pages cannot drift apart as either is edited. */

  /* Third call to action under the hero's two. Ghost, not another filled pill:
     three equal buttons is a page that has not decided what it wants. */
  .hero-cta3 { font-size: 14px; padding: 10px 18px; border-radius: 999px; }

  /* The photograph, framed like the app's own surfaces so a stock image does
     not sit on the page looking pasted on. Aspect ratio is held so the layout
     does not jump between the placeholder and the real thing landing. */
  .team-shot {
    margin: 0; border-radius: 22px; overflow: hidden;
    background: var(--color-surface);
    border: 1px solid color-mix(in srgb, var(--color-accent-900) 12%, transparent);
    box-shadow: 0 18px 40px color-mix(in srgb, #2b2b2d 16%, transparent);
  }
  .team-shot img { display: block; width: 100%; height: auto; aspect-ratio: 900 / 620; object-fit: cover; }

  /* — roles — */
  .role-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
  .role-card {
    padding: 18px 20px; border-radius: 16px; background: var(--color-surface);
    border: 1px solid var(--color-divider);
  }
  .role-name {
    font-family: var(--font-heading); font-weight: 700; font-size: 17px;
    margin-bottom: 6px; color: var(--color-accent-900);
  }
  .role-card p { margin: 0; font-size: 13.5px; line-height: 1.6; color: var(--color-neutral-800); }

  /* — pricing —
     auto-fit rather than five fixed columns: five plans do not divide a laptop
     evenly and would each be too narrow to read, so they wrap into rows of
     whatever the width actually allows. */
  .plans { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
  .plan {
    display: flex; flex-direction: column; gap: 4px; text-align: center;
    padding: 20px 16px 18px; border-radius: 18px; background: var(--color-surface);
    border: 1px solid var(--color-divider);
  }
  .plan-name { font-family: var(--font-heading); font-weight: 700; font-size: 17px; }
  .plan-seats { font-size: 12px; color: var(--color-neutral-600); min-height: 30px; }
  .plan-price { display: flex; align-items: baseline; justify-content: center; gap: 3px; margin: 6px 0 14px; }
  .plan-amount { font-family: var(--font-heading); font-weight: 700; font-size: 30px; color: var(--color-accent-900); }
  .plan-per { font-size: 12.5px; color: var(--color-neutral-600); }
  .plan-go { margin-top: auto; width: 100%; min-height: 44px; border-radius: 999px; justify-content: center; }
  /* The recommended tier. Lifted, ringed and flagged rather than merely
     recoloured: on a row of five cards a colour change alone reads as a
     different kind of thing rather than as the one to choose. The flag sits on
     the border, which is why the card carries the top padding to clear it. */
  .plan.is-popular {
    border-color: var(--color-accent);
    box-shadow: 0 12px 30px color-mix(in srgb, var(--color-accent) 26%, transparent);
    padding-top: 26px;
    transform: translateY(-6px);
  }
  .plan-flag, .tm-plan-flag {
    position: absolute; top: -11px; left: 50%; transform: translateX(-50%);
    display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
    padding: 4px 12px; border-radius: 999px;
    background: var(--grad-brand, var(--color-accent)); color: #fff;
    font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  }
  .plan-flag svg, .tm-plan-flag svg { width: 12px; height: 12px; display: block; }
  .plan { position: relative; }
  .tm-plan { position: relative; }
  .tm-plan.is-popular { border-color: color-mix(in srgb, var(--color-accent) 55%, transparent); margin-top: 8px; padding-top: 18px; }
  .tm-plan-flag { left: 14px; transform: none; font-size: 9.5px; padding: 3px 9px; }

  /* Nothing lifts on a phone, where the cards are already stacked and a raised
     one only breaks the rhythm of the column. */
  @media (max-width: 560px) {
    .plan.is-popular { transform: none; }
  }

  .plans-foot { margin: 14px 0 0; text-align: center; font-size: 12.5px; color: var(--color-neutral-600); }

  /* — the team sheet —
     One lightbox with tabs rather than a screen of its own: managing a team is
     something you do occasionally and then leave, and a page you have to
     navigate back out of is the wrong shape for that. */
  /* Five tabs where there were four. The owner sees the most of them, and at
     the dialog's width the last one was being cut in half by .seg's own
     scroller — a control that looks broken rather than one that scrolls. The
     padding gives way before the labels do, which is the same answer .seg
     already gives on a narrow phone. */
  .tm-tabs { display: flex; width: 100%; margin-bottom: 14px; }
  .tm-tabs .seg-opt {
    flex: 1 1 0; min-width: 0; justify-content: center;
    padding-inline: 4px; font-size: 11.5px;
  }
  .tm-tabs .seg-opt span { overflow: hidden; text-overflow: ellipsis; }

  /* Five tabs will not fit a phone at a readable size, and "Dashbo…" is not a
     word. .seg is already its own scroller, so below this width the labels
     stop shrinking and the strip scrolls instead — the same answer the range
     picker gives to the same problem. */
  @media (max-width: 560px) {
    .tm-tabs .seg-opt { flex: none; padding-inline: 12px; font-size: 12.5px; }
    .tm-tabs .seg-opt span { overflow: visible; }
  }
  .tm-body { text-align: left; min-height: 120px; }
  .tm-cap { font-size: 12.5px; color: var(--color-neutral-700); margin-bottom: 10px; }
  .tm-list { display: flex; flex-direction: column; }
  .tm-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0; border-top: 1px solid var(--color-divider);
  }
  .tm-row:first-child { border-top: 0; }
  .tm-pending { opacity: .72; }
  .tm-who { display: flex; flex-direction: column; min-width: 0; margin-right: auto; }
  .tm-name { font-size: 14px; font-weight: 600; }
  .tm-mail { font-size: 11.5px; color: var(--color-neutral-600); }
  .tm-you { font-weight: 400; font-size: 11px; color: var(--color-neutral-600); }
  .tm-dot { flex: none; width: 10px; height: 10px; border-radius: 50%; }
  .tm-role {
    flex: none; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
    padding: 3px 9px; border-radius: 999px; background: var(--color-neutral-200); color: var(--color-neutral-800);
  }
  .tm-role-super { background: color-mix(in srgb, var(--color-accent) 18%, transparent); color: var(--color-accent-900); }
  .tm-act {
    flex: none; min-height: 32px; padding: 0 11px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--color-divider); background: var(--color-surface);
    font-family: var(--font-body); font-size: 12px; font-weight: 600; color: var(--color-text);
  }
  .tm-act:hover { border-color: color-mix(in srgb, var(--color-accent) 45%, transparent); }
  .tm-drop { color: #8a2f4a; }
  .tm-drop:hover { border-color: color-mix(in srgb, #8a2f4a 45%, transparent); }
  .tm-add { display: flex; gap: 8px; margin-top: 14px; }
  .tm-add .input { flex: 1 1 0; min-width: 0; min-height: 44px; }
  .tm-add .btn { flex: none; min-height: 44px; border-radius: 999px; }
  .tm-as { flex: 0 0 auto; min-height: 44px; }

  /* On a phone the invite row was three controls fighting over 340px: an email
     field too narrow to read the address back, a role select clipped mid-word,
     and the button squeezed against both. One per line instead — the form is
     three answers, not a toolbar, and there is no reason to treat it as one. */
  @media (max-width: 560px) {
    .tm-add { flex-direction: column; gap: 10px; }
    .tm-add .input, .tm-add .btn, .tm-as { width: 100%; flex: none; }
  }
  /* The invitation link, shown as well as emailed. Breaks anywhere: a token is
     one long unbroken word and would otherwise push the dialog sideways. */
  .tm-link {
    margin-top: 10px; padding: 10px 12px; border-radius: 12px;
    background: var(--color-neutral-200); font-size: 11.5px; text-align: left;
  }
  .tm-link code { display: block; margin-top: 4px; word-break: break-all; font-size: 11px; }
  .tm-empty, .tm-foot { font-size: 12.5px; line-height: 1.5; color: var(--color-neutral-600); margin: 12px 0 0; }
  .tm-err { font-size: 12.5px; color: #8a2f4a; margin: 10px 0 0; }
  .tm-ok { font-size: 12.5px; color: #16a394; margin: 10px 0 0; }
  .tm-sub {
    font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--color-neutral-600); margin: 14px 0 8px;
  }

  /* Somebody else's hours, editable in place. Scrolls inside itself so a busy
     month does not make the dialog taller than the screen. */
  .tm-hours { max-height: 46vh; overflow: auto; margin-top: 12px; }
  .tm-hrow {
    display: grid; grid-template-columns: minmax(0, 1fr) 84px 84px minmax(0, 110px) auto;
    gap: 6px; align-items: center; padding: 6px 0;
    border-top: 1px solid var(--color-divider);
  }
  .tm-hrow .input { min-height: 38px; font-size: 12.5px; padding-inline: 8px; }
  .tm-hdate { font-size: 11px; color: var(--color-neutral-600); white-space: nowrap; }
  @media (max-width: 560px) {
    /* The activity on its own line, the two times sharing the next, and the
       project under both. Five columns on a phone made every one of them too
       narrow to read what was in it. */
    .tm-hrow { grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px 0; }
    .tm-hact { grid-column: 1 / -1; }
    .tm-hproj { grid-column: 1 / -1; }
    .tm-hdate { grid-column: 1 / -1; }
    .tm-hrow .input { min-height: 42px; font-size: 13.5px; }
  }

  /* — the owner's dashboard — */
  .tm-bar { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
  .tm-blabel { flex: 0 0 34%; min-width: 0; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tm-btrack { flex: 1 1 0; height: 10px; border-radius: 999px; background: var(--color-neutral-200); overflow: hidden; }
  .tm-bfill { display: block; height: 100%; border-radius: 999px; }
  .tm-bval { flex: none; font-size: 11.5px; color: var(--color-neutral-700); min-width: 44px; text-align: right; }

  /* An empty tab, wearing its own tab's icon. A panel that says only "none"
     reads as something broken; this one reads as something not started. */
  .tm-none { text-align: center; padding: 22px 12px 6px; }
  .tm-none-mark {
    display: inline-grid; place-items: center; width: 44px; height: 44px;
    margin-bottom: 10px; border-radius: 14px;
    background: color-mix(in srgb, var(--color-accent) 10%, transparent);
    color: var(--color-accent);
  }
  .tm-none strong { display: block; font-size: 14.5px; margin-bottom: 5px; }
  .tm-none p { margin: 0 auto; max-width: 34ch; font-size: 12.5px; line-height: 1.55; color: var(--color-neutral-700); }

  /* — billing —
     The plan cards inside the team sheet, which are a different job from the
     ones on the pricing page: these are pressed by somebody who already has a
     team and needs to find the row that matches it. */
  .plan-kicker {
    font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--color-accent-700); margin-bottom: 2px;
  }
  .tm-bill-now { font-size: 13px; line-height: 1.5; padding: 11px 13px; border-radius: 12px; text-align: left; }
  .tm-bill-active { background: color-mix(in srgb, #16a394 12%, transparent); color: #0d6b60; }
  .tm-bill-trial { background: color-mix(in srgb, var(--color-accent) 10%, transparent); color: var(--color-accent-900); }
  .tm-bill-expired { background: color-mix(in srgb, #8a2f4a 10%, transparent); color: #7a2540; }

  /* The team's name and id, next to the buttons that need them. Breaks
     anywhere: an id is one unbroken word and would push the dialog sideways. */
  .tm-quote {
    margin-top: 10px; padding: 10px 12px; border-radius: 12px; text-align: left;
    background: var(--color-neutral-200); font-size: 11.5px; color: var(--color-neutral-800);
  }
  .tm-quote code { display: block; margin-top: 4px; word-break: break-all; font-size: 11.5px; font-weight: 600; color: var(--color-text); }

  .tm-plans { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .tm-plan {
    padding: 12px 14px; border-radius: 14px; text-align: left;
    border: 1px solid var(--color-divider); background: var(--color-surface);
  }
  .tm-plan.is-on { border-color: color-mix(in srgb, #16a394 55%, transparent); }
  .tm-plan-head { display: flex; align-items: baseline; gap: 10px; }
  .tm-plan-name { font-weight: 600; font-size: 14px; margin-right: auto; }
  .tm-plan-nick {
    margin-left: 7px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    font-weight: 600; color: var(--color-neutral-600);
  }
  .tm-plan-price { font-family: var(--font-heading); font-weight: 700; font-size: 17px; }
  .tm-plan-price span { font-size: 11px; font-weight: 400; color: var(--color-neutral-600); }
  .tm-plan-seats { font-size: 12px; color: var(--color-neutral-600); margin: 2px 0 9px; }
  .tm-plan-go { width: 100%; min-height: 40px; border-radius: 999px; font-size: 13.5px; }
  .tm-plan-on {
    display: inline-flex; align-items: center; min-height: 40px;
    font-size: 12.5px; font-weight: 600; color: #0d6b60;
  }

  /* Shown over whichever tab is open once a trial is over, so the reason a
     button has stopped working is never somewhere else. */
  .tm-over {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; text-align: left;
    margin-bottom: 12px; padding: 10px 12px; border-radius: 12px;
    background: color-mix(in srgb, #8a2f4a 9%, transparent);
    font-size: 12.5px; line-height: 1.45; color: #7a2540;
  }
  .tm-over span { flex: 1; min-width: 0; }

  /* — preferences —
     One row per standing answer. The segmented control is the app's own, given
     room to breathe and allowed to fill the width: three options at the
     dialog's measure, and on a narrow phone it scrolls inside itself rather
     than shrinking "Ask each time" into something unreadable — the same answer
     .seg already gives everywhere else. */
  .pref-row { text-align: left; padding: 14px 0; border-top: 1px solid var(--color-divider); }
  .pref-row:first-child { border-top: 0; padding-top: 4px; }
  .pref-name { font-weight: 600; font-size: 14px; }
  .pref-note { margin: 3px 0 10px; font-size: 12.5px; line-height: 1.45; color: var(--color-neutral-700); }
  .pref-seg { display: flex; width: 100%; }
  .pref-seg .seg-opt { flex: 1 1 0; justify-content: center; text-align: center; }

  /* Withdrawing reads as leaving, not as a switch: a consent you can flick
     back on in one tap is not a consent, it is a preference. */
  .pref-revoke {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    width: 100%; min-height: 44px; margin-top: 8px; padding: 0 14px;
    border: 1px solid var(--color-divider); border-radius: 12px;
    background: var(--color-surface); cursor: pointer;
    font-family: var(--font-body); font-size: 13.5px; color: var(--color-text);
  }
  .pref-revoke:hover { border-color: color-mix(in srgb, #8a2f4a 45%, transparent); }
  .pref-x { flex: none; font-size: 12.5px; font-weight: 600; color: #8a2f4a; }

  .dq-acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dq-go { width: 100%; min-height: 46px; border-radius: 999px; font-size: 14.5px; }

  /* — where it leaves you — */
  .dq-stats { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  .dq-stat {
    position: relative; display: flex; align-items: center; gap: 14px; text-align: left;
    padding: 28px 15px 16px; border-radius: 16px; border: 1.5px solid;
  }
  .dq-stat .dq-art { flex: none; width: 74px; height: 64px; }
  .dq-stat-tag {
    position: absolute; top: 9px; right: 12px; padding: 3px 9px; border-radius: 999px;
    font-size: 8.5px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700;
  }
  .dq-stat-fig { display: flex; flex-direction: column; min-width: 0; }
  .dq-stat-amt {
    font-family: var(--font-heading); font-weight: 700;
    font-size: clamp(21px, 6.2vw, 27px); line-height: 1.06;
  }
  .dq-stat-unit { font-size: 12.5px; font-weight: 600; opacity: .78; }
  .dq-stat-note { margin-top: 5px; font-size: 11.5px; line-height: 1.4; color: var(--color-neutral-800); }
  .dq-stat.is-bal { border-color: color-mix(in srgb, #16a394 34%, transparent); background: #f0faf8; color: #0b5750; }
  .dq-stat.is-bal .dq-stat-tag { background: color-mix(in srgb, #16a394 17%, transparent); color: #0b5750; }
  .dq-stat.is-in { border-color: color-mix(in srgb, #b8892e 30%, transparent); background: #fdf7ea; color: #7d5a15; }
  .dq-stat.is-in .dq-stat-tag { background: color-mix(in srgb, #e9a13b 26%, transparent); color: #7d5a15; }
  /* Spending and an overdrawn balance share the alert red, but not the same
     weight: two identical red cards in one column cannot be told apart at a
     glance, and only one of them is a warning. Spending stays a soft wash;
     the overdrawn balance takes a full-strength border. */
